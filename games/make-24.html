<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Make 24</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: graph-paper lab table; one board of four index cards, tools below, class mode = same cards at projector scale */
:root{
  --bg:#eef1f6; --grid:rgba(47,79,216,.07); --ink:#172033; --muted:#5b6478; --line:#d3d9e6;
  --card:#ffffff; --card-shadow:0 1px 0 rgba(23,32,51,.06),0 6px 16px rgba(23,32,51,.08);
  --accent:#2f4fd8; --accent-ink:#ffffff; --accent-soft:#e3e8fc;
  --hot:#f2a516; --hot-soft:#fff3d6; --ok:#17885b; --ok-soft:#dcf3e8; --bad:#c93a3a; --bad-soft:#fbe4e4;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141e; --grid:rgba(138,162,255,.06); --ink:#e6eaf3; --muted:#9aa4ba; --line:#2a3447;
  --card:#1a2232; --card-shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  --accent:#8aa2ff; --accent-ink:#0f141e; --accent-soft:#232e4c;
  --hot:#ffc24d; --hot-soft:#3a2f17; --ok:#4fd19a; --ok-soft:#173528; --bad:#ff7d7d; --bad-soft:#3d1d1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141e; --grid:rgba(138,162,255,.06); --ink:#e6eaf3; --muted:#9aa4ba; --line:#2a3447;
  --card:#1a2232; --card-shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  --accent:#8aa2ff; --accent-ink:#0f141e; --accent-soft:#232e4c;
  --hot:#ffc24d; --hot-soft:#3a2f17; --ok:#4fd19a; --ok-soft:#173528; --bad:#ff7d7d; --bad-soft:#3d1d1f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--display);font-weight:800;font-size:2rem;margin:0;letter-spacing:-.02em}
.brand h1 b{color:var(--accent)}
.brand span{color:var(--muted);font-size:.9rem}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:700;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button.tw[aria-pressed="true"]{background:var(--hot);color:#1d1606}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.rules{color:var(--muted);font-size:.95rem;max-width:62ch;margin:0}
.rules strong{color:var(--ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat.streak .v{color:var(--hot)}

/* cards */
.board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{position:relative;aspect-ratio:5/7;max-width:100%;border-radius:16px;border:2px solid var(--line);background:var(--card);
  box-shadow:var(--card-shadow);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;
  font-size:clamp(2.4rem,9vw,4.6rem);transition:transform .15s ease,border-color .15s,background .15s;padding:8px;min-width:0}
.card:hover{transform:translateY(-2px)}
.card .corner{position:absolute;top:8px;left:11px;font-size:.85rem;color:var(--muted);font-weight:700}
.card .corner.br{top:auto;left:auto;bottom:8px;right:11px;transform:rotate(180deg)}
.card .ex{position:absolute;bottom:8px;left:8px;right:8px;text-align:center;font-family:var(--body);font-weight:400;font-size:.78rem;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.derived{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.card.sel{border-color:var(--accent);transform:translateY(-6px);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent),var(--card-shadow)}
.card.hint{border-color:var(--hot);border-style:dashed;border-width:3px}
.card.empty{background:transparent;border:2px dashed var(--line);box-shadow:none;cursor:default}
.card.empty:hover{transform:none}
.card.long{font-size:clamp(1.5rem,5vw,2.6rem)}
.card.win{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.frac>span:first-child{border-bottom:.06em solid currentColor;padding:0 .08em .04em}
.frac>span{font-size:.62em}
.neg{margin-right:.04em}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s ease 2}

/* ops */
.ops{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.op{width:64px;height:58px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-weight:800;font-size:1.7rem;box-shadow:var(--card-shadow)}
.op[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.op.tw{border-color:color-mix(in srgb,var(--hot) 60%,var(--line));background:var(--hot-soft)}
.op.tw[aria-pressed="true"]{background:var(--hot);color:#1d1606}
.op:disabled{opacity:.4;cursor:not-allowed}
.op small{font-size:.6em}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:700;font-size:.95rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--bad)}
.btn.hot{background:var(--hot);color:#1d1606;border-color:var(--hot)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{min-height:1.6em;text-align:center;font-weight:700;margin:0}
.msg.good{color:var(--ok)} .msg.bad{color:var(--bad)} .msg.tip{color:color-mix(in srgb,var(--hot) 70%,var(--ink))}
.log{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:30px;padding:0;margin:0;list-style:none}
.log li{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.9rem;font-variant-numeric:tabular-nums}
.sol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;text-align:center}
.sol .expr{font-family:var(--display);font-weight:800;font-size:1.5rem;overflow-x:auto}
.sol .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

.overlay{position:absolute;inset:-6px;border-radius:18px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(2px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;z-index:2}
.overlay .big{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,10vw,5rem);color:var(--ok);line-height:1}
.overlay .pts{font-weight:700;color:var(--muted)}

/* class mode */
.class-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.timer{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,8vw,4.5rem);font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--bad)}
.tbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);width:100%;transition:width .25s linear}
.cboard .card{font-size:clamp(3rem,13vw,8.5rem);cursor:default}
.cboard .card:hover{transform:none}
.cboard.hidden .card{color:transparent}
.cboard.hidden .card .corner{color:transparent}
.cboard.hidden .card::after{content:"?";position:absolute;color:var(--line)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.team{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.team input{font:inherit;font-weight:700;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);padding:2px 0;width:100%}
.team .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.team .sc{font-family:var(--display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums}
.team .row button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:1.2rem}
.section-h{font-family:var(--display);font-weight:800;font-size:1.1rem;margin:0}
.small{font-size:.85rem;color:var(--muted)}
select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;font-weight:700}
.keys{font-size:.82rem;color:var(--muted);text-align:center;margin:0}
kbd{font-family:inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--card)}

@media (max-width:640px){
  .board{grid-template-columns:repeat(2,minmax(0,1fr));max-width:360px;margin:0 auto;width:100%}
  .stats{grid-template-columns:repeat(2,1fr)}
  .card{aspect-ratio:1/1;font-size:3rem}
  .op{width:56px;height:52px}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="brand"><h1>Make <b>24</b></h1><span>mental math warm-up</span></div>
    <div class="seg" role="group" aria-label="Mode">
      <button id="m-solo" aria-pressed="true">Solo play</button>
      <button id="m-class" aria-pressed="false">Class (projector)</button>
    </div>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="Difficulty" id="diff">
      <button data-d="easy" aria-pressed="false">Easy</button>
      <button data-d="medium" aria-pressed="true">Medium</button>
      <button data-d="hard" aria-pressed="false">Hard</button>
      <button data-d="twist" class="tw" aria-pressed="false">Physics Twist</button>
    </div>
    <p class="rules" id="rules"></p>
  </div>

  <!-- SOLO -->
  <section id="solo" style="display:flex;flex-direction:column;gap:16px">
    <div class="stats">
      <div class="stat"><div class="k">Score</div><div class="v" id="s-score">0</div></div>
      <div class="stat streak"><div class="k">Streak</div><div class="v" id="s-streak">0</div></div>
      <div class="stat"><div class="k">Best streak</div><div class="v" id="s-best">0</div></div>
      <div class="stat"><div class="k">Time</div><div class="v" id="s-time">0:00</div></div>
    </div>
    <div class="board" id="board"></div>
    <div class="ops" id="ops"></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <ul class="log" id="log" aria-label="Your steps"></ul>
    <div class="sol" id="solbox" hidden><div class="k">One solution</div><div class="expr" id="solexpr"></div></div>
    <div class="tools">
      <button class="btn" id="undo">Undo</button>
      <button class="btn" id="reset">Start over</button>
      <button class="btn hot" id="hint">Hint (−5)</button>
      <button class="btn warn" id="show">Show solution</button>
      <button class="btn primary" id="next">New puzzle</button>
    </div>
    <p class="keys">Keyboard: <kbd>1</kbd>–<kbd>4</kbd> pick a card, <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd> <kbd>^</kbd> operations, <kbd>Z</kbd> undo, <kbd>H</kbd> hint, <kbd>Enter</kbd> next</p>
  </section>

  <!-- CLASS -->
  <section id="class" hidden style="flex-direction:column;gap:16px">
    <div class="class-top">
      <div class="timer" id="c-time">1:00</div>
      <div class="tools">
        <label class="small" for="c-len">Round</label>
        <select id="c-len"><option value="30">30 s</option><option value="60" selected>60 s</option><option value="90">90 s</option><option value="120">2 min</option><option value="0">No timer</option></select>
        <button class="btn primary" id="c-next">Reveal next puzzle</button>
        <button class="btn" id="c-pause">Pause</button>
      </div>
    </div>
    <div class="tbar"><i id="c-bar"></i></div>
    <div class="board cboard hidden" id="cboard"></div>
    <div class="tools">
      <button class="btn hot" id="c-hint">Show first step</button>
      <button class="btn warn" id="c-show">Show solution</button>
      <button class="btn" id="c-full">Full screen</button>
    </div>
    <p class="msg tip" id="c-msg" aria-live="polite"></p>
    <div class="sol" id="c-solbox" hidden><div class="k">One solution</div><div class="expr" id="c-solexpr"></div></div>
    <div class="bar"><h2 class="section-h">Team scoreboard</h2>
      <div class="tools"><button class="btn" id="t-add">Add team</button><button class="btn" id="t-rm">Remove team</button><button class="btn warn" id="t-zero">Reset scores</button></div></div>
    <div class="teams" id="teams"></div>
  </section>
</div>

<script>
// ---- rational arithmetic + 24 solver (shared by build script and page) ----
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function R(n,d){if(d===undefined)d=1;if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return{n:n/g,d:d/g}}
const CAP=100000;
function ok(r){return r&&Math.abs(r.n)<=CAP&&r.d<=CAP}
function isqrt(x){if(x<0)return -1;const s=Math.round(Math.sqrt(x));return s*s===x?s:-1}
const OPS={
 '+':(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d),
 '−':(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),
 '×':(a,b)=>R(a.n*b.n,a.d*b.d),
 '÷':(a,b)=>b.n===0?null:R(a.n*b.d,a.d*b.n),
 '^':(a,b)=>{if(b.d!==1||b.n<1||b.n>6)return null;let n=Math.pow(a.n,b.n),d=Math.pow(a.d,b.n);if(Math.abs(n)>CAP||d>CAP)return null;return R(n,d)},
};
const UN={
 '√':a=>{const n=isqrt(a.n),d=isqrt(a.d);return n<0||d<0?null:R(n,d)},
 '²':a=>{const n=a.n*a.n,d=a.d*a.d;return n>CAP||d>CAP?null:R(n,d)},
};
const PREC={'+':1,'−':1,'×':2,'÷':2,'^':3};
function fmt(r){return r.d===1?String(r.n):r.n+'/'+r.d}
function wrap(it,need){return it.p<need?'('+it.e+')':it.e}
function binExpr(a,op,b){const P=PREC[op];let l,r;
 if(op==='^'){l=a.p<=3?'('+a.e+')':a.e;r=b.p<4?'('+b.e+')':b.e}
 else{l=wrap(a,P);r=(b.p<P||(b.p===P&&(op==='−'||op==='÷')))?'('+b.e+')':b.e}
 return{e:l+' '+op+' '+r,p:P}}
function unExpr(op,a){if(op==='√')return{e:'√'+(a.p<4?'('+a.e+')':a.e),p:4};return{e:(a.p<4?'('+a.e+')':a.e)+'²',p:3}}
function item(v,e,p){return{v,e:e===undefined?fmt(v):e,p:p===undefined?(v.d===1&&v.n>=0?4:2):p}}
function key(items,u){return items.map(x=>x.v.n+'/'+x.v.d).sort().join(',')+'|'+u}
function solve(values,opt){opt=opt||{};const twist=!!opt.twist,limit=opt.limit||400;
 const target=opt.target||24;const items0=values.map(v=>v.e!==undefined?v:item(v));
 const dead=new Set();const sols=[];
 const bops=twist?['+','×','−','÷','^']:['+','×','−','÷'];
 function rec(items,u,steps){
  if(sols.length>=limit)return true;
  let found=false;
  if(items.length===1&&items[0].v.n===target&&items[0].v.d===1){sols.push({steps:steps.slice(),expr:items[0].e});found=true}
  const k=key(items,u);if(dead.has(k))return false;
  for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
   const rest=items.filter((_,t)=>t!==i&&t!==j);
   for(const op of bops){const orders=(op==='+'||op==='×')?[[i,j]]:[[i,j],[j,i]];
    for(const [x,y] of orders){const a=items[x],b=items[y];const v=OPS[op](a.v,b.v);if(!ok(v))continue;
     const ex=binExpr(a,op,b);const r={v,e:ex.e,p:ex.p};
     steps.push({a:a.v,op,b:b.v,r:v});if(rec(rest.concat([r]),u,steps))found=true;steps.pop();
     if(sols.length>=limit)return true}}}
  if(twist&&u>0){for(let i=0;i<items.length;i++){const a=items[i];
   for(const op of ['√','²']){const v=UN[op](a.v);if(!ok(v)||(v.n===a.v.n&&v.d===a.v.d))continue;
    const ex=unExpr(op,a);const r={v,e:ex.e,p:ex.p};const nx=items.slice();nx[i]=r;
    steps.push({a:a.v,op,b:null,r:v});if(rec(nx,u-1,steps))found=true;steps.pop();if(sols.length>=limit)return true}}}
  if(!found)dead.add(k);return found}
 rec(items0,opt.unary===undefined?2:opt.unary,[]);
 for(const s of sols){let sc=0,frac=false,div=false;
  for(const st of s.steps){if(st.op==='÷'){sc+=2;div=true}if(st.op==='−')sc+=.5;if(st.op==='^'||!st.b)sc+=1;
   if(st.r.d!==1){sc+=6;frac=true}if(st.r.n<0)sc+=3;if(Math.abs(st.r.n)>100)sc+=2}
  s.score=sc;s.frac=frac;s.div=div}
 sols.sort((a,b)=>a.score-b.score);return sols}
function stepText(st){return st.b?fmt(st.a)+' '+st.op+' '+fmt(st.b)+' = '+fmt(st.r):(st.op==='√'?'√'+fmt(st.a):fmt(st.a)+'²')+' = '+fmt(st.r)}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDealer(){const decks={};return d=>{if(!decks[d]||!decks[d].length)decks[d]=shuffle(POOL[d]);return shuffle(decks[d].pop())}}

function setMsg(t,cls){const m=$('msg');m.textContent=t;m.className='msg'+(cls?' '+cls:'')}

    const aria={'+':'plus','−':'minus','×':'times','÷':'divide','^':'power','√':'square root','²':'square'}[o];

function renderSolo(){

    if(isLong(c.v))cls.push('long');if(S.done&&!S.gaveUp)cls.push('win');

function live(){return S.cards.filter(Boolean)}
function apply(newCard,removeIdx,placeIdx,text){
  S.hist.push({cards:S.cards.slice(),text});
  const c=S.cards.slice();if(removeIdx>=0)c[removeIdx]=null;c[placeIdx]=newCard;S.cards=c;
  S.sel=placeIdx;S.op=null;S.hintIds=[];

    if(L[0].v.n===24&&L[0].v.d===1)return win();
    setMsg(`That makes ${fmt(L[0].v)}, not 24. Undo a step or start over.`,'bad');shakeBoard();
  }else setMsg('');

function shakeBoard(){const b=$('board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
function win(){
  const sec=Math.round((Date.now()-S.start)/1000);
  const speed=Math.max(0,10-Math.floor(sec/6));
  const pts=Math.max(5,BASE[diff]+speed-5*S.hints);

function clickCard(i){
  if(S.done)return;const c=S.cards[i];if(!c)return;
  if(S.sel===-1||S.sel===i&&!S.op){S.sel=S.sel===i?-1:i;S.op=null;renderSolo();return}
  if(S.sel===i){S.op=null;renderSolo();return}
  if(!S.op){S.sel=i;renderSolo();return}
  const a=S.cards[S.sel],op=S.op;
  const v=OPS[op](a.v,c.v);
  if(!v){setMsg(op==='÷'?'You can’t divide by zero.':'Exponents must be whole numbers from 1 to 6.','bad');return}
  if(Math.abs(v.n)>100000||v.d>100000){setMsg('That number is too big to keep track of. Try something else.','bad');return}
  const ex=binExpr(a,op,c);
  apply({id:nextId++,v,e:ex.e,p:ex.p,orig:false},S.sel,i,`${fmt(a.v)} ${op} ${fmt(c.v)} = ${fmt(v)}`);

function clickOp(op){
  if(S.done)return;
  if(op==='√'||op==='²'){
    if(S.sel<0){setMsg('Pick a card first, then press '+(op==='√'?'√':'x²')+'.','tip');return}
    const a=S.cards[S.sel];const v=UN[op](a.v);
    if(!v){setMsg(op==='√'?`√${fmt(a.v)} isn’t a whole number or fraction. Try another card.`:'That number is too big.','bad');return}
    const ex=unExpr(op,a);
    apply({id:nextId++,v,e:ex.e,p:ex.p,orig:false},-1,S.sel,(op==='√'?'√'+fmt(a.v):fmt(a.v)+'²')+' = '+fmt(v));return}
  if(S.sel<0){setMsg('Pick a card first, then an operation, then a second card.','tip');return}
  S.op=S.op===op?null:op;renderSolo();
}
function undo(){if(!S.hist.length||S.done)return;const h=S.hist.pop();S.cards=h.cards;S.sel=-1;S.op=null;S.hintIds=[];setMsg('');renderSolo()}

function hint(){
  if(S.done)return;const L=live();
  const sols=solve(L.map(c=>({v:c.v,e:c.e,p:c.p})),{twist:diff==='twist',limit:150});

  const st=sols[0].steps[0];S.hints++;

  for(const v of st.b?[st.a,st.b]:[st.a]){const c=L.find(c=>!used.has(c.id)&&c.v.n===v.n&&c.v.d===v.d);if(c){used.add(c.id);ids.push(c.id)}}

}

document.addEventListener('keydown',e=>{
  if(mode!=='solo'||e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;

  if(!C.len){t.textContent='∞';t.classList.remove('low');$('c-bar').style.width='100%';return}
  const s=Math.ceil(C.left);t.textContent=fmtTime(Math.max(0,s));t.classList.toggle('low',C.left<=10&&!!C.hand);
  $('c-bar').style.width=(100*Math.max(0,C.left)/C.len)+'%';
}
function cNext(){
  C.hand=dealClass(diff);C.len=+$('c-len').value;C.left=C.len;C.running=!!C.len;C.last=performance.now();
  $('c-solbox').hidden=true;$('c-msg').textContent='';renderClass();
}
function tick(now){
  if(C.running&&mode==='class'){C.left-= (now-C.last)/1000;
    if(C.left<=0){C.left=0;C.running=false;$('c-msg').textContent='Time! Hands down. Who got it?';renderClass()}
    renderTimer()}
  C.last=now;requestAnimationFrame(tick)}
requestAnimationFrame(tick);
$('c-next').onclick=cNext;
$('c-pause').onclick=()=>{C.running=!C.running&&C.left>0;renderClass()};
$('c-len').onchange=()=>{C.len=+$('c-len').value;C.left=C.len;renderTimer()};
$('c-hint').onclick=()=>{const s=solve(C.hand.map(n=>R(n)),{twist:diff==='twist',limit:150});$('c-msg').textContent=s.length?'First step: '+stepText(s[0].steps[0]):''};
$('c-show').onclick=()=>{const s=solve(C.hand.map(n=>R(n)),{twist:diff==='twist',limit:150});$('c-solexpr').textContent=s[0].expr+' = 24';$('c-solbox').hidden=false;C.running=false;renderClass()};
$('c-full').onclick=()=>{try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{$('c-msg').textContent='Full screen isn’t available here. Try your browser’s full-screen key (F11).'})}catch(e){}};
function renderTeams(){
  $('teams').innerHTML=C.teams.map((t,i)=>`<div class="team"><input id="team-${i}" aria-label="Team name" value="${t.n.replace(/"/g,'&quot;')}" data-t="${i}">
    <div class="row"><button data-t="${i}" data-d="-1" aria-label="Subtract a point">−</button><span class="sc">${t.s}</span><button data-t="${i}" data-d="1" aria-label="Add a point">+</button></div></div>`).join('');
  store.set('teams',C.teams);
}
$('teams').addEventListener('click',e=>{const b=e.target.closest('button[data-d]');if(!b)return;C.teams[+b.dataset.t].s+=+b.dataset.d;renderTeams()});
$('teams').addEventListener('input',e=>{const i=e.target.dataset.t;if(i!==undefined){C.teams[+i].n=e.target.value;store.set('teams',C.teams)}});
$('t-add').onclick=()=>{if(C.teams.length<8){C.teams.push({n:'Team '+(C.teams.length+1),s:0});renderTeams()}};
$('t-rm').onclick=()=>{if(C.teams.length>1){C.teams.pop();renderTeams()}};
let zeroArmed=false;
$('t-zero').onclick=()=>{if(!zeroArmed){zeroArmed=true;$('t-zero').textContent='Tap again to reset';setTimeout(()=>{zeroArmed=false;$('t-zero').textContent='Reset scores'},3000);return}
  zeroArmed=false;$('t-zero').textContent='Reset scores';C.teams.forEach(t=>t.s=0);renderTeams()};

/* ---------------- shared ---------------- */
function setDiff(d){diff=d;store.set('diff',d);
  document.querySelectorAll('#diff button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===d));
  $('rules').innerHTML=RULES[d];
  if(mode==='solo')newPuzzle();else{C.hand=null;C.running=false;$('c-solbox').hidden=true;$('c-msg').textContent='';renderClass()}
}
$('diff').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b)setDiff(b.dataset.d)});
function setMode(m){mode=m;$('m-solo').setAttribute('aria-pressed',m==='solo');$('m-class').setAttribute('aria-pressed',m==='class');
  $('solo').hidden=m!=='solo';$('class').hidden=m!=='class';$('class').style.display=m==='class'?'flex':'';$('solo').style.display=m==='solo'?'flex':'';
  if(m==='class'){renderClass();renderTeams()}}
$('m-solo').onclick=()=>setMode('solo');$('m-class').onclick=()=>setMode('class');

document.querySelectorAll('#diff button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===diff));
newPuzzle();
</script>

</body></html>

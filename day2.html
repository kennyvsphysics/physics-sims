<script>
// ===== Forces sub-days: shared physics + answer-checking core (pure functions; also run by node tests) =====
// Conventions: g = 9.8 m/s^2. Angles in degrees, measured counter-clockwise from +x (right), y up.
const G = 9.8;
const D2R = Math.PI / 180;

// ---------- answer checking ----------
// Accepts "4.9", "4.9 m/s^2", "-3", "−3" (unicode minus), "1.2e3", "1.2 x 10^3", "1,200"
function parseNum(s) {
  if (s === null || s === undefined) return NaN;
  s = String(s).trim().replace(/[\u2212\u2013\u2014]/g, '-').replace(/(\d),(\d{3})/g, '$1$2').replace(/^\+/, '');
  const m = s.match(/^([-]?\s*\d*\.?\d+(?:e[-+]?\d+)?)\s*(?:(?:x|\u00d7|\*)\s*10\s*\^\s*([-+]?\d+))?/i);
  if (!m) return NaN;
  let v = parseFloat(m[1].replace(/\s+/g, ''));
  if (m[2] !== undefined) v *= Math.pow(10, +m[2]);
  return v;
}
// tol: {rel: fraction} and/or {abs: value}. Default: 1.5 % relative.
// Returns {ok, v, bad (unparseable), close (within 5 %), sign (right magnitude, wrong sign), g10 (looks like g = 10 was used)}
function checkNum(input, ans, tol, opt) {
  const v = parseNum(input);
  if (!isFinite(v)) return { ok: false, bad: true, v };
  tol = tol || {};
  const rel = tol.rel !== undefined ? tol.rel : (tol.abs !== undefined ? 0 : 0.015);
  const allowed = Math.max(tol.abs || 0, rel * Math.abs(ans), 1e-12);
  const ok = Math.abs(v - ans) <= allowed;
  const sign = !ok && ans !== 0 && Math.abs(v + ans) <= allowed;
  const close = !ok && Math.abs(v - ans) <= Math.max(0.05 * Math.abs(ans), allowed * 3);
  let g10 = false;
  if (!ok && opt && opt.g10 !== undefined) g10 = Math.abs(v - opt.g10) <= Math.max(0.01 * Math.abs(opt.g10), 1e-9);
  return { ok, v, bad: false, sign, close, g10 };
}
function sameSet(a, b) { a = [...a].sort(); b = [...b].sort(); return a.length === b.length && a.every((x, i) => x === b[i]); }
function checkMC(choice, ans) { return Array.isArray(ans) ? sameSet(choice || [], ans) : choice === ans; }

// ---------- free-body diagrams ----------
const normAng = a => ((Math.round(a) % 360) + 360) % 360;
function snapAngle(deg, allowed) {
  let best = allowed[0], bd = 1e9;
  for (const a of allowed) { const d = Math.abs(((deg - a + 540) % 360) - 180); if (d < bd) { bd = d; best = a; } }
  return normAng(best);
}
// placed: {key: {dir, len}}; spec: {expect:[{f, dir}], rel:[[keyA, '>'|'<'|'=', keyB]]}
// Returns {ok, missing:[keys], extra:[keys], wrongDir:[keys], relFail:[[a,op,b]]}
function checkFBD(placed, spec) {
  placed = placed || {};
  const exp = {}; for (const e of spec.expect) exp[e.f] = normAng(e.dir);
  const missing = [], extra = [], wrongDir = [], relFail = [];
  for (const k in exp) { if (!placed[k]) missing.push(k); else if (normAng(placed[k].dir) !== exp[k]) wrongDir.push(k); }
  for (const k in placed) if (!(k in exp)) extra.push(k);
  if (!missing.length && !extra.length && !wrongDir.length) {
    for (const r of (spec.rel || [])) {
      const A = placed[r[0]].len, B = placed[r[2]].len;
      const good = r[1] === '>' ? A > B : r[1] === '<' ? A < B : A === B;
      if (!good) relFail.push(r);
    }
  }
  return { ok: !missing.length && !extra.length && !wrongDir.length && !relFail.length, missing, extra, wrongDir, relFail };
}

// ---------- 2.1 center of mass ----------
function centerOfMass(ms, xs) { let M = 0, s = 0; for (let i = 0; i < ms.length; i++) { M += ms[i]; s += ms[i] * xs[i]; } return M > 0 ? s / M : NaN; }

// ---------- 2.5 / 2.7 box on a level floor, applied force F at angle ang above horizontal ----------
// p: {m, F, ang, mus, muk, g}. v = current velocity (m/s, + right). Static friction adopts the value needed (up to mus*N).
function boxForces(p, v) {
  const g = p.g || G, th = (p.ang || 0) * D2R;
  const Fx = p.F * Math.cos(th), Fy = p.F * Math.sin(th), W = p.m * g;
  const lift = Fy > W;
  const N = Math.max(0, W - Fy), fsMax = p.mus * N, fk = p.muk * N;
  let f, regime;
  if (v === 0) {
    if (Math.abs(Fx) <= fsMax + 1e-12) { f = -Fx; regime = 'static'; }
    else { f = -Math.sign(Fx) * fk; regime = 'kinetic'; }
  } else { f = -Math.sign(v) * fk; regime = 'kinetic'; }
  if (lift) { f = 0; regime = 'none'; }
  const Fnet = Fx + f;
  return { Fx, Fy, W, N, fsMax, fk, f, regime, Fnet, a: Fnet / p.m, lift };
}
// one time step with the "friction can't reverse the motion" rule: if v would cross zero, the object stops there.
function stepWithStop(forcesFn, p, s, dt) {
  const fr = forcesFn(p, s.v);
  const v2 = s.v + fr.a * dt;
  if (s.v !== 0 && Math.sign(v2) !== Math.sign(s.v)) {
    const tz = -s.v / fr.a;
    return { t: s.t + dt, x: s.x + s.v * tz + 0.5 * fr.a * tz * tz, v: 0, fr: forcesFn(p, 0) };
  }
  return { t: s.t + dt, x: s.x + s.v * dt + 0.5 * fr.a * dt * dt, v: v2, fr };
}
const boxStep = (p, s, dt) => stepWithStop(boxForces, p, s, dt);

// ---------- inclines (2.2.B.4, 2.5, 2.7): v measured DOWN the slope ----------
function inclineForces(p, v) {
  const g = p.g || G, th = p.ang * D2R, W = p.m * g;
  const Wpar = W * Math.sin(th), N = W * Math.cos(th), fsMax = p.mus * N, fk = p.muk * N;
  let f, regime;
  if (v === 0) {
    if (Wpar <= fsMax + 1e-12) { f = -Wpar; regime = 'static'; }
    else { f = -fk; regime = 'kinetic'; }
  } else { f = -Math.sign(v) * fk; regime = 'kinetic'; }
  const Fnet = Wpar + f;
  return { W, Wpar, Wperp: N, N, fsMax, fk, f, regime, Fnet, a: Fnet / p.m };
}
const inclineStep = (p, s, dt) => stepWithStop(inclineForces, p, s, dt);
const criticalAngle = mus => Math.atan(mus) / D2R;

// ---------- connected objects (2.1 systems, 2.3.A.3 tension, 2.5) ----------
// Modified Atwood: m1 on a horizontal table (friction mus/muk), string over ideal pulley to hanging m2. + = m2 moving down.
function tableAtwood(p, moving) {
  const g = p.g || G, drive = p.m2 * g, fsMax = p.mus * p.m1 * g, fk = p.muk * p.m1 * g;
  if (!moving && drive <= fsMax + 1e-12) return { a: 0, T: drive, f: drive, regime: 'static', drive, fsMax, fk };
  const a = (drive - fk) / (p.m1 + p.m2);
  return { a, T: p.m2 * (g - a), f: fk, regime: 'kinetic', drive, fsMax, fk };
}
// Classic Atwood: two hanging masses on an ideal pulley. + = m2 moving down.
function atwood(p) {
  const g = p.g || G, a = (p.m2 - p.m1) * g / (p.m1 + p.m2), T = 2 * p.m1 * p.m2 * g / (p.m1 + p.m2);
  return { a, T };
}

// ---------- apparent weight in an elevator (2.6.C) + springs (2.8) ----------
// a = elevator acceleration (+ up). Scale reading (normal force) N = m (g + a), never negative.
const apparentWeight = (m, a, g) => Math.max(0, m * ((g || G) + a));
const springStretch = (k, m, a, g) => m * ((g || G) + a) / k; // Hooke: k x = m (g + a)
// Elevator trips (+ = up). Presets: 'up' / 'down' match the v-t graph in Day 3 Q13 (speed up 0-2 s, cruise 2-6 s, slow 6-8 s, rest 8-10 s).
// 'custom': A = { v0, a } -> cruise at v0 for 2 s, then accelerate at a (until it stops if a opposes v0, else for 3 s), then constant velocity.
function elevatorProfile(type, A) {
  if (type === 'up') return [{ t0: 0, t1: 2, a: A }, { t0: 2, t1: 6, a: 0 }, { t0: 6, t1: 8, a: -A }, { t0: 8, t1: 10, a: 0 }];
  if (type === 'down') return [{ t0: 0, t1: 2, a: -A }, { t0: 2, t1: 6, a: 0 }, { t0: 6, t1: 8, a: A }, { t0: 8, t1: 10, a: 0 }];
  if (type === 'custom') { const v0 = A.v0 || 0, a = A.a || 0; let segs;
    if (Math.abs(a) < 1e-9) segs = [{ t0: 0, t1: 10, a: 0 }];
    else { const opp = Math.abs(v0) > 1e-9 && Math.sign(a) !== Math.sign(v0), dur = opp ? Math.min(7, Math.abs(v0 / a)) : 3;
      segs = [{ t0: 0, t1: 2, a: 0 }, { t0: 2, t1: 2 + dur, a }, { t0: 2 + dur, t1: 10, a: 0 }]; }
    segs.v0 = v0; return segs; }
  // 'drop': cable fails -> free fall 1 s, then emergency brakes decelerate at +g for 1 s
  return [{ t0: 0, t1: 1, a: 0 }, { t0: 1, t1: 2, a: -G }, { t0: 2, t1: 3, a: G }, { t0: 3, t1: 10, a: 0 }];
}
function elevatorAt(segs, t) {
  let v = segs.v0 || 0, y = 0;
  for (const s of segs) {
    const d = Math.max(0, Math.min(t, s.t1) - s.t0);
    if (t < s.t1) { y += v * d + 0.5 * s.a * d * d; v += s.a * d; return { a: s.a, v: Math.abs(v) < 1e-9 ? 0 : v, y }; }
    y += v * d + 0.5 * s.a * d * d; v += s.a * d;
  }
  return { a: 0, v: Math.abs(v) < 1e-9 ? 0 : v, y };
}
// words for the motion: "slowing down, moving down" etc.
function motionLabel(v, a) {
  if (Math.abs(a) < 1e-9) return Math.abs(v) < 1e-6 ? 'at rest' : 'constant velocity ' + (v > 0 ? 'up' : 'down');
  if (Math.abs(v) < 1e-6) return 'starting from rest, speeding up ' + (a > 0 ? 'upward' : 'downward');
  return (Math.sign(a) === Math.sign(v) ? 'speeding up' : 'slowing down') + ', moving ' + (v > 0 ? 'up' : 'down');
}

// ---------- Newton's 3rd law skaters (2.3) ----------
// Push of magnitude F lasting tp seconds; A on the left (moves left, -), B on the right (moves right, +). Frictionless ice.
function skaters(p, t) {
  const aA = -p.F / p.mA, aB = p.F / p.mB, tt = Math.min(t, p.tp), after = Math.max(0, t - p.tp);
  const vA = aA * tt, vB = aB * tt;
  const xA = p.xA0 + 0.5 * aA * tt * tt + vA * after, xB = p.xB0 + 0.5 * aB * tt * tt + vB * after;
  return { aA: t < p.tp ? aA : 0, aB: t < p.tp ? aB : 0, vA, vB, xA, xB, pushing: t < p.tp, xcm: (p.mA * xA + p.mB * xB) / (p.mA + p.mB) };
}

const PHYS = { G, D2R, parseNum, checkNum, checkMC, sameSet, normAng, snapAngle, checkFBD, centerOfMass, boxForces, boxStep, stepWithStop,
  inclineForces, inclineStep, criticalAngle, tableAtwood, atwood, apparentWeight, springStretch, elevatorProfile, elevatorAt, motionLabel, skaters };
if (typeof module !== 'undefined') module.exports = PHYS;

</script>

const fmt = (x, d) => { if (!isFinite(x)) return '—'; if (d !== undefined) return (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); const a = Math.abs(x); return a >= 100 ? x.toFixed(0) : a >= 10 ? x.toFixed(1) : x.toFixed(2); };

const UI = {
  canvas(host, hCss) { const cv = document.createElement('canvas'); host.appendChild(cv); const o = { cv, ctx: cv.getContext('2d'), w: 600, h: hCss };
    o.fit = () => { const dpr = window.devicePixelRatio || 1; o.w = Math.max(280, host.clientWidth - 2); o.h = typeof hCss === 'function' ? hCss(o.w) : hCss; cv.width = o.w * dpr; cv.height = o.h * dpr; cv.style.width = o.w + 'px'; cv.style.height = o.h + 'px'; o.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    o.fit(); return o; },
  arrow(ctx, x0, y0, dx, dy, col, label, opt) { opt = opt || {}; const L = Math.hypot(dx, dy); if (L < 2) return; ctx.save(); ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = opt.w || 3; if (opt.dash) ctx.setLineDash([6, 4]);
    const ux = dx / L, uy = dy / L, hl = Math.min(12, L * 0.45); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + dx - ux * hl * 0.8, y0 + dy - uy * hl * 0.8); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x0 + dx, y0 + dy); ctx.lineTo(x0 + dx - ux * hl - uy * hl * 0.5, y0 + dy - uy * hl + ux * hl * 0.5); ctx.lineTo(x0 + dx - ux * hl + uy * hl * 0.5, y0 + dy - uy * hl - ux * hl * 0.5); ctx.closePath(); ctx.fill();
    if (label) { ctx.font = 'bold 13px system-ui'; ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; const lx = x0 + dx + ux * 10 + (opt.lx || 0) - (ux < -0.3 ? ctx.measureText(label).width : ux < 0.3 ? ctx.measureText(label).width / 2 : 0), ly = y0 + dy + uy * 12 + 4 + (opt.ly || 0); ctx.strokeText(label, lx, ly); ctx.fillText(label, lx, ly); }
    ctx.restore(); },
  // series: [{pts:[[x,y],...], col, label, dash}] ; o: {xmax, ymin, ymax, xlabel, ylabel, title, hlines:[{y,col,label}]}
  plot(ctx, X, Y, W, H, series, o) { o = o || {}; ctx.save(); ctx.fillStyle = '#fff'; ctx.fillRect(X, Y, W, H); ctx.strokeStyle = '#ccd'; ctx.strokeRect(X + .5, Y + .5, W - 1, H - 1);
    const L = X + 44, R = X + W - 8, T = Y + 18, B = Y + H - 22; let ymin = o.ymin, ymax = o.ymax;
    if (ymin === undefined || ymax === undefined) { let lo = 0, hi = 0; for (const s of series) for (const p of s.pts) { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); } for (const h of (o.hlines || [])) { lo = Math.min(lo, h.y); hi = Math.max(hi, h.y); } if (hi - lo < (o.minSpan || 1)) { const c = (hi + lo) / 2, sp = (o.minSpan || 1) / 2; if (lo >= 0 && c - sp < 0) { lo = 0; hi = 2 * sp; } else { lo = c - sp; hi = c + sp; } } const pad = (hi - lo) * 0.1; if (ymin === undefined) ymin = lo < 0 ? lo - pad : 0; if (ymax === undefined) ymax = hi + pad; }
    const xmin = o.xmin || 0, xmax = o.xmax || 10, sx = x => L + (x - xmin) / (xmax - xmin) * (R - L), sy = y => B - (y - ymin) / (ymax - ymin) * (B - T);
    ctx.font = '11px system-ui'; ctx.fillStyle = '#556'; ctx.strokeStyle = '#eef0f4'; ctx.lineWidth = 1;
    const nice = span => { const raw = span / 5, p = Math.pow(10, Math.floor(Math.log10(raw))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= raw) return m * p; return 10 * p; };
    const ys = nice(ymax - ymin); for (let v = Math.ceil(ymin / ys) * ys; v <= ymax + 1e-9; v += ys) { const yy = sy(v); ctx.beginPath(); ctx.moveTo(L, yy); ctx.lineTo(R, yy); ctx.stroke(); ctx.textAlign = 'right'; ctx.fillText(+v.toFixed(6) + '', L - 4, yy + 4); }
    const xs = nice(xmax - xmin); for (let v = Math.ceil(xmin / xs) * xs; v <= xmax + 1e-9; v += xs) { const xx = sx(v); ctx.beginPath(); ctx.moveTo(xx, T); ctx.lineTo(xx, B); ctx.stroke(); ctx.textAlign = 'center'; ctx.fillText(+v.toFixed(6) + '', xx, B + 13); }
    ctx.strokeStyle = '#334'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, B); ctx.lineTo(R, B); ctx.stroke();
    if (ymin < 0 && ymax > 0) { ctx.strokeStyle = '#99a'; ctx.beginPath(); ctx.moveTo(L, sy(0)); ctx.lineTo(R, sy(0)); ctx.stroke(); }
    for (const h of (o.hlines || [])) { ctx.strokeStyle = h.col || '#888'; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(L, sy(h.y)); ctx.lineTo(R, sy(h.y)); ctx.stroke(); ctx.setLineDash([]); if (h.label) { ctx.fillStyle = h.col || '#888'; ctx.textAlign = 'right'; ctx.fillText(h.label, R - 2, sy(h.y) - 3); } }
    ctx.save(); ctx.beginPath(); ctx.rect(L, T - 2, R - L, B - T + 4); ctx.clip();
    for (const s of series) { if (!s.pts.length) continue; ctx.strokeStyle = s.col; ctx.lineWidth = s.w || 2.2; if (s.dash) ctx.setLineDash([6, 4]); ctx.beginPath(); s.pts.forEach((p, i) => { const xx = sx(p[0]), yy = sy(p[1]); i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }); ctx.stroke(); ctx.setLineDash([]);
      if (s.dot !== false) { const p = s.pts[s.pts.length - 1]; ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(sx(p[0]), sy(p[1]), 3.5, 0, 7); ctx.fill(); } }
    ctx.restore();
    ctx.fillStyle = '#234'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'left'; ctx.fillText(o.title || '', L + 4, Y + 13); ctx.font = '11px system-ui'; ctx.fillStyle = '#556'; ctx.textAlign = 'right'; ctx.fillText(o.xlabel || '', R, Y + 13);
    ctx.restore(); return { sx, sy }; },
  slider(host, o) { const d = document.createElement('div'); d.className = 'sl'; d.innerHTML = `<span>${o.label}</span><input type="range" min="${o.min}" max="${o.max}" step="${o.step}" value="${o.val}"><output></output>`; host.appendChild(d);
    const inp = $('input', d), out = $('output', d), dec = o.dec !== undefined ? o.dec : (o.step < 1 ? (String(o.step).split('.')[1] || '').length : 0);
    const show = () => { out.textContent = (+inp.value).toFixed(dec) + (o.unit ? ' ' + o.unit : ''); };
    inp.addEventListener('input', () => { show(); o.oninput && o.oninput(+inp.value); }); show();
    return { el: d, input: inp, get: () => +inp.value, set: v => { inp.value = v; show(); }, disable: b => { inp.disabled = b; d.style.opacity = b ? .5 : 1; } }; },
  html(host, h) { const d = document.createElement('div'); d.innerHTML = h; while (d.firstChild) host.appendChild(d.firstChild); return host.lastChild; },
};

// ---------- the engine ----------
const Engine = (() => {
  let L, S, KEY, storageOK = true, active = [], loops = [], tick = null;
  const QS = [];
  function load() { try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; storageOK = false; } if (!S || S.v !== 1) S = fresh(); }
  function fresh() { return { v: 1, name: '', period: '', cur: -1, seen: {}, ans: {}, log: [], started: null, updated: null, secs: 0 }; }
  function save() { S.updated = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; } }
  function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
  const secQs = sec => (sec.blocks || []).filter(b => b.type === 'q');
  function secStatus(i) { const sec = L.sections[i]; if (sec.type === 'summary') return allDone() ? 'done' : 'todo'; const qs = secQs(sec);
    if (!qs.length) return S.seen[sec.id] ? 'done' : 'todo'; const d = qs.filter(q => S.ans[q.id] && S.ans[q.id].done).length; return d === qs.length ? 'done' : d || S.seen[sec.id] ? 'part' : 'todo'; }
  const allDone = () => L.sections.every((s, i) => s.type === 'summary' || secStatus(i) === 'done');
  function scores() { let pts = 0, max = 0, exit = 0, exitMax = 0, fr = 0, frMax = 0, answered = 0;
    for (const q of QS) { const a = S.ans[q.id]; if (q.qt === 'fr') { frMax++; if (a && a.done) fr++; continue; } const p = q.pts || 1; max += p; if (a && a.done) answered++; const sc = a && a.score ? a.score * p : 0; pts += sc; if (q.tag === 'exit') { exitMax += p; exit += sc; } }
    return { pts, max, exit, exitMax, fr, frMax, answered, total: QS.filter(q => q.qt !== 'fr').length }; }
  function header() { const n = L.sections.filter(s => s.type !== 'summary').length, d = L.sections.filter((s, i) => s.type !== 'summary' && secStatus(i) === 'done').length, sc = scores();
    $('#hdrProg').innerHTML = `<span>Progress</span><div class="bar" title="${d} of ${n} sections complete"><i style="width:${(100 * d / n).toFixed(0)}%"></i></div><span>${d}/${n} sections · ${fmt(sc.pts, sc.pts % 1 ? 2 : 0)}/${sc.max} pts</span>` + (storageOK ? '' : ' <span style="color:#ffb4a8">⚠ progress not saving — keep this tab open</span>');
    $('#who').innerHTML = S.name ? '👤 ' + esc(S.name) : ''; }
  function nav() { $('#side').innerHTML = `<div class="panel"><h3>Lesson map</h3><button class="navi ${S.cur === -1 ? 'on' : ''}" data-i="-1"><span class="st ${S.name ? 'done' : ''}">${S.name ? '✓' : ''}</span><span>Start here<small>name + instructions</small></span></button>` +
      L.sections.map((s, i) => { const st = secStatus(i); return `<button class="navi ${S.cur === i ? 'on' : ''}" data-i="${i}"><span class="st ${st}">${st === 'done' ? '✓' : ''}</span><span>${i + 1}. ${s.title}<small>${s.time ? s.time + ' · ' : ''}${s.ced ? 'CED ' + s.ced.join(', ') : ''}</small></span></button>`; }).join('') +
      `<div class="g" style="padding:6px 4px">✓ = complete · half = started.<br>Your work saves automatically in this browser.</div></div>`;
    $$('#side .navi').forEach(b => b.onclick = () => go(+b.dataset.i)); }
  function cleanup() { for (const a of active) { try { a && a.destroy && a.destroy(); } catch (e) { console.error(e); } } active = []; loops.forEach(l => l.stop = true); loops = []; }
  function loop(fn) { const L0 = { stop: false }; let last = performance.now(); const f = now => { if (L0.stop) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; try { fn(dt); } catch (e) { console.error(e); L0.stop = true; } requestAnimationFrame(f); }; requestAnimationFrame(f); loops.push(L0); return L0; }
  function go(i) { if (!S.name && i !== -1) { toast('Type your name first, then press Start.'); i = -1; } cleanup(); S.cur = i; save(); render(); window.scrollTo(0, 0); }
  function render() { header(); nav(); const m = $('#main'); if (S.cur === -1) return renderStart(m); const sec = L.sections[S.cur]; if (sec.type === 'summary') return renderSummary(m); renderSection(m, sec, S.cur); }
  function renderStart(m) { m.innerHTML = `<div class="panel startcard"><h2>${L.title}</h2><div class="chips">${L.ced.map(c => `<span class="chip">${c}</span>`).join('')}<span class="chip time">about ${L.minutes} minutes</span></div>
    <p>${L.intro}</p><h3>Today you will be able to…</h3><ul>${L.goals.map(g => `<li>${g}</li>`).join('')}</ul>
    <h3>How this works</h3><ul><li>Work through the sections <b>in order</b> using the lesson map on the left or the <b>Next ▶</b> button.</li><li>Read the short explanations, try the worked examples <b>before</b> you reveal the solution, and use each simulation.</li>
    <li>Questions give instant feedback. Full credit on the 1st try, half credit on the 2nd, a quarter after that. Hints are free. After 2 misses you may reveal the answer (0 points).</li>
    <li>Your work saves automatically <b>in this browser on this Chromebook</b>. A refresh will not lose it. Do not use Incognito or clear browsing data.</li>
    <li>At the end, open the <b>Summary</b>, then print or save it as a PDF (<kbd>Ctrl</kbd>+<kbd>P</kbd>) or take a screenshot, and turn it in the way your teacher asked.</li></ul>
    <div class="panel" style="background:#f3f6ff"><label><b>Your full name:</b> <input type="text" id="nm" value="${esc(S.name)}" maxlength="60" placeholder="First Last" autocomplete="name"></label>
    &nbsp; <label>Class period: <input type="text" id="per" value="${esc(S.period)}" maxlength="12" style="width:80px"></label>
    <div class="row" style="margin-top:10px"><button class="go big" id="startBtn">${S.name ? 'Continue ▶' : 'Start ▶'}</button>${S.started ? `<span class="g">Started ${new Date(S.started).toLocaleString()}</span>` : ''}</div>
    ${storageOK ? '' : '<p class="mis">⚠ This browser is blocking saved progress. Keep this tab open until you finish and print your summary.</p>'}</div>
    ${S.started ? `<p class="g">Not your work, or need a fresh start? <button id="wipe" class="warn">Erase all saved work for this lesson</button></p>` : ''}</div>`;
    $('#startBtn').onclick = () => { const n = $('#nm').value.trim(); if (n.length < 2) { toast('Please type your full name.'); $('#nm').focus(); return; } S.name = n; S.period = $('#per').value.trim(); if (!S.started) S.started = Date.now(); save(); go(firstUnfinished()); };
    $('#nm').onkeydown = e => { if (e.key === 'Enter') $('#startBtn').click(); };
    const w = $('#wipe'); if (w) w.onclick = () => { if (prompt('Type ERASE to delete all saved answers for this lesson on this device.') === 'ERASE') { S = fresh(); save(); render(); toast('Erased.'); } }; }
  function firstUnfinished() { for (let i = 0; i < L.sections.length; i++) if (L.sections[i].type !== 'summary' && secStatus(i) !== 'done') return i; return L.sections.length - 1; }
  function renderSection(m, sec, i) { m.innerHTML = `<div class="panel"><h2>${i + 1}. ${sec.title}</h2><div class="chips">${sec.time ? `<span class="chip time">⏱ ${sec.time}</span>` : ''}${(sec.ced || []).map(c => `<span class="chip">CED ${c}</span>`).join('')}${(sec.sp || []).map(c => `<span class="chip" style="background:#f4ecff;border-color:#cbb8ef">Practice ${c}</span>`).join('')}</div><div id="blocks"></div></div>
      <div class="navbtns noprint"><button id="prev" ${i === 0 ? '' : ''}>◀ Back</button><span class="g" id="secMsg"></span><button class="go big" id="next">${i + 1 < L.sections.length ? 'Next ▶' : 'Summary ▶'}</button></div>`;
    const host = $('#blocks');
    for (const b of sec.blocks) {
      if (b.type === 'html') UI.html(host, b.html);

  function textSummary() { const sc = scores(); let t = `${strip(L.title)} — ${S.name}${S.period ? ' (Period ' + S.period + ')' : ''}\nScore: ${sc.pts}/${sc.max} · Exit ticket ${sc.exit}/${sc.exitMax} · Written ${sc.fr}/${sc.frMax} · ${new Date().toLocaleString()}\n\n`;
    for (const q of QS) { const a = S.ans[q.id]; t += `${q.tag === 'exit' ? 'Exit ' : ''}Q${q.n}: ${q.qt === 'fr' ? (a && a.done ? a.value : '(not submitted)') : strip(studentText(q, a))}${q.qt !== 'fr' ? ' [' + (a && a.done ? (a.revealed ? 'revealed' : 'correct, ' + a.tries + ' tries') : 'not finished') + ']' : ''}\n`; } return t; }
  function fillPrint() { $('#printArea').innerHTML = summaryHTML(); }
  // ---------- boot ----------
  function start(lesson) { L = lesson; KEY = 'ap1forces:' + L.id; let n = 0;
    L.sections.forEach((s, si) => (s.blocks || []).forEach(b => { if (b.qtype) { b.type = 'q'; b.qt = b.qtype; } if (b.type === 'q') { b.n = ++n; b.secIdx = si; b.secTitle = s.title; QS.push(b); } }));
    document.title = strip(L.title);
    document.body.innerHTML = `<header><h1>${L.short}</h1><div id="hdrProg"></div><span id="who"></span><button id="sumBtn" title="Summary / print">🖨 Summary</button></header><div id="wrap"><nav id="side"></nav><main id="main"></main></div><div id="printArea"></div><div id="toast" class="toast"></div>`;
    $('#sumBtn').onclick = () => go(L.sections.length - 1); load();
    try { localStorage.setItem('ap1forces:test', '1'); localStorage.removeItem('ap1forces:test'); } catch (e) { storageOK = false; }
    if (S.cur >= L.sections.length || !S.name) S.cur = -1; render();
    window.addEventListener('beforeprint', fillPrint);
    tick = setInterval(() => { if (document.visibilityState === 'visible' && S.name) { S.secs += 15; save(); } }, 15000);
    let lastW = innerWidth; window.addEventListener('resize', () => { clearTimeout(window._rs); window._rs = setTimeout(() => { if (Math.abs(innerWidth - lastW) < 40) return; lastW = innerWidth; const ae = document.activeElement; if (ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT') && ae.type !== 'range') return; if (S.cur >= 0 && L.sections[S.cur].type !== 'summary') { const y = scrollY; cleanup(); render(); scrollTo(0, y); } }, 250); }); }
  return { start, go, get state() { return S; }, get lesson() { return L; }, QS, scores, grade, summaryHTML, textSummary, answerText, toast, loop };
})();

<script>
// ===== DAY 2: Newton's second law, gravity & weight, friction, angled forces =====
const D2F = ['Fg', 'FN', 'Ff', 'Fapp', 'FT', 'Fmotion', 'Fnet'];
// mini graph SVG for friction-vs-applied-force choices
function fGraph(kind) {
  const P = { a: 'M20,90 L120,20', b: 'M20,90 L80,40 L80,58 L130,58', c: 'M20,58 L130,58', d: 'M20,90 L80,40 L130,40' }[kind];
  return `<svg viewBox="0 0 140 105" width="150" height="112" style="vertical-align:middle;background:#fff;border:1px solid #ccd;border-radius:4px"><line x1="20" y1="90" x2="135" y2="90" stroke="#334"/><line x1="20" y1="90" x2="20" y2="8" stroke="#334"/><path d="${P}" fill="none" stroke="#d9480f" stroke-width="3"/><text x="78" y="102" font-size="9" text-anchor="middle" fill="#334">applied force F</text><text x="8" y="50" font-size="9" fill="#334" transform="rotate(-90 8 50)" text-anchor="middle">friction f</text></svg>`;
}

// ---------- sim: push-a-box lab (2.5, 2.7) ----------
function simBox(el, api) {
  const { UI, PHYS } = api;
  const SURF = { none: { n: 'Frictionless (μs 0, μk 0)', mus: 0, muk: 0, col: '#d6efff' }, ice: { n: 'Ice (μs 0.10, μk 0.05)', mus: 0.10, muk: 0.05, col: '#e3f4ff' },
    wood: { n: 'Wood on wood (μs 0.50, μk 0.30)', mus: 0.50, muk: 0.30, col: '#d9c6a5' }, rubber: { n: 'Rubber on concrete (μs 1.0, μk 0.80)', mus: 1.0, muk: 0.80, col: '#c9c9c9' }, custom: { n: 'Custom μ…', mus: 0.4, muk: 0.2, col: '#e8dcc8' } };
  const p = { m: 20, F: 0, ang: 0, mus: 0.5, muk: 0.3 }; let surf = 'wood', s = { t: 0, x: 0, v: 0 }, running = false, ramp = false, rampF = 0, gtab = 'v', liftMsg = false;
  let vpts = [], apts = [], fpts = [], trials = api.load('trials', []), pred = null, predDone = false;
  el.innerHTML = `<div class="simgrid"><div><div class="cv1"></div>
      <div class="row tabs" style="margin:6px 0 4px"><span class="g">Graph:</span><button data-g="v" class="on">v vs t</button><button data-g="a">a vs t</button><button data-g="f">friction vs applied force</button></div><div class="cv2"></div></div>
    <div class="ctrl"><div class="row">Surface: <select class="sf">${Object.entries(SURF).map(([k, o]) => `<option value="${k}" ${k === 'wood' ? 'selected' : ''}>${o.n}</option>`).join('')}</select></div>
      <div class="sls"></div><div class="sls2 hide"></div>
      <label class="row" style="margin:2px 0"><input type="checkbox" class="rp"> Ramp the push up slowly from 0 (10 N/s)</label>
      <div class="row"><button class="run go big" style="flex:1">▶ Run</button><button class="kick">Kick: v = 3 m/s</button><button class="rs">⟲ Reset</button></div>
      <div class="readout ro"></div>
      <div class="pred"><label><input type="checkbox" class="pm"> <b>Predict mode</b></label><div class="pq hide">Before you press Run, predict the box’s acceleration: <input class="pa" type="text" inputmode="decimal" style="width:70px"> m/s² <div class="pres g"></div></div></div>
      <div class="row"><button class="rec">📋 Record this trial</button><button class="clr">Clear table</button></div></div></div>
    <div class="tw" style="overflow-x:auto"></div>`;
  const c1 = UI.canvas($('.cv1', el), 230), c2 = UI.canvas($('.cv2', el), 185);
  const sF = UI.slider($('.sls', el), { label: 'Applied force F', min: 0, max: 200, step: 2, val: 0, unit: 'N', oninput: v => { p.F = v; predDone = false; } });
  const sA = UI.slider($('.sls', el), { label: 'Angle above horizontal', min: -30, max: 60, step: 5, val: 0, unit: '°', oninput: v => p.ang = v });
  const sM = UI.slider($('.sls', el), { label: 'Mass m', min: 2, max: 50, step: 1, val: 20, unit: 'kg', oninput: v => p.m = v });
  const sMs = UI.slider($('.sls2', el), { label: 'μs (static)', min: 0, max: 1.2, step: 0.05, val: 0.4, oninput: v => { p.mus = v; if (p.muk > v) { p.muk = v; sMk.set(v); } } });
  const sMk = UI.slider($('.sls2', el), { label: 'μk (kinetic)', min: 0, max: 1.2, step: 0.05, val: 0.2, oninput: v => { p.muk = Math.min(v, p.mus); sMk.set(p.muk); } });
  const clearGraphs = () => { vpts = []; apts = []; fpts = []; };
  $('.sf', el).onchange = e => { surf = e.target.value; const o = SURF[surf]; if (surf === 'custom') { p.mus = sMs.get(); p.muk = sMk.get(); } else { p.mus = o.mus; p.muk = o.muk; } $('.sls2', el).classList.toggle('hide', surf !== 'custom'); };
  $('.rp', el).onchange = e => { ramp = e.target.checked; sF.disable(ramp); if (ramp) { rampF = 0; p.F = 0; sF.set(0); } };
  $$('.tabs button', el).forEach(b => b.onclick = () => { gtab = b.dataset.g; $$('.tabs button', el).forEach(x => x.classList.toggle('on', x === b)); draw(); });
  const runBtn = $('.run', el);
  runBtn.onclick = () => { if (!running && pred !== null && !predDone) { const g = PHYS.parseNum($('.pa', el).value); if (g === null || isNaN(g)) { $('.pres', el).textContent = 'Type your prediction first (or turn off predict mode).'; return; } pred = g; }
    running = !running; runBtn.textContent = running ? '⏸ Pause' : '▶ Run'; };
  $('.kick', el).onclick = () => { s.v = 3; if (!running) runBtn.click(); };
  const reset = () => { s = { t: 0, x: 0, v: 0 }; running = false; runBtn.textContent = '▶ Run'; rampF = 0; if (ramp) { p.F = 0; sF.set(0); } clearGraphs(); predDone = false; liftMsg = false; $('.pres', el).textContent = ''; draw(); };
  $('.rs', el).onclick = reset;
  $('.pm', el).onchange = e => { $('.pq', el).classList.toggle('hide', !e.target.checked); pred = e.target.checked ? NaN : null; predDone = false; };
  $('.pa', el).oninput = () => { predDone = false; };
  function forces() { return PHYS.boxForces(p, s.v); }
  $('.rec', el).onclick = () => { const fr = forces(); trials.push({ m: p.m, F: p.F, ang: p.ang, surf: surf === 'custom' ? `μs ${p.mus}, μk ${p.muk}` : SURF[surf].n.split(' (')[0], N: fr.N, f: Math.abs(fr.f), reg: fr.regime, Fnet: fr.Fnet, a: fr.lift ? NaN : fr.a }); if (trials.length > 12) trials.shift(); api.save('trials', trials); table(); };
  $('.clr', el).onclick = () => { trials = []; api.save('trials', trials); table(); };
  function table() { $('.tw', el).innerHTML = trials.length ? `<table class="t"><tr><th>#</th><th>m (kg)</th><th>F (N)</th><th>angle</th><th>surface</th><th>F<sub>N</sub> (N)</th><th>friction (N)</th><th>F<sub>net</sub> (N)</th><th>a (m/s²)</th></tr>${trials.map((r, i) => `<tr><td>${i + 1}</td><td>${r.m}</td><td>${r.F}</td><td>${r.ang}°</td><td>${r.surf}</td><td>${fmt(r.N, 1)}</td><td>${fmt(r.f, 1)} (${r.reg})</td><td>${fmt(r.Fnet, 1)}</td><td>${isFinite(r.a) ? fmt(r.a, 2) : 'lifts off'}</td></tr>`).join('')}</table>` : '<p class="g">Press <b>Record this trial</b> to log the current numbers here. Try doubling F, or doubling m, and compare a.</p>'; }
  function step(dt) {
    if (ramp) { rampF = Math.min(200, rampF + 10 * dt); p.F = Math.round(rampF * 10) / 10; sF.set(Math.round(p.F)); }
    const n = 10; for (let i = 0; i < n; i++) s = PHYS.boxStep(p, s, dt / n);
    const fr = forces(); if (fr.lift) { running = false; runBtn.textContent = '▶ Run'; liftMsg = true; }
    vpts.push([s.t, s.v]); apts.push([s.t, fr.a]); if (ramp) fpts.push([fr.Fx, Math.abs(fr.f)]);
    while (vpts.length && vpts[0][0] < s.t - 10) { vpts.shift(); apts.shift(); }
    if (pred !== null && isFinite(pred) && !predDone && s.t > 0.3) { predDone = true; const ok = Math.abs(pred - fr.a) <= Math.max(0.1, 0.05 * Math.abs(fr.a));
      $('.pres', el).innerHTML = `Predicted ${pred} m/s² · actual ${fmt(fr.a, 2)} m/s² ${ok ? '✔ nice!' : '✘ Check: a = F<sub>net</sub>/m, and is the box even moving?'}`; api.log(`Box (m ${p.m} kg, F ${p.F} N at ${p.ang}°, ${SURF[surf].n}): predicted a = ${pred}, actual ${fmt(fr.a, 2)} m/s²`); }
    if (Math.abs(s.x) > 1e4) s.x = 0;
  }
  function draw() {
    const ctx = c1.ctx, W = c1.w, H = c1.h, sc = 40, gy = 170, fr = forces(), ox = W * 0.42 - s.x * sc;
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#f7fbff'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = SURF[surf].col; ctx.fillRect(0, gy, W, H - gy);
    if (p.mus > 0) { ctx.strokeStyle = '#0002'; for (let x = (ox % 12) - 12; x < W; x += 12) { ctx.beginPath(); ctx.moveTo(x, gy + 12); ctx.lineTo(x + 8, gy + 3); ctx.stroke(); } }
    ctx.fillStyle = '#456'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
    for (let m = Math.ceil(-ox / sc); m <= (W - ox) / sc; m++) { ctx.fillRect(ox + m * sc, gy, 1, m % 5 ? 5 : 10); if (m % 5 === 0) ctx.fillText(m + ' m', ox + m * sc, gy + 24); }
    const side = 34 + 10 * Math.cbrt(p.m), bx = W * 0.42, by = gy - side / 2;
    ctx.fillStyle = '#c8894b'; ctx.strokeStyle = '#7a4f26'; ctx.lineWidth = 2; ctx.fillRect(bx - side / 2, gy - side, side, side); ctx.strokeRect(bx - side / 2, gy - side, side, side);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui'; ctx.fillText(p.m + ' kg', bx, by + 4);
    const big = Math.max(fr.W, p.F, 20), k = 75 / big, th = p.ang * Math.PI / 180;
    if (p.F > 0) { const ax = Math.cos(th) * p.F * k, ay = -Math.sin(th) * p.F * k; // applied force drawn as a pull from the front (angle up) or push from behind (angle down)
      if (p.ang >= 0) { ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(bx + side / 2, by); ctx.lineTo(bx + side / 2 + Math.cos(th) * 120, by - Math.sin(th) * 120); ctx.stroke(); UI.arrow(ctx, bx + side / 2, by, ax, ay, '#2b8a3e', 'F_app ' + fmt(p.F, 0) + ' N', { ly: -6 }); }
      else UI.arrow(ctx, bx - side / 2 - ax, by - side * 0.2 - ay, ax, ay, '#2b8a3e', 'F_app ' + fmt(p.F, 0) + ' N', { lx: -60, ly: -16 }); }
    if (Math.abs(fr.f) > 1e-6) UI.arrow(ctx, bx, gy - 5, fr.f * k, 0, '#d9480f', 'F_f ' + fmt(Math.abs(fr.f), 1) + ' N', { ly: -12 });
    if (Math.abs(s.v) > 1e-3) UI.arrow(ctx, bx - side / 2, gy - side - 16, Math.max(-120, Math.min(120, s.v * 18)), 0, '#555', 'v ' + fmt(s.v, 2) + ' m/s', { dash: true, ly: -4 });
    // inset FBD
    const ix = W - 85, iy = 108, q = 52 / big; ctx.fillStyle = '#fff'; ctx.fillRect(ix - 78, 6, 156, 170); ctx.strokeStyle = '#ccd'; ctx.lineWidth = 1; ctx.strokeRect(ix - 78, 6, 156, 170); ctx.fillStyle = '#234'; ctx.font = 'bold 11px system-ui'; ctx.fillText('Free-body diagram', ix, 19);
    UI.arrow(ctx, ix - 3, iy, 0, fr.W * q, '#7b3fd0', 'F_g'); if (fr.N > 0) UI.arrow(ctx, ix + 3, iy, 0, -fr.N * q, '#2563eb', 'F_N');
    if (p.F > 0) UI.arrow(ctx, ix, iy, Math.cos(th) * p.F * q, -Math.sin(th) * p.F * q, '#2b8a3e', 'F_app'); if (Math.abs(fr.f) > 1e-6) UI.arrow(ctx, ix, iy + 3, fr.f * q, 0, '#d9480f', 'F_f', { ly: 10 });
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(ix, iy, 4, 0, 7); ctx.fill();
    if (liftMsg) { ctx.fillStyle = '#c92a2a'; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'left'; ctx.fillText('The upward part of F_app is bigger than F_g: the box lifts off! (not a floor problem any more)', 10, 22); }
    const moving = s.v !== 0; ctx.textAlign = 'left'; ctx.font = 'bold 13px system-ui'; ctx.fillStyle = fr.regime === 'static' ? '#1d7a35' : '#a14a00'; ctx.fillText(fr.regime === 'static' ? (p.F > 0 ? 'Static friction holds it: f = F_app,x' : 'At rest') : fr.regime === 'kinetic' ? 'Sliding: kinetic friction μk·F_N' : (moving ? 'Sliding, no friction' : ''), 10, gy + 48 > H ? H - 4 : gy + 48);
    $('.ro', el).textContent = `t ${s.t.toFixed(1)} s · x ${s.x.toFixed(1)} m · v ${s.v.toFixed(2)} m/s\nF_g = mg = ${fr.W.toFixed(1)} N\nF_N = ${fr.N.toFixed(1)} N${p.ang ? ` (F_app,y = ${fr.Fy.toFixed(1)} N)` : ''}\nf_s,max = μs·F_N = ${fr.fsMax.toFixed(1)} N\nf_k = μk·F_N = ${fr.fk.toFixed(1)} N\nfriction now: ${Math.abs(fr.f).toFixed(1)} N (${fr.regime})\nF_net = ${fr.Fx.toFixed(1)} ${fr.f < 0 ? '−' : '+'} ${Math.abs(fr.f).toFixed(1)} = ${fr.Fnet.toFixed(1)} N\na = F_net/m = ${fr.lift ? '—' : fr.a.toFixed(2)} m/s²`;
    const t0 = Math.max(0, s.t - 10);
    if (gtab === 'v') UI.plot(c2.ctx, 0, 0, c2.w, c2.h, [{ pts: vpts, col: '#1f6feb' }], { xmin: t0, xmax: t0 + 10, title: 'velocity v (m/s) vs time', xlabel: 't (s)', minSpan: 2 });
    else if (gtab === 'a') UI.plot(c2.ctx, 0, 0, c2.w, c2.h, [{ pts: apts, col: '#c026d3' }], { xmin: t0, xmax: t0 + 10, title: 'acceleration a (m/s²) vs time', xlabel: 't (s)', minSpan: 2 });
    else { UI.plot(c2.ctx, 0, 0, c2.w, c2.h, [{ pts: fpts, col: '#d9480f' }], { xmin: 0, xmax: Math.max(50, Math.ceil(fr.fsMax * 1.6 / 10) * 10), ymin: 0, ymax: Math.max(10, fr.fsMax * 1.3), title: fpts.length ? 'friction (N) vs applied force (N)' : 'Tick “Ramp the push” and press Run to draw this graph', xlabel: 'F_app,x (N)', hlines: [{ y: fr.fsMax, col: '#1d7a35', label: 'f_s,max' }, { y: fr.fk, col: '#a14a00', label: 'f_k' }] }); }
  }
  table(); draw();
  const lp = api.loop(dt => { if (running) step(dt); draw(); });
  return { destroy() { lp.stop = true; } };
}

const LESSON = {
  id: 'day2-v1', short: 'AP Physics 1 · Day 2 — Newton’s 2nd Law &amp; Friction', title: 'Day 2: Newton’s Second Law, Weight & Friction', minutes: '40–45',
  ced: ['Unit 2: Force and Translational Dynamics', 'Topics 2.2, 2.5, 2.6, 2.7'],
  intro: 'Yesterday you learned that balanced forces mean constant velocity. Today: what happens when forces are <b>not</b> balanced. You will use Newton’s second law to predict accelerations, find weights, and handle friction, the force behind most real-world problems.',
  goals: ['Use a = ΣF/m to connect net force, mass and acceleration (2.5.A).', 'Find the gravitational force (weight) near Earth and elsewhere (2.6.A, 2.6.B), and explain why all objects fall with the same acceleration (2.6.D).', 'Tell static from kinetic friction and calculate each (2.7.A, 2.7.B).', 'Solve problems with forces at an angle, and explain how they change the normal force (2.2.B, 2.5.A).'],
  sections: [
    { id: 's1', title: 'Newton’s second law', time: '7 min', ced: ['2.5.A'], sp: ['1.C', '2.B'], blocks: [
      { type: 'html', html: `<div class="formula" style="font-size:18px"><b>a</b><sub>sys</sub> = <b>ΣF</b> / m<sub>sys</sub> = <b>F</b><sub>net</sub> / m<sub>sys</sub></div>
        <ul><li>The acceleration is in the <b>same direction as the net force</b>, not necessarily the direction of motion.</li><li>Double the net force → double the acceleration. Double the mass → half the acceleration.</li>
        <li>Units: 1 N = 1 kg·m/s². Use a + / − sign convention and pick + in the direction of the acceleration when you can.</li>
        <li>You can apply it to each <b>direction separately</b>: ΣF<sub>x</sub> = ma<sub>x</sub> and ΣF<sub>y</sub> = ma<sub>y</sub>.</li></ul>
        <p><b>Recipe:</b> ① choose the system · ② draw the FBD · ③ choose + direction · ④ write ΣF = ma for each axis · ⑤ solve, then check units and sense.</p>` },
      { type: 'example', title: 'push against friction', problem: 'A 4.0 kg box is pushed right with 20 N while friction exerts 8.0 N to the left. Find its acceleration.', solution: 'ΣF = 20 − 8.0 = 12 N (right). a = ΣF/m = 12/4.0 = <b>3.0 m/s² to the right</b>.' },
      { type: 'example', title: 'lifting a book', problem: 'You lift a 2.0 kg book straight up with a 25 N force. What is its acceleration? (g = 9.8 m/s²)', solution: 'F<sub>g</sub> = mg = 2.0·9.8 = 19.6 N down. Take up as +: ΣF = 25 − 19.6 = 5.4 N. a = 5.4/2.0 = <b>2.7 m/s² upward</b>. Forgetting gravity would give 12.5 m/s², which is wrong.' },
      { type: 'mis', html: '“The object moves in the direction of the net force.” Not always! The <b>acceleration</b> points along the net force. A car braking while moving forward has a <b>backward</b> net force and a backward acceleration.' },
      { type: 'q', id: 'd2q1', qtype: 'num', prompt: 'A 3.0 kg cart on a frictionless track is pulled with a 15 N horizontal force. Find the magnitude of its acceleration.', answer: 5.0, unit: 'm/s²', hint: 'a = F<sub>net</sub> / m', explain: 'a = 15/3.0 = 5.0 m/s².', traps: [{ v: 45, msg: 'You multiplied. a = F/m, so divide.' }, { v: 0.2, msg: 'You divided m by F. It is F divided by m.' }] },
      { type: 'q', id: 'd2q2', qtype: 'num', prompt: 'A 1.5 kg ball is pulled right by a 6.0 N force while air drag pushes left with 1.5 N. What is the magnitude of its acceleration?', answer: 3.0, unit: 'm/s²', hint: 'Find the net force first: the forces point in opposite directions.', explain: 'ΣF = 6.0 − 1.5 = 4.5 N; a = 4.5/1.5 = 3.0 m/s².', traps: [{ v: 5, msg: 'You added the forces. They point in opposite directions, so subtract.' }, { v: 4, msg: 'You ignored the drag. Use the net force.' }] },
      { type: 'q', id: 'd2q3', qtype: 'mc', prompt: 'The net force on an object is doubled while its mass is cut in half. Its acceleration becomes…', choices: ['the same', '2 times as large', '4 times as large', '½ as large'], answer: 2, hint: 'a = F/m: what happens to the top, and what happens to the bottom?', explain: 'a = (2F)/(m/2) = 4F/m → <b>4×</b>.', why: ['Both changes increase a. They don’t cancel.', 'That accounts for only one of the two changes.', '', 'Smaller mass means larger acceleration.'] },
      { type: 'q', id: 'd2q4', qtype: 'mc', prompt: 'A ball is thrown straight up. At the very top of its path (v = 0 for an instant), what is its acceleration? Ignore air.', choices: ['Zero, because it has stopped', '9.8 m/s² downward', '9.8 m/s² upward', 'It changes from up to down at that instant'], answer: 1, hint: 'What forces act at the top? Is gravity still there?', explain: 'The only force is still F<sub>g</sub> = mg downward, so a = g = 9.8 m/s² down at every point, including the top. v = 0 does not mean a = 0.', why: ['v = 0 does not mean a = 0. If a were zero at the top, the ball would just float there.', '', 'Gravity pulls down, so the acceleration is downward.', 'The net force (gravity) never changes, so neither does a.'] },
    ] },
    { id: 's2', title: 'Gravity, weight & mass', time: '5 min', ced: ['2.6.A', '2.6.B', '2.6.D'], sp: ['1.C', '3.B'], blocks: [
      { type: 'html', html: `<p>The gravitational force between two masses: <span class="eq">F<sub>g</sub> = G m<sub>1</sub>m<sub>2</sub> / r²</span>. Near Earth’s surface this becomes <span class="eq">F<sub>g</sub> = mg</span>, with g = 9.8 N/kg = 9.8 m/s² (the <b>gravitational field</b>, g = GM/R²).</p>
        <ul><li><b>Mass</b> (kg) measures inertia and does not depend on location. <b>Weight</b> (N) is the gravitational force, and it does depend on location.</li>
        <li>Gravitational and inertial mass are equal. That is why all objects in free fall have the same acceleration: a = F<sub>g</sub>/m = mg/m = <b>g</b>.</li></ul>
        <table class="t"><tr><th>Where</th><th>g (N/kg)</th><th>Weight of a 65 kg student</th></tr><tr><td>Earth</td><td>9.8</td><td>637 N</td></tr><tr><td>Moon</td><td>1.62</td><td>105 N</td></tr><tr><td>Mars</td><td>3.7</td><td>241 N</td></tr></table>` },
      { type: 'mis', html: '“Heavier objects fall faster.” A bowling ball has a bigger F<sub>g</sub>, but also proportionally more inertia. Without air resistance they fall with the <b>same</b> acceleration.' },
      { type: 'q', id: 'd2q5', qtype: 'num', prompt: 'What is the weight (gravitational force) on a 12 kg backpack on Earth?', answer: 117.6, unit: 'N', g10: 120, hint: 'F<sub>g</sub> = mg with g = 9.8 N/kg.', explain: 'F<sub>g</sub> = 12 · 9.8 = 117.6 ≈ 118 N.', traps: [{ v: 12, msg: '12 is the mass in kg. Weight is a force in newtons: multiply by g.' }] },
      { type: 'q', id: 'd2q6', qtype: 'num', prompt: 'Planet X has <b>twice</b> Earth’s mass and <b>twice</b> Earth’s radius. What is g on its surface? (Earth: 9.8 m/s²)', answer: 4.9, unit: 'm/s²', hint: 'g = GM/R². Double M → ×2. Double R → ÷4.', explain: 'g<sub>X</sub> = 9.8 · 2/2² = 9.8/2 = 4.9 m/s².', traps: [{ v: 9.8, msg: 'The radius is squared in g = GM/R², so doubling R has a bigger effect than doubling M.' }, { v: 19.6, msg: 'Doubling R divides g by 4. Don’t forget R² in the denominator.' }] },
      { type: 'q', id: 'd2q7', qtype: 'mc', prompt: 'A satellite moves from 1 Earth radius to 3 Earth radii from Earth’s center. The gravitational force on it becomes…', choices: ['⅓ as large', '1/9 as large', '3 times as large', 'zero, because it is in space'], answer: 1, explain: 'F ∝ 1/r²: tripling r gives 1/3² = 1/9.', why: ['Gravity depends on 1/r², not 1/r.', '', 'Moving farther away makes the force weaker.', 'Gravity reaches into space. It is what keeps the satellite in orbit!'] },
      { type: 'q', id: 'd2q8', qtype: 'mc', prompt: 'A 7 kg bowling ball and a 0.5 kg soccer ball are dropped together in a vacuum. Which is the best explanation of what happens?', choices: ['The bowling ball lands first because the gravitational force on it is larger', 'They land together because the gravitational force on each is the same', 'They land together because the larger gravitational force on the bowling ball is exactly matched by its larger inertia', 'The soccer ball lands first because it has less inertia'], answer: 2, explain: 'a = F<sub>g</sub>/m = mg/m = g for both. Bigger force, but bigger mass in the same proportion (gravitational mass = inertial mass).', why: ['Bigger force, yes, but also more mass to accelerate.', 'The forces are not the same: F<sub>g</sub> = mg is 14 times bigger on the bowling ball.', '', 'Less inertia, but also a smaller gravitational force, in the same proportion.'] },
    ] },
    { id: 's3', title: 'Friction: static vs kinetic', time: '7 min', ced: ['2.7.A', '2.7.B'], sp: ['1.C', '2.B'], blocks: [
      { type: 'html', html: `<p>Friction acts <b>parallel to the surface</b> and opposes sliding (kinetic), or the <i>tendency</i> to slide (static).</p>
        <div class="two"><div class="formula"><b>Kinetic</b> (sliding): F<sub>f,k</sub> = μ<sub>k</sub> F<sub>N</sub><br><span class="g">constant while sliding, opposite the velocity</span></div><div class="formula"><b>Static</b> (not sliding): F<sub>f,s</sub> ≤ μ<sub>s</sub> F<sub>N</sub><br><span class="g">just as big as needed, up to a maximum</span></div></div>
        <ul><li>Usually μ<sub>s</sub> &gt; μ<sub>k</sub>: it is harder to <i>start</i> something sliding than to keep it sliding.</li><li>Friction depends on F<sub>N</sub> and the surfaces, <b>not</b> on contact area or speed (in this model).</li><li>F<sub>N</sub> is not always mg! Find it from the vertical forces.</li></ul>
        <table class="t"><tr><th>Surfaces</th><th>μ<sub>s</sub></th><th>μ<sub>k</sub></th></tr><tr><td>Steel on ice</td><td>0.10</td><td>0.05</td></tr><tr><td>Wood on wood</td><td>0.50</td><td>0.30</td></tr><tr><td>Rubber on concrete</td><td>1.0</td><td>0.80</td></tr></table>` },
      { type: 'example', title: 'will it move?', problem: 'A 20 kg wooden crate sits on a wood floor (μ<sub>s</sub> = 0.50, μ<sub>k</sub> = 0.30). (a) You push horizontally with 80 N. (b) You push with 120 N. What happens in each case?', solution: 'F<sub>N</sub> = mg = 20·9.8 = 196 N. Max static friction = 0.50·196 = <b>98 N</b>.<br>(a) 80 N &lt; 98 N → it does <b>not</b> move. Static friction is <b>80 N</b> (not 98 N!), and a = 0.<br>(b) 120 N &gt; 98 N → it slides. Kinetic friction = 0.30·196 = 58.8 N. a = (120 − 58.8)/20 = <b>3.06 m/s²</b>.' },
      { type: 'mis', html: '“Static friction always equals μ<sub>s</sub>F<sub>N</sub>.” No. μ<sub>s</sub>F<sub>N</sub> is only the <b>maximum</b>. If you push lightly, static friction pushes back just as lightly.' },
      { type: 'q', id: 'd2q9', qtype: 'num', prompt: 'A 10 kg box slides across a level floor with μ<sub>k</sub> = 0.25. What is the magnitude of the kinetic friction force?', answer: 24.5, unit: 'N', g10: 25, hint: 'F<sub>N</sub> = mg on a level floor with only vertical forces, then F<sub>f</sub> = μ<sub>k</sub>F<sub>N</sub>.', explain: 'F<sub>N</sub> = 98 N; F<sub>f</sub> = 0.25 · 98 = 24.5 N.', traps: [{ v: 2.5, msg: 'Friction is μ times the normal force (in N), not μ times the mass.' }] },
      { type: 'q', id: 'd2q10', qtype: 'num', prompt: 'A heavy desk has a maximum static friction of 50 N. You push horizontally with 30 N and it doesn’t move. How big is the friction force on the desk?', answer: 30, unit: 'N', hint: 'The desk is at rest, so what must the net force be?', explain: 'a = 0 → ΣF = 0 → static friction = 30 N, matching your push. The 50 N is only the upper limit.', traps: [{ v: 50, msg: '50 N is the <b>maximum</b> static friction. If friction were 50 N vs your 30 N push, the desk would accelerate backward toward you!' }, { v: 20, msg: 'The desk doesn’t move, so friction must exactly balance your push.' }] },
      { type: 'q', id: 'd2q11', qtype: 'mc', grid: true, prompt: 'A crate starts at rest. You push it horizontally with a force that <b>slowly increases</b> from zero until the crate slides, then keep increasing it. Which graph shows the friction force vs. your applied force?', choices: [fGraph('a'), fGraph('b'), fGraph('c'), fGraph('d')], choiceText: ['graph rising steadily forever', 'rises 1-for-1, then drops to a lower constant level', 'constant from the start', 'rises, then levels off with no drop'], answer: 1, hint: 'Static friction matches the push up to a maximum. What happens to friction once it starts sliding?', explain: 'Static friction rises 1-for-1 with your push until it reaches μ<sub>s</sub>F<sub>N</sub>. Then the crate slips and friction <b>drops</b> to the smaller, constant μ<sub>k</sub>F<sub>N</sub>. You can make this graph in the lab in the next section.', why: ['Friction can’t keep growing forever. It has a maximum.', '', 'Before the crate moves, friction only matches the push; it starts at zero.', 'This misses the drop: μ<sub>k</sub> &lt; μ<sub>s</sub>, so kinetic friction is smaller than the maximum static friction.'] },
    ] },
    { id: 's4', title: 'Push-a-box lab', time: '10 min', ced: ['2.5.A', '2.7.A', '2.7.B'], sp: ['2.B', '3.C'], blocks: [
      { type: 'html', html: '<p>Use the simulation to test the second law and the friction model. The readout shows every step of ΣF = ma. Turn on <b>Predict mode</b> to test yourself before each run.</p>' },
      { type: 'sim', id: 'box', title: 'Push-a-box lab', mount: simBox },
      { type: 'tip', html: '<b>Missions:</b> ① Wood floor, 20 kg: find the smallest push that starts the box sliding (tick <b>Ramp</b> or use the slider). ② Tick <b>Ramp</b>, press Run and open the <i>friction vs applied force</i> graph. Find the drop. ③ Record trials with F = 100 N and then m = 10 kg vs 20 kg: how does a change? ④ Press <b>Kick</b> with F = 0 and watch the v–t graph.' },
      { type: 'q', id: 'd2q12', qtype: 'num', tag: 'sim', prompt: 'Mission ①: for the 20 kg box on wood (μ<sub>s</sub> = 0.50) pushed horizontally, what is the <b>smallest</b> force that will start it sliding?', answer: 98, unit: 'N', tol: { rel: 0.03 }, g10: 100, hint: 'It starts sliding when the push exceeds f<sub>s,max</sub> = μ<sub>s</sub>mg.', explain: 'f<sub>s,max</sub> = 0.50 · 20 · 9.8 = 98 N. Any push above 98 N starts it moving.', traps: [{ v: 58.8, msg: 'That is the kinetic friction (μ<sub>k</sub>). To <i>start</i> it, you must beat the <b>static</b> maximum.' }] },
      { type: 'q', id: 'd2q13', qtype: 'num', tag: 'sim', prompt: 'Predict, then check in the sim: the same 20 kg box on wood (μ<sub>k</sub> = 0.30) is pushed with a constant horizontal 150 N. What is its acceleration once it is sliding?', answer: 4.56, unit: 'm/s²', g10: 4.5, hint: 'Sliding → kinetic friction = μ<sub>k</sub>mg. Then a = (F − f<sub>k</sub>)/m.', explain: 'f<sub>k</sub> = 0.30 · 196 = 58.8 N. a = (150 − 58.8)/20 = 91.2/20 = 4.56 m/s².', traps: [{ v: 7.5, msg: 'You forgot friction. Use the net force.' }, { v: 2.6, msg: 'You used static friction (98 N). Once it slides, friction is kinetic: μ<sub>k</sub>F<sub>N</sub>.' }] },
      { type: 'q', id: 'd2q14', qtype: 'mc', tag: 'sim', prompt: 'In the ramp experiment, what happens to the friction force at the moment the box starts to slide?', choices: ['It suddenly increases', 'It suddenly drops from μ<sub>s</sub>F<sub>N</sub> to μ<sub>k</sub>F<sub>N</sub>', 'It becomes zero', 'It keeps increasing with the applied force'], answer: 1, explain: 'Static friction maxes out at μ<sub>s</sub>F<sub>N</sub>. Once sliding, kinetic friction μ<sub>k</sub>F<sub>N</sub> is smaller and stays constant even if you push harder.', why: ['Look at the graph: friction drops.', '', 'A sliding box on a rough floor still feels kinetic friction.', 'Kinetic friction does not depend on how hard you push horizontally.'] },
      { type: 'q', id: 'd2q15', qtype: 'mc', tag: 'sim', prompt: 'The box is sliding on wood. You adjust your push until it equals the kinetic friction force exactly. What does the box do?', choices: ['It slows down and stops', 'It keeps moving at a constant velocity', 'It speeds up slowly', 'It stops instantly'], answer: 1, explain: 'ΣF = 0 → a = 0 → constant velocity (Newton’s first law). It keeps whatever speed it has.', why: ['Slowing would need a net backward force. Here the forces balance.', '', 'Speeding up needs a net forward force.', 'Nothing in the second law makes velocity change instantly.'] },
    ] },
    { id: 's5', title: 'Forces at an angle', time: '6 min', ced: ['2.2.B', '2.5.A', '2.7.A'], sp: ['1.A', '2.B'], blocks: [
      { type: 'html', html: `<p>When a force acts at an angle θ above the horizontal, split it into components <b>for the math</b> (not on the FBD!): <span class="eq">F<sub>x</sub> = F cos θ</span>, <span class="eq">F<sub>y</sub> = F sin θ</span>.</p>
        <ul><li><b>Pulling up</b> at an angle lifts some of the weight → F<sub>N</sub> = mg − F sin θ (smaller) → <b>less friction</b>.</li><li><b>Pushing down</b> at an angle presses the object into the floor → F<sub>N</sub> = mg + F sin θ (larger) → <b>more friction</b>.</li></ul>` },
      { type: 'example', title: 'pulling a sled', problem: 'A 15 kg sled is pulled with 60 N at 30° above the horizontal across snow with μ<sub>k</sub> = 0.20. Find F<sub>N</sub> and the acceleration.', solution: 'Vertical (a<sub>y</sub> = 0): F<sub>N</sub> + 60 sin 30° = mg → F<sub>N</sub> = 147 − 30 = <b>117 N</b>.<br>Friction: f<sub>k</sub> = 0.20·117 = 23.4 N.<br>Horizontal: a = (60 cos 30° − 23.4)/15 = (51.96 − 23.4)/15 = <b>1.90 m/s²</b>.' },
      { type: 'q', id: 'd2q16', qtype: 'num', prompt: 'Same sled (15 kg, μ<sub>k</sub> = 0.20), but now the 60 N pull is <b>horizontal</b>. What is its acceleration? (Compare it with 1.90 m/s².)', answer: 2.04, unit: 'm/s²', hint: 'Now F<sub>N</sub> = mg = 147 N.', explain: 'f<sub>k</sub> = 0.20·147 = 29.4 N; a = (60 − 29.4)/15 = 2.04 m/s². Pulling horizontally gives a bigger forward component but more friction; here the horizontal pull wins slightly.' },
      { type: 'q', id: 'd2q17', qtype: 'fbd', prompt: '<b>Build the FBD:</b> a student pushes a cart handle <b>downward at 30° below the horizontal</b>, and the cart slides to the right on a rough floor. Draw the forces on the cart. Make the relative sizes of F<sub>N</sub> and F<sub>g</sub> correct.', pic: PIC.box({ pushDown: 1, note: 'rough floor · sliding →' }), forces: D2F, snap: [0, 30, 45, 90, 135, 150, 180, 210, 225, 270, 315, 330], expect: [{ f: 'Fg', dir: 270 }, { f: 'FN', dir: 90 }, { f: 'Ff', dir: 180 }, { f: 'Fapp', dir: 330 }], rel: [['FN', '>', 'Fg']], relMsg: 'The push is partly <b>downward</b>, so the floor must push up harder: make F<sub>N</sub> <b>longer</b> than F<sub>g</sub>.', dirMsg: { Fapp: 'The push points the way the hand pushes: 30° <b>below</b> the horizontal, toward the right.' }, hint: 'Draw the push as one arrow down-and-right at 30° below horizontal. Vertically: F<sub>N</sub> = F<sub>g</sub> + (downward part of the push).', explain: 'F<sub>app</sub> at 30° below horizontal, F<sub>f</sub> to the left, F<sub>g</sub> down, F<sub>N</sub> up with F<sub>N</sub> &gt; F<sub>g</sub>.' },
      { type: 'q', id: 'd2q18', qtype: 'mc', prompt: 'Why is it easier to pull a heavy suitcase with the handle tilted <b>up</b> than to push it with the handle tilted <b>down</b> (same force, same angle)?', choices: ['Pulling reduces the normal force and so reduces friction; pushing down increases both', 'Pulling makes the suitcase lighter by reducing its mass', 'Friction does not depend on the normal force, so there is no real difference', 'Pushing down creates a third-law force that cancels the push'], answer: 0, explain: 'F<sub>N</sub> = mg ∓ F sin θ, and friction = μF<sub>N</sub>. Pulling up lowers F<sub>N</sub>; pushing down raises it.', why: ['', 'Mass doesn’t change. The normal force does.', 'Friction is μ times the normal force, so it does depend on F<sub>N</sub>.', 'Third-law pairs act on different objects; they never cancel.'] },
    ] },
    { id: 's6', title: 'AP-style reasoning', time: '6 min', ced: ['2.5.A', '2.7.A'], sp: ['3.B', '3.C'], blocks: [
      { type: 'html', html: '<p><b>Qualitative–quantitative translation (QQT):</b> AP questions often ask you to reason without numbers first, then derive an equation and check that it agrees with your reasoning. Write your answer before you see the sample.</p>' },
      { type: 'q', id: 'd2q19', qtype: 'fr', tag: 'ap', minWords: 40, prompt: 'A block of mass m is pulled across a rough horizontal floor (coefficient of kinetic friction μ<sub>k</sub>) by a constant horizontal force F, and it speeds up.<br>(a) Without equations: if the block’s mass is <b>doubled</b> and F stays the same, is the new acceleration <b>more than half</b>, <b>exactly half</b>, or <b>less than half</b> of the original? Justify your answer.<br>(b) Derive an expression for the acceleration in terms of F, m, μ<sub>k</sub> and g, and explain how it supports your answer to (a).',
        sample: '(a) <b>Less than half.</b> Doubling the mass doubles the normal force, so kinetic friction doubles too. The net force F − f<sub>k</sub> gets <b>smaller</b> while the mass gets twice as big. If the net force had stayed the same, the acceleration would be exactly half. Since the net force also decreased, the new acceleration is less than half.<br>(b) Vertically F<sub>N</sub> = mg, so f<sub>k</sub> = μ<sub>k</sub>mg. Horizontally ΣF = ma → F − μ<sub>k</sub>mg = ma → <b>a = F/m − μ<sub>k</sub>g</b>. Doubling m halves the first term but leaves μ<sub>k</sub>g unchanged, so a<sub>new</sub> = F/(2m) − μ<sub>k</sub>g, which is less than ½(F/m − μ<sub>k</sub>g) = F/(2m) − ½μ<sub>k</sub>g. This agrees with (a).',
        rubric: ['Claims “less than half”', 'Says friction (via the normal force) increases when mass increases', 'Writes F − μ<sub>k</sub>mg = ma (or equivalent)', 'Gets a = F/m − μ<sub>k</sub>g', 'Connects the equation back to the claim in (a)'] },
      { type: 'q', id: 'd2q20', qtype: 'fbd', tag: 'ap', prompt: '<b>Build the FBD:</b> a hockey puck slides to the right on rough ice and is slowing down. Nobody is touching it. Ignore air resistance.', pic: PIC.box({ v: '→ slowing', note: 'rough ice · nobody pushing', rough: true }), forces: D2F, expect: [{ f: 'Fg', dir: 270 }, { f: 'FN', dir: 90 }, { f: 'Ff', dir: 180 }], rel: [['FN', '=', 'Fg']], relMsg: 'No vertical acceleration: F<sub>N</sub> and F<sub>g</sub> have equal length.', extraMsg: { Fapp: 'Nobody is pushing the puck any more. The push ended when it left the stick.' }, hint: 'Only Earth and the ice interact with the puck.', explain: 'Gravity, the normal force, and kinetic friction backward. The net force (friction) points left, so the puck slows down while it moves right.' },
    ] },
    { id: 's7', title: 'Exit ticket', time: '4 min', ced: ['2.5.A', '2.7.A', '2.7.B'], blocks: [
      { type: 'html', html: '<p>Three quick questions to show what you learned today. They are scored separately, so do your best on the first try.</p>' },
      { type: 'q', id: 'd2e1', qtype: 'num', tag: 'exit', prompt: 'A 5.0 kg box is pulled across a level floor by a 30 N horizontal force. μ<sub>k</sub> = 0.20. Find its acceleration.', answer: 4.04, unit: 'm/s²', g10: 4.0, hint: 'f<sub>k</sub> = μ<sub>k</sub>mg, then a = (F − f<sub>k</sub>)/m.', explain: 'f<sub>k</sub> = 0.20·5.0·9.8 = 9.8 N; a = (30 − 9.8)/5.0 = 4.04 m/s².', traps: [{ v: 6, msg: 'You left out friction.' }] },
      { type: 'q', id: 'd2e2', qtype: 'mc', tag: 'exit', prompt: 'A car moving <b>east</b> brakes and slows down. The net force on the car points…', choices: ['east', 'west', 'there is no net force', 'down'], answer: 1, explain: 'It is slowing while moving east, so its acceleration, and therefore the net force, points west.', why: ['A net force to the east would speed it up.', '', 'Its velocity is changing, so there must be a net force.', 'Vertical forces balance; the car is not accelerating up or down.'] },
      { type: 'q', id: 'd2e3', qtype: 'num', tag: 'exit', prompt: 'A 40 N horizontal push does not move a crate whose maximum static friction is 65 N. A second student adds a 15 N push in the opposite direction. The crate still doesn’t move. What is the static friction force now (magnitude)?', answer: 25, unit: 'N', hint: 'Find the net push first. Friction balances whatever is left over.', explain: 'Net push = 40 − 15 = 25 N, so static friction = 25 N (well below the 65 N max).', traps: [{ v: 65, msg: '65 N is only the maximum. Static friction matches what is needed.' }, { v: 40, msg: 'Account for both pushes.' }, { v: 55, msg: 'The pushes are in opposite directions, so subtract them.' }] },
    ] },
    { id: 'sum', title: 'Summary & submit', type: 'summary', time: '2 min', blocks: [] },
  ] };

Engine.start(LESSON);
</script>

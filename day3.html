<script>
// ===== Forces sub-days: shared physics + answer-checking core (pure functions; also run by node tests) =====
// Conventions: g = 9.8 m/s^2. Angles in degrees, measured counter-clockwise from +x (right), y up.
const G = 9.8;
const D2R = Math.PI / 180;

// ---------- answer checking ----------
// Accepts "4.9", "4.9 m/s^2", "-3", "−3" (unicode minus), "1.2e3", "1.2 x 10^3", "1,200"
function parseNum(s) {
  if (s === null || s === undefined) return NaN;
  s = String(s).trim().replace(/[\u2212\u2013\u2014]/g, '-').replace(/(\d),(\d{3})/g, '$1$2').replace(/^\+/, '');
  const m = s.match(/^([-]?\s*\d*\.?\d+(?:e[-+]?\d+)?)\s*(?:(?:x|\u00d7|\*)\s*10\s*\^\s*([-+]?\d+))?/i);
  if (!m) return NaN;
  let v = parseFloat(m[1].replace(/\s+/g, ''));
  if (m[2] !== undefined) v *= Math.pow(10, +m[2]);
  return v;
}
// tol: {rel: fraction} and/or {abs: value}. Default: 1.5 % relative.
// Returns {ok, v, bad (unparseable), close (within 5 %), sign (right magnitude, wrong sign), g10 (looks like g = 10 was used)}
function checkNum(input, ans, tol, opt) {
  const v = parseNum(input);
  if (!isFinite(v)) return { ok: false, bad: true, v };
  tol = tol || {};
  const rel = tol.rel !== undefined ? tol.rel : (tol.abs !== undefined ? 0 : 0.015);
  const allowed = Math.max(tol.abs || 0, rel * Math.abs(ans), 1e-12);
  const ok = Math.abs(v - ans) <= allowed;
  const sign = !ok && ans !== 0 && Math.abs(v + ans) <= allowed;
  const close = !ok && Math.abs(v - ans) <= Math.max(0.05 * Math.abs(ans), allowed * 3);
  let g10 = false;
  if (!ok && opt && opt.g10 !== undefined) g10 = Math.abs(v - opt.g10) <= Math.max(0.01 * Math.abs(opt.g10), 1e-9);
  return { ok, v, bad: false, sign, close, g10 };
}
function sameSet(a, b) { a = [...a].sort(); b = [...b].sort(); return a.length === b.length && a.every((x, i) => x === b[i]); }
function checkMC(choice, ans) { return Array.isArray(ans) ? sameSet(choice || [], ans) : choice === ans; }

// ---------- free-body diagrams ----------
const normAng = a => ((Math.round(a) % 360) + 360) % 360;
function snapAngle(deg, allowed) {
  let best = allowed[0], bd = 1e9;
  for (const a of allowed) { const d = Math.abs(((deg - a + 540) % 360) - 180); if (d < bd) { bd = d; best = a; } }
  return normAng(best);
}
// placed: {key: {dir, len}}; spec: {expect:[{f, dir}], rel:[[keyA, '>'|'<'|'=', keyB]]}
// Returns {ok, missing:[keys], extra:[keys], wrongDir:[keys], relFail:[[a,op,b]]}
function checkFBD(placed, spec) {
  placed = placed || {};
  const exp = {}; for (const e of spec.expect) exp[e.f] = normAng(e.dir);
  const missing = [], extra = [], wrongDir = [], relFail = [];
  for (const k in exp) { if (!placed[k]) missing.push(k); else if (normAng(placed[k].dir) !== exp[k]) wrongDir.push(k); }
  for (const k in placed) if (!(k in exp)) extra.push(k);
  if (!missing.length && !extra.length && !wrongDir.length) {
    for (const r of (spec.rel || [])) {
      const A = placed[r[0]].len, B = placed[r[2]].len;
      const good = r[1] === '>' ? A > B : r[1] === '<' ? A < B : A === B;
      if (!good) relFail.push(r);
    }
  }
  return { ok: !missing.length && !extra.length && !wrongDir.length && !relFail.length, missing, extra, wrongDir, relFail };
}

// ---------- 2.1 center of mass ----------
function centerOfMass(ms, xs) { let M = 0, s = 0; for (let i = 0; i < ms.length; i++) { M += ms[i]; s += ms[i] * xs[i]; } return M > 0 ? s / M : NaN; }

// ---------- 2.5 / 2.7 box on a level floor, applied force F at angle ang above horizontal ----------
// p: {m, F, ang, mus, muk, g}. v = current velocity (m/s, + right). Static friction adopts the value needed (up to mus*N).
function boxForces(p, v) {
  const g = p.g || G, th = (p.ang || 0) * D2R;
  const Fx = p.F * Math.cos(th), Fy = p.F * Math.sin(th), W = p.m * g;
  const lift = Fy > W;
  const N = Math.max(0, W - Fy), fsMax = p.mus * N, fk = p.muk * N;
  let f, regime;
  if (v === 0) {
    if (Math.abs(Fx) <= fsMax + 1e-12) { f = -Fx; regime = 'static'; }
    else { f = -Math.sign(Fx) * fk; regime = 'kinetic'; }
  } else { f = -Math.sign(v) * fk; regime = 'kinetic'; }
  if (lift) { f = 0; regime = 'none'; }
  const Fnet = Fx + f;
  return { Fx, Fy, W, N, fsMax, fk, f, regime, Fnet, a: Fnet / p.m, lift };
}
// one time step with the "friction can't reverse the motion" rule: if v would cross zero, the object stops there.
function stepWithStop(forcesFn, p, s, dt) {
  const fr = forcesFn(p, s.v);
  const v2 = s.v + fr.a * dt;
  if (s.v !== 0 && Math.sign(v2) !== Math.sign(s.v)) {
    const tz = -s.v / fr.a;
    return { t: s.t + dt, x: s.x + s.v * tz + 0.5 * fr.a * tz * tz, v: 0, fr: forcesFn(p, 0) };
  }
  return { t: s.t + dt, x: s.x + s.v * dt + 0.5 * fr.a * dt * dt, v: v2, fr };
}
const boxStep = (p, s, dt) => stepWithStop(boxForces, p, s, dt);

// ---------- inclines (2.2.B.4, 2.5, 2.7): v measured DOWN the slope ----------
function inclineForces(p, v) {
  const g = p.g || G, th = p.ang * D2R, W = p.m * g;
  const Wpar = W * Math.sin(th), N = W * Math.cos(th), fsMax = p.mus * N, fk = p.muk * N;
  let f, regime;
  if (v === 0) {
    if (Wpar <= fsMax + 1e-12) { f = -Wpar; regime = 'static'; }
    else { f = -fk; regime = 'kinetic'; }
  } else { f = -Math.sign(v) * fk; regime = 'kinetic'; }
  const Fnet = Wpar + f;
  return { W, Wpar, Wperp: N, N, fsMax, fk, f, regime, Fnet, a: Fnet / p.m };
}
const inclineStep = (p, s, dt) => stepWithStop(inclineForces, p, s, dt);
const criticalAngle = mus => Math.atan(mus) / D2R;

// ---------- connected objects (2.1 systems, 2.3.A.3 tension, 2.5) ----------
// Modified Atwood: m1 on a horizontal table (friction mus/muk), string over ideal pulley to hanging m2. + = m2 moving down.
function tableAtwood(p, moving) {
  const g = p.g || G, drive = p.m2 * g, fsMax = p.mus * p.m1 * g, fk = p.muk * p.m1 * g;
  if (!moving && drive <= fsMax + 1e-12) return { a: 0, T: drive, f: drive, regime: 'static', drive, fsMax, fk };
  const a = (drive - fk) / (p.m1 + p.m2);
  return { a, T: p.m2 * (g - a), f: fk, regime: 'kinetic', drive, fsMax, fk };
}
// Classic Atwood: two hanging masses on an ideal pulley. + = m2 moving down.
function atwood(p) {
  const g = p.g || G, a = (p.m2 - p.m1) * g / (p.m1 + p.m2), T = 2 * p.m1 * p.m2 * g / (p.m1 + p.m2);
  return { a, T };
}

// ---------- apparent weight in an elevator (2.6.C) + springs (2.8) ----------
// a = elevator acceleration (+ up). Scale reading (normal force) N = m (g + a), never negative.
const apparentWeight = (m, a, g) => Math.max(0, m * ((g || G) + a));
const springStretch = (k, m, a, g) => m * ((g || G) + a) / k; // Hooke: k x = m (g + a)
// Elevator trips (+ = up). Presets: 'up' / 'down' match the v-t graph in Day 3 Q13 (speed up 0-2 s, cruise 2-6 s, slow 6-8 s, rest 8-10 s).
// 'custom': A = { v0, a } -> cruise at v0 for 2 s, then accelerate at a (until it stops if a opposes v0, else for 3 s), then constant velocity.
function elevatorProfile(type, A) {
  if (type === 'up') return [{ t0: 0, t1: 2, a: A }, { t0: 2, t1: 6, a: 0 }, { t0: 6, t1: 8, a: -A }, { t0: 8, t1: 10, a: 0 }];
  if (type === 'down') return [{ t0: 0, t1: 2, a: -A }, { t0: 2, t1: 6, a: 0 }, { t0: 6, t1: 8, a: A }, { t0: 8, t1: 10, a: 0 }];
  if (type === 'custom') { const v0 = A.v0 || 0, a = A.a || 0; let segs;
    if (Math.abs(a) < 1e-9) segs = [{ t0: 0, t1: 10, a: 0 }];
    else { const opp = Math.abs(v0) > 1e-9 && Math.sign(a) !== Math.sign(v0), dur = opp ? Math.min(7, Math.abs(v0 / a)) : 3;
      segs = [{ t0: 0, t1: 2, a: 0 }, { t0: 2, t1: 2 + dur, a }, { t0: 2 + dur, t1: 10, a: 0 }]; }
    segs.v0 = v0; return segs; }
  // 'drop': cable fails -> free fall 1 s, then emergency brakes decelerate at +g for 1 s
  return [{ t0: 0, t1: 1, a: 0 }, { t0: 1, t1: 2, a: -G }, { t0: 2, t1: 3, a: G }, { t0: 3, t1: 10, a: 0 }];
}
function elevatorAt(segs, t) {
  let v = segs.v0 || 0, y = 0;
  for (const s of segs) {
    const d = Math.max(0, Math.min(t, s.t1) - s.t0);
    if (t < s.t1) { y += v * d + 0.5 * s.a * d * d; v += s.a * d; return { a: s.a, v: Math.abs(v) < 1e-9 ? 0 : v, y }; }
    y += v * d + 0.5 * s.a * d * d; v += s.a * d;
  }
  return { a: 0, v: Math.abs(v) < 1e-9 ? 0 : v, y };
}
// words for the motion: "slowing down, moving down" etc.
function motionLabel(v, a) {
  if (Math.abs(a) < 1e-9) return Math.abs(v) < 1e-6 ? 'at rest' : 'constant velocity ' + (v > 0 ? 'up' : 'down');
  if (Math.abs(v) < 1e-6) return 'starting from rest, speeding up ' + (a > 0 ? 'upward' : 'downward');
  return (Math.sign(a) === Math.sign(v) ? 'speeding up' : 'slowing down') + ', moving ' + (v > 0 ? 'up' : 'down');
}

// ---------- Newton's 3rd law skaters (2.3) ----------
// Push of magnitude F lasting tp seconds; A on the left (moves left, -), B on the right (moves right, +). Frictionless ice.
function skaters(p, t) {
  const aA = -p.F / p.mA, aB = p.F / p.mB, tt = Math.min(t, p.tp), after = Math.max(0, t - p.tp);
  const vA = aA * tt, vB = aB * tt;
  const xA = p.xA0 + 0.5 * aA * tt * tt + vA * after, xB = p.xB0 + 0.5 * aB * tt * tt + vB * after;
  return { aA: t < p.tp ? aA : 0, aB: t < p.tp ? aB : 0, vA, vB, xA, xB, pushing: t < p.tp, xcm: (p.mA * xA + p.mB * xB) / (p.mA + p.mB) };
}

const PHYS = { G, D2R, parseNum, checkNum, checkMC, sameSet, normAng, snapAngle, checkFBD, centerOfMass, boxForces, boxStep, stepWithStop,
  inclineForces, inclineStep, criticalAngle, tableAtwood, atwood, apparentWeight, springStretch, elevatorProfile, elevatorAt, motionLabel, skaters };
if (typeof module !== 'undefined') module.exports = PHYS;

</script>

const fmt = (x, d) => { if (!isFinite(x)) return '—'; if (d !== undefined) return (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); const a = Math.abs(x); return a >= 100 ? x.toFixed(0) : a >= 10 ? x.toFixed(1) : x.toFixed(2); };

const UI = {
  canvas(host, hCss) { const cv = document.createElement('canvas'); host.appendChild(cv); const o = { cv, ctx: cv.getContext('2d'), w: 600, h: hCss };
    o.fit = () => { const dpr = window.devicePixelRatio || 1; o.w = Math.max(280, host.clientWidth - 2); o.h = typeof hCss === 'function' ? hCss(o.w) : hCss; cv.width = o.w * dpr; cv.height = o.h * dpr; cv.style.width = o.w + 'px'; cv.style.height = o.h + 'px'; o.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    o.fit(); return o; },
  arrow(ctx, x0, y0, dx, dy, col, label, opt) { opt = opt || {}; const L = Math.hypot(dx, dy); if (L < 2) return; ctx.save(); ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = opt.w || 3; if (opt.dash) ctx.setLineDash([6, 4]);
    const ux = dx / L, uy = dy / L, hl = Math.min(12, L * 0.45); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + dx - ux * hl * 0.8, y0 + dy - uy * hl * 0.8); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x0 + dx, y0 + dy); ctx.lineTo(x0 + dx - ux * hl - uy * hl * 0.5, y0 + dy - uy * hl + ux * hl * 0.5); ctx.lineTo(x0 + dx - ux * hl + uy * hl * 0.5, y0 + dy - uy * hl - ux * hl * 0.5); ctx.closePath(); ctx.fill();
    if (label) { ctx.font = 'bold 13px system-ui'; ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; const lx = x0 + dx + ux * 10 + (opt.lx || 0) - (ux < -0.3 ? ctx.measureText(label).width : ux < 0.3 ? ctx.measureText(label).width / 2 : 0), ly = y0 + dy + uy * 12 + 4 + (opt.ly || 0); ctx.strokeText(label, lx, ly); ctx.fillText(label, lx, ly); }
    ctx.restore(); },
  // series: [{pts:[[x,y],...], col, label, dash}] ; o: {xmax, ymin, ymax, xlabel, ylabel, title, hlines:[{y,col,label}]}
  plot(ctx, X, Y, W, H, series, o) { o = o || {}; ctx.save(); ctx.fillStyle = '#fff'; ctx.fillRect(X, Y, W, H); ctx.strokeStyle = '#ccd'; ctx.strokeRect(X + .5, Y + .5, W - 1, H - 1);
    const L = X + 44, R = X + W - 8, T = Y + 18, B = Y + H - 22; let ymin = o.ymin, ymax = o.ymax;
    if (ymin === undefined || ymax === undefined) { let lo = 0, hi = 0; for (const s of series) for (const p of s.pts) { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); } for (const h of (o.hlines || [])) { lo = Math.min(lo, h.y); hi = Math.max(hi, h.y); } if (hi - lo < (o.minSpan || 1)) { const c = (hi + lo) / 2, sp = (o.minSpan || 1) / 2; if (lo >= 0 && c - sp < 0) { lo = 0; hi = 2 * sp; } else { lo = c - sp; hi = c + sp; } } const pad = (hi - lo) * 0.1; if (ymin === undefined) ymin = lo < 0 ? lo - pad : 0; if (ymax === undefined) ymax = hi + pad; }
    const xmin = o.xmin || 0, xmax = o.xmax || 10, sx = x => L + (x - xmin) / (xmax - xmin) * (R - L), sy = y => B - (y - ymin) / (ymax - ymin) * (B - T);
    ctx.font = '11px system-ui'; ctx.fillStyle = '#556'; ctx.strokeStyle = '#eef0f4'; ctx.lineWidth = 1;
    const nice = span => { const raw = span / 5, p = Math.pow(10, Math.floor(Math.log10(raw))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= raw) return m * p; return 10 * p; };
    const ys = nice(ymax - ymin); for (let v = Math.ceil(ymin / ys) * ys; v <= ymax + 1e-9; v += ys) { const yy = sy(v); ctx.beginPath(); ctx.moveTo(L, yy); ctx.lineTo(R, yy); ctx.stroke(); ctx.textAlign = 'right'; ctx.fillText(+v.toFixed(6) + '', L - 4, yy + 4); }
    const xs = nice(xmax - xmin); for (let v = Math.ceil(xmin / xs) * xs; v <= xmax + 1e-9; v += xs) { const xx = sx(v); ctx.beginPath(); ctx.moveTo(xx, T); ctx.lineTo(xx, B); ctx.stroke(); ctx.textAlign = 'center'; ctx.fillText(+v.toFixed(6) + '', xx, B + 13); }
    ctx.strokeStyle = '#334'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, B); ctx.lineTo(R, B); ctx.stroke();
    if (ymin < 0 && ymax > 0) { ctx.strokeStyle = '#99a'; ctx.beginPath(); ctx.moveTo(L, sy(0)); ctx.lineTo(R, sy(0)); ctx.stroke(); }
    for (const h of (o.hlines || [])) { ctx.strokeStyle = h.col || '#888'; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(L, sy(h.y)); ctx.lineTo(R, sy(h.y)); ctx.stroke(); ctx.setLineDash([]); if (h.label) { ctx.fillStyle = h.col || '#888'; ctx.textAlign = 'right'; ctx.fillText(h.label, R - 2, sy(h.y) - 3); } }
    ctx.save(); ctx.beginPath(); ctx.rect(L, T - 2, R - L, B - T + 4); ctx.clip();
    for (const s of series) { if (!s.pts.length) continue; ctx.strokeStyle = s.col; ctx.lineWidth = s.w || 2.2; if (s.dash) ctx.setLineDash([6, 4]); ctx.beginPath(); s.pts.forEach((p, i) => { const xx = sx(p[0]), yy = sy(p[1]); i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }); ctx.stroke(); ctx.setLineDash([]);
      if (s.dot !== false) { const p = s.pts[s.pts.length - 1]; ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(sx(p[0]), sy(p[1]), 3.5, 0, 7); ctx.fill(); } }
    ctx.restore();
    ctx.fillStyle = '#234'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'left'; ctx.fillText(o.title || '', L + 4, Y + 13); ctx.font = '11px system-ui'; ctx.fillStyle = '#556'; ctx.textAlign = 'right'; ctx.fillText(o.xlabel || '', R, Y + 13);
    ctx.restore(); return { sx, sy }; },
  slider(host, o) { const d = document.createElement('div'); d.className = 'sl'; d.innerHTML = `<span>${o.label}</span><input type="range" min="${o.min}" max="${o.max}" step="${o.step}" value="${o.val}"><output></output>`; host.appendChild(d);
    const inp = $('input', d), out = $('output', d), dec = o.dec !== undefined ? o.dec : (o.step < 1 ? (String(o.step).split('.')[1] || '').length : 0);
    const show = () => { out.textContent = (+inp.value).toFixed(dec) + (o.unit ? ' ' + o.unit : ''); };
    inp.addEventListener('input', () => { show(); o.oninput && o.oninput(+inp.value); }); show();
    return { el: d, input: inp, get: () => +inp.value, set: v => { inp.value = v; show(); }, disable: b => { inp.disabled = b; d.style.opacity = b ? .5 : 1; } }; },
  html(host, h) { const d = document.createElement('div'); d.innerHTML = h; while (d.firstChild) host.appendChild(d.firstChild); return host.lastChild; },
};

// ---------- the engine ----------
const Engine = (() => {
  let L, S, KEY, storageOK = true, active = [], loops = [], tick = null;
  const QS = [];
  function load() { try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; storageOK = false; } if (!S || S.v !== 1) S = fresh(); }
  function fresh() { return { v: 1, name: '', period: '', cur: -1, seen: {}, ans: {}, log: [], started: null, updated: null, secs: 0 }; }
  function save() { S.updated = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; } }
  function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
  const secQs = sec => (sec.blocks || []).filter(b => b.type === 'q');
  function secStatus(i) { const sec = L.sections[i]; if (sec.type === 'summary') return allDone() ? 'done' : 'todo'; const qs = secQs(sec);
    if (!qs.length) return S.seen[sec.id] ? 'done' : 'todo'; const d = qs.filter(q => S.ans[q.id] && S.ans[q.id].done).length; return d === qs.length ? 'done' : d || S.seen[sec.id] ? 'part' : 'todo'; }
  const allDone = () => L.sections.every((s, i) => s.type === 'summary' || secStatus(i) === 'done');
  function scores() { let pts = 0, max = 0, exit = 0, exitMax = 0, fr = 0, frMax = 0, answered = 0;
    for (const q of QS) { const a = S.ans[q.id]; if (q.qt === 'fr') { frMax++; if (a && a.done) fr++; continue; } const p = q.pts || 1; max += p; if (a && a.done) answered++; const sc = a && a.score ? a.score * p : 0; pts += sc; if (q.tag === 'exit') { exitMax += p; exit += sc; } }
    return { pts, max, exit, exitMax, fr, frMax, answered, total: QS.filter(q => q.qt !== 'fr').length }; }
  function header() { const n = L.sections.filter(s => s.type !== 'summary').length, d = L.sections.filter((s, i) => s.type !== 'summary' && secStatus(i) === 'done').length, sc = scores();
    $('#hdrProg').innerHTML = `<span>Progress</span><div class="bar" title="${d} of ${n} sections complete"><i style="width:${(100 * d / n).toFixed(0)}%"></i></div><span>${d}/${n} sections · ${fmt(sc.pts, sc.pts % 1 ? 2 : 0)}/${sc.max} pts</span>` + (storageOK ? '' : ' <span style="color:#ffb4a8">⚠ progress not saving — keep this tab open</span>');
    $('#who').innerHTML = S.name ? '👤 ' + esc(S.name) : ''; }
  function nav() { $('#side').innerHTML = `<div class="panel"><h3>Lesson map</h3><button class="navi ${S.cur === -1 ? 'on' : ''}" data-i="-1"><span class="st ${S.name ? 'done' : ''}">${S.name ? '✓' : ''}</span><span>Start here<small>name + instructions</small></span></button>` +
      L.sections.map((s, i) => { const st = secStatus(i); return `<button class="navi ${S.cur === i ? 'on' : ''}" data-i="${i}"><span class="st ${st}">${st === 'done' ? '✓' : ''}</span><span>${i + 1}. ${s.title}<small>${s.time ? s.time + ' · ' : ''}${s.ced ? 'CED ' + s.ced.join(', ') : ''}</small></span></button>`; }).join('') +
      `<div class="g" style="padding:6px 4px">✓ = complete · half = started.<br>Your work saves automatically in this browser.</div></div>`;
    $$('#side .navi').forEach(b => b.onclick = () => go(+b.dataset.i)); }
  function cleanup() { for (const a of active) { try { a && a.destroy && a.destroy(); } catch (e) { console.error(e); } } active = []; loops.forEach(l => l.stop = true); loops = []; }
  function loop(fn) { const L0 = { stop: false }; let last = performance.now(); const f = now => { if (L0.stop) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; try { fn(dt); } catch (e) { console.error(e); L0.stop = true; } requestAnimationFrame(f); }; requestAnimationFrame(f); loops.push(L0); return L0; }
  function go(i) { if (!S.name && i !== -1) { toast('Type your name first, then press Start.'); i = -1; } cleanup(); S.cur = i; save(); render(); window.scrollTo(0, 0); }
  function render() { header(); nav(); const m = $('#main'); if (S.cur === -1) return renderStart(m); const sec = L.sections[S.cur]; if (sec.type === 'summary') return renderSummary(m); renderSection(m, sec, S.cur); }
  function renderStart(m) { m.innerHTML = `<div class="panel startcard"><h2>${L.title}</h2><div class="chips">${L.ced.map(c => `<span class="chip">${c}</span>`).join('')}<span class="chip time">about ${L.minutes} minutes</span></div>
    <p>${L.intro}</p><h3>Today you will be able to…</h3><ul>${L.goals.map(g => `<li>${g}</li>`).join('')}</ul>
    <h3>How this works</h3><ul><li>Work through the sections <b>in order</b> using the lesson map on the left or the <b>Next ▶</b> button.</li><li>Read the short explanations, try the worked examples <b>before</b> you reveal the solution, and use each simulation.</li>
    <li>Questions give instant feedback. Full credit on the 1st try, half credit on the 2nd, a quarter after that. Hints are free. After 2 misses you may reveal the answer (0 points).</li>
    <li>Your work saves automatically <b>in this browser on this Chromebook</b>. A refresh will not lose it. Do not use Incognito or clear browsing data.</li>
    <li>At the end, open the <b>Summary</b>, then print or save it as a PDF (<kbd>Ctrl</kbd>+<kbd>P</kbd>) or take a screenshot, and turn it in the way your teacher asked.</li></ul>
    <div class="panel" style="background:#f3f6ff"><label><b>Your full name:</b> <input type="text" id="nm" value="${esc(S.name)}" maxlength="60" placeholder="First Last" autocomplete="name"></label>
    &nbsp; <label>Class period: <input type="text" id="per" value="${esc(S.period)}" maxlength="12" style="width:80px"></label>
    <div class="row" style="margin-top:10px"><button class="go big" id="startBtn">${S.name ? 'Continue ▶' : 'Start ▶'}</button>${S.started ? `<span class="g">Started ${new Date(S.started).toLocaleString()}</span>` : ''}</div>
    ${storageOK ? '' : '<p class="mis">⚠ This browser is blocking saved progress. Keep this tab open until you finish and print your summary.</p>'}</div>
    ${S.started ? `<p class="g">Not your work, or need a fresh start? <button id="wipe" class="warn">Erase all saved work for this lesson</button></p>` : ''}</div>`;
    $('#startBtn').onclick = () => { const n = $('#nm').value.trim(); if (n.length < 2) { toast('Please type your full name.'); $('#nm').focus(); return; } S.name = n; S.period = $('#per').value.trim(); if (!S.started) S.started = Date.now(); save(); go(firstUnfinished()); };
    $('#nm').onkeydown = e => { if (e.key === 'Enter') $('#startBtn').click(); };
    const w = $('#wipe'); if (w) w.onclick = () => { if (prompt('Type ERASE to delete all saved answers for this lesson on this device.') === 'ERASE') { S = fresh(); save(); render(); toast('Erased.'); } }; }
  function firstUnfinished() { for (let i = 0; i < L.sections.length; i++) if (L.sections[i].type !== 'summary' && secStatus(i) !== 'done') return i; return L.sections.length - 1; }
  function renderSection(m, sec, i) { m.innerHTML = `<div class="panel"><h2>${i + 1}. ${sec.title}</h2><div class="chips">${sec.time ? `<span class="chip time">⏱ ${sec.time}</span>` : ''}${(sec.ced || []).map(c => `<span class="chip">CED ${c}</span>`).join('')}${(sec.sp || []).map(c => `<span class="chip" style="background:#f4ecff;border-color:#cbb8ef">Practice ${c}</span>`).join('')}</div><div id="blocks"></div></div>
      <div class="navbtns noprint"><button id="prev" ${i === 0 ? '' : ''}>◀ Back</button><span class="g" id="secMsg"></span><button class="go big" id="next">${i + 1 < L.sections.length ? 'Next ▶' : 'Summary ▶'}</button></div>`;
    const host = $('#blocks');
    for (const b of sec.blocks) {
      if (b.type === 'html') UI.html(host, b.html);

      { type: 'tip', html: '<b>Try:</b> ① Frictionless: check a = 9.8 sin θ at a few angles. Change the mass. ② Wood: slowly raise θ until the block slips. Compare with tan⁻¹(0.50). ③ Rubber at 30°: press <b>Shove</b>. Why does it stop?' },
      { type: 'q', id: 'd3q2', qtype: 'num', tag: 'sim', prompt: 'A block is released on a <b>frictionless</b> 25° incline. What is its acceleration? Check it in the sim.', answer: 4.14, unit: 'm/s²', g10: 4.226, hint: 'a = g sin θ', explain: 'a = 9.8 · sin 25° = 9.8 · 0.423 = 4.14 m/s².', traps: [{ v: 8.88, msg: 'That is g cos θ. Along the slope you need g <b>sin</b> θ.' }] },
      { type: 'q', id: 'd3q3', qtype: 'num', tag: 'sim', prompt: 'A box sits on a ramp whose angle can be adjusted. μ<sub>s</sub> = 0.40. At what angle will the box just begin to slide?', answer: 21.8, tol: { abs: 0.4 }, unit: '°', hint: 'At the slipping point, mg sin θ = μ<sub>s</sub> mg cos θ → tan θ = μ<sub>s</sub>.', explain: 'θ = tan⁻¹(0.40) = 21.8°. Note that the mass cancels.', traps: [{ v: 23.6, msg: 'That is sin⁻¹(0.40). Use tan θ = μ<sub>s</sub>.' }, { v: 66.4, msg: 'That is cos⁻¹(0.40). Use tan θ = μ<sub>s</sub>.' }] },
      { type: 'q', id: 'd3q4', qtype: 'fbd', prompt: '<b>Build the FBD:</b> a block sits <b>at rest</b> on a rough 30° incline that rises to the right. Draw whole forces (no components!).', pic: PIC.incline(30), forces: D3F, snap: INCL_SNAP, expect: [{ f: 'Fg', dir: 270 }, { f: 'FN', dir: 120 }, { f: 'Ff', dir: 30 }], rel: [['Fg', '>', 'FN'], ['FN', '>', 'Ff']], relMsg: 'Sizes: F<sub>N</sub> = mg cos 30° ≈ 0.87 mg and F<sub>f</sub> = mg sin 30° = 0.5 mg. Make F<sub>g</sub> longest, then F<sub>N</sub>, then F<sub>f</sub>.', dirMsg: { FN: 'The normal force is <b>perpendicular to the incline surface</b>, not straight up. For a 30° slope rising to the right, that is 30° left of vertical.', Ff: 'Static friction points <b>up the slope</b> (parallel to the surface), stopping the block from sliding down.' }, hint: 'The surface pushes perpendicular to itself (F<sub>N</sub>) and along itself (F<sub>f</sub>). Gravity is still straight down.', explain: 'F<sub>g</sub> straight down; F<sub>N</sub> perpendicular to the slope (up-left, 120°); static friction up the slope (30°). F<sub>N</sub> = mg cos θ and F<sub>f</sub> = mg sin θ.' },
      { type: 'q', id: 'd3q5', qtype: 'mc', prompt: 'A 2 kg block and a 10 kg block are released on the same frictionless incline. Compare their accelerations.', choices: ['The 10 kg block’s is 5 times larger', 'The 2 kg block’s is larger', 'They are equal', 'It depends on the angle'], answer: 2, explain: 'a = g sin θ, with no mass in it. The bigger gravitational force is exactly matched by the bigger inertia.', why: ['More mass means more force, but also more inertia.', 'Less mass means less force, too.', '', 'Both depend on the angle the same way; at any angle they are equal.'] },
    ] },
    { id: 's3', title: 'Connected objects & pulleys', time: '9 min', ced: ['2.1.A', '2.3.A', '2.5.A', '2.7.A'], sp: ['1.A', '2.B', '3.C'], blocks: [
      { type: 'html', html: `<p>Two objects joined by a light string move with the <b>same magnitude of acceleration</b>. An ideal (light, frictionless) pulley only changes the string’s direction. The tension is the same all along the string (CED 2.3.A.3).</p>
        <ul><li><b>Whole-system view:</b> treat both objects as one system. Tension is now an <b>internal</b> force and drops out: <span class="eq">a = (net external force along the string) / (m<sub>1</sub> + m<sub>2</sub>)</span>.</li><li><b>Single-object view:</b> use one object’s FBD to find the tension.</li></ul>
        <div class="two"><div class="formula">Block on frictionless table (m<sub>1</sub>) + hanging m<sub>2</sub>:<br>a = m<sub>2</sub>g/(m<sub>1</sub>+m<sub>2</sub>), F<sub>T</sub> = m<sub>1</sub>a</div><div class="formula">Atwood (two hanging):<br>a = (m<sub>2</sub>−m<sub>1</sub>)g/(m<sub>1</sub>+m<sub>2</sub>)</div></div>` },
      { type: 'example', title: 'block on a table', problem: 'A 3.0 kg block on a frictionless table is tied over a pulley to a hanging 1.0 kg mass. Find a and the tension.', solution: 'System: the only external force along the string is the hanging weight m<sub>2</sub>g = 9.8 N. a = 9.8/(3.0 + 1.0) = <b>2.45 m/s²</b>.<br>Block on table: F<sub>T</sub> = m<sub>1</sub>a = 3.0·2.45 = <b>7.35 N</b>. Check with the hanging mass: m<sub>2</sub>g − F<sub>T</sub> = 9.8 − 7.35 = 2.45 = m<sub>2</sub>a ✓.' },
      { type: 'example', title: 'Atwood machine', problem: 'A 2.0 kg and a 3.0 kg mass hang on either side of an ideal pulley. Find a and F<sub>T</sub>.', solution: 'a = (3.0 − 2.0)(9.8)/(5.0) = <b>1.96 m/s²</b> (3.0 kg goes down). For the 2.0 kg: F<sub>T</sub> − 2.0·9.8 = 2.0·1.96 → F<sub>T</sub> = <b>23.5 N</b>. That is between the two weights (19.6 N and 29.4 N), as it must be.' },
      { type: 'mis', html: '“The tension equals the hanging weight.” Only if nothing accelerates! If the hanging mass accelerates downward, the string must pull up <b>less</b> than m<sub>2</sub>g, or the net force on it would not point down.' },
      { type: 'sim', id: 'pulley', title: 'Pulley lab', mount: simPulley },
      { type: 'q', id: 'd3q6', qtype: 'num', tag: 'sim', prompt: 'A 4.0 kg cart on a frictionless table is connected over a pulley to a hanging 2.0 kg mass. What is the acceleration?', answer: 3.27, unit: 'm/s²', g10: 3.333, hint: 'a = m<sub>2</sub>g/(m<sub>1</sub> + m<sub>2</sub>)', explain: 'a = 2.0·9.8/6.0 = 3.27 m/s².', traps: [{ v: 9.8, msg: 'The hanging mass has to drag the cart too, so a &lt; g. Divide by the <b>total</b> mass.' }, { v: 4.9, msg: 'You divided by m<sub>1</sub> only. The force accelerates both masses.' }] },
      { type: 'q', id: 'd3q7', qtype: 'num', tag: 'sim', prompt: 'Same setup (4.0 kg on the table, 2.0 kg hanging). What is the tension in the string?', answer: 13.07, unit: 'N', g10: 13.33, hint: 'Use the cart’s FBD: the only horizontal force on it is F<sub>T</sub>, so F<sub>T</sub> = m<sub>1</sub>a.', explain: 'F<sub>T</sub> = 4.0·3.27 = 13.1 N (less than the hanging weight of 19.6 N).', traps: [{ v: 19.6, msg: 'That is the hanging weight. Since m<sub>2</sub> accelerates downward, the tension must be less than m<sub>2</sub>g.' }] },
      { type: 'q', id: 'd3q8', qtype: 'mc', prompt: 'In an Atwood machine with m<sub>2</sub> &gt; m<sub>1</sub>, how does the string tension compare with the two weights?', choices: ['F<sub>T</sub> = m<sub>2</sub>g', 'F<sub>T</sub> = m<sub>1</sub>g', 'm<sub>1</sub>g &lt; F<sub>T</sub> &lt; m<sub>2</sub>g', 'F<sub>T</sub> = (m<sub>1</sub> + m<sub>2</sub>)g'], answer: 2, explain: 'm<sub>1</sub> accelerates up, so F<sub>T</sub> &gt; m<sub>1</sub>g. m<sub>2</sub> accelerates down, so F<sub>T</sub> &lt; m<sub>2</sub>g.', why: ['Then m<sub>2</sub> would have zero net force and could not accelerate.', 'Then m<sub>1</sub> would have zero net force and could not accelerate up.', '', 'That would be the force on the pulley’s support if nothing moved, not the tension.'] },
      { type: 'q', id: 'd3q9', qtype: 'num', prompt: 'A 5.0 kg block on a table (μ<sub>k</sub> = 0.20) is pulled by a string over a pulley by a hanging 2.0 kg mass. The block is sliding. Find the acceleration. (Try it in the sim: set m<sub>1</sub>, m<sub>2</sub> and μ.)', answer: 1.4, unit: 'm/s²', g10: 1.429, hint: 'System: driving force m<sub>2</sub>g, opposing force μ<sub>k</sub>m<sub>1</sub>g, total mass 7.0 kg.', explain: 'a = (2.0·9.8 − 0.20·5.0·9.8)/7.0 = (19.6 − 9.8)/7.0 = 1.4 m/s².', traps: [{ v: 2.8, msg: 'You left out friction on the block.' }, { v: 1.96, msg: 'Divide by the <b>total</b> mass (7.0 kg), not just the block’s.' }] },
    ] },
    { id: 's4', title: 'Elevators, apparent weight & springs', time: '9 min', ced: ['2.6.C', '2.8.A', '2.5.A'], sp: ['1.B', '2.B', '3.C'], blocks: [
      { type: 'html', html: `<p>A bathroom scale reads the <b>normal force</b> it exerts on you, not your weight. That is your <b>apparent weight</b> (CED 2.6.C). Take up as +:</p>
        <div class="formula" style="font-size:17px">F<sub>N</sub> − mg = ma &nbsp;→&nbsp; <b>F<sub>N</sub> = m(g + a)</b></div>
        <ul><li>a <b>up</b> (speeding up going up, or slowing down going down) → reading <b>more</b> than mg.</li><li>a <b>down</b> (speeding up going down, or slowing down going up) → reading <b>less</b> than mg.</li><li>Constant velocity, either direction → a = 0 → reading = mg.</li><li>Free fall (a = −g) → reading 0: “weightless,” even though gravity still acts.</li></ul>
        <p>A <b>spring</b> exerts F<sub>sp</sub> = kΔx (Hooke’s law, CED 2.8.A). A mass hanging from a spring in the elevator stretches it by Δx = m(g + a)/k. That is a spring scale.</p>` },
      { type: 'example', title: 'scale in an elevator', problem: 'A 60 kg student stands on a scale in an elevator that accelerates upward at 2.0 m/s². What does the scale read? What if the elevator moves at a constant 3 m/s?', solution: 'F<sub>N</sub> = 60(9.8 + 2.0) = <b>708 N</b> (normal weight 588 N). At constant velocity a = 0 → <b>588 N</b>. The speed does not matter, only the acceleration does.' },
      { type: 'example', title: 'spring scale', problem: 'A 2.0 kg mass hangs at rest from a spring with k = 200 N/m. How far is the spring stretched?', solution: 'At rest: kΔx = mg → Δx = 2.0·9.8/200 = <b>0.098 m ≈ 9.8 cm</b>.' },
      { type: 'mis', html: '“The scale reads more when the elevator is moving up.” Not if it is moving at constant velocity! The reading depends on the <b>direction of the acceleration</b>, not the direction of motion.' },
      { type: 'sim', id: 'elev', title: 'Elevator & spring-scale lab', mount: simElevator },
      { type: 'tip', html: '<b>Try:</b> ① Turn on <b>Predict mode</b>, make your three predictions, then ride UP. Predict again and ride DOWN. ② Choose <b>Trip → Custom</b> to set any motion yourself: a starting velocity v₀ (+ up, − down) and an acceleration a (+ up, − down). With v₀ and a in the <b>same</b> direction the elevator speeds up; in <b>opposite</b> directions it slows down and stops. Use it to check the questions below. ③ Change the <b>spring constant k</b> and the mass on the spring, and compare the stretch Δx with Δx = m(g + a)/k. ④ Try the cable-snap trip.' },
      { type: 'q', id: 'd3q10', qtype: 'num', tag: 'sim', prompt: 'A 70 kg person rides an elevator that is moving <b>down</b> and <b>slowing down</b> at 1.5 m/s². What does the scale read?<br><span class="g">Check it in the lab: <b>Trip → Custom</b>, set your mass to 70 kg, give the elevator a <b>downward</b> starting velocity, and choose the acceleration (size 1.5 m/s²) that makes it slow down. Read the scale while it is slowing.</span>', answer: 791, unit: 'N', g10: 805, hint: 'Moving down and slowing → the acceleration points <b>up</b>. Then F<sub>N</sub> = m(g + a). (In the lab: v₀ negative, e.g. −4 m/s, and a = +1.5 m/s².)', explain: 'a = +1.5 m/s² (up). F<sub>N</sub> = 70(9.8 + 1.5) = 70·11.3 = 791 N, which is more than mg = 686 N.', traps: [{ v: 581, msg: 'Slowing while moving down means the acceleration is <b>upward</b>, so the reading goes up.' }, { v: 686, msg: 'That is the reading at constant velocity. Here the elevator is accelerating.' }] },
      { type: 'q', id: 'd3q11', qtype: 'mc', tag: 'sim', prompt: 'An elevator moves upward at a constant 4 m/s. Compared with your weight mg, the scale reads…<br><span class="g">Try it: <b>Trip → Custom</b> with v₀ = +4 m/s and a = 0.</span>', choices: ['more than mg', 'exactly mg', 'less than mg', 'zero'], answer: 1, explain: 'Constant velocity → a = 0 → F<sub>N</sub> = mg.', why: ['Moving up is not the same as accelerating up.', '', 'Less would need a downward acceleration.', 'Zero only happens in free fall.'] },
      { type: 'q', id: 'd3q12', qtype: 'num', tag: 'sim', prompt: 'A 1.0 kg mass hangs from a spring (k = 250 N/m) in an elevator accelerating <b>upward</b> at 2.2 m/s². How much is the spring stretched, in <b>centimeters</b>?<br><span class="g">Simulate it: set <b>Spring constant k</b> = 250 N/m and <b>Mass on spring</b> = 1.0 kg. Then choose <b>Trip → Custom</b> with v₀ = 0 and a = +2.2 m/s² (or Ride UP with |a| = 2.2 m/s²), and read Δx while it accelerates.</span>', answer: 4.8, unit: 'cm', g10: 4.88, hint: 'kΔx − mg = ma → Δx = m(g + a)/k. Then convert m → cm.', explain: 'Δx = 1.0(9.8 + 2.2)/250 = 12/250 = 0.048 m = 4.8 cm.', traps: [{ v: 0.048, msg: 'Right number, but the question asks for centimeters.' }, { v: 3.04, msg: 'The elevator accelerates upward: use g + a, not g − a.' }, { v: 3.92, msg: 'That is the stretch at rest. Include the acceleration.' }] },
      { type: 'q', id: 'd3q13', qtype: 'mc', prompt: 'The graph shows an elevator’s velocity (up is +) during a trip:<br>' + vtGraph() + '<br>During which time interval does the scale under a passenger read the <b>greatest</b> value?<br><span class="g">(This is the <b>Ride UP</b> trip in the elevator lab. Ride it and watch the scale-reading graph.)</span>', choices: ['0 to 2 s', '2 to 6 s', '6 to 8 s', '8 to 10 s'], answer: 0, explain: 'From 0 to 2 s the velocity increases upward, so a points up and F<sub>N</sub> = m(g + a) &gt; mg. From 2 to 6 s, a = 0 (reading = mg). From 6 to 8 s, a points down (reading &lt; mg).', why: ['', 'The slope (acceleration) is zero there, so the reading is just mg.', 'The velocity is decreasing, so a points down: the reading is <b>less</b> than mg.', 'The elevator is at rest: the reading is mg.'] },
    ] },
    { id: 's5', title: 'Mixed review', time: '6 min', ced: ['2.2.B', '2.3.A', '2.4.A', '2.5.A', '2.7.A', '2.7.B'], sp: ['1.A', '2.B', '3.B'], blocks: [
      { type: 'html', html: '<p>Questions from all three days. Draw a quick FBD on scratch paper for each one. It really helps.</p>' },
      { type: 'q', id: 'd3q14', qtype: 'mc', prompt: 'A crate rides in the back of a pickup truck that speeds up forward. The crate does not slide. Which force makes the crate speed up?', choices: ['Static friction from the truck bed, pointing forward', 'Kinetic friction, pointing backward', 'The normal force from the truck bed', 'No force is needed because the crate is at rest relative to the truck'], answer: 0, explain: 'The crate accelerates forward with the truck, so it needs a forward net force: static friction from the bed (it is not sliding, so it is <b>static</b>).', why: ['', 'It is not sliding, so the friction is static. And a backward force can’t speed it up.', 'The normal force is vertical; it can’t speed the crate up horizontally.', 'It is accelerating relative to the ground, which is an inertial frame. That needs a net force.'] },
      { type: 'q', id: 'd3q15', qtype: 'mc', prompt: 'You hold a book at rest against a vertical wall by pressing horizontally on it.<br>' + PIC.wall() + '<br>If you <b>double</b> your push, the friction force from the wall on the book…', choices: ['doubles', 'stays the same', 'halves', 'becomes zero'], answer: 1, explain: 'The book is at rest, so vertically friction = mg, no matter how hard you push. Pushing harder raises the <b>maximum</b> possible friction (μ<sub>s</sub>F<sub>N</sub>), not the actual friction.', why: ['Doubling the push doubles the <b>maximum</b> static friction, but the book only needs friction = mg.', '', 'Friction must still hold up the book’s weight.', 'Then the book would fall.'] },
      { type: 'q', id: 'd3q16', qtype: 'num', prompt: 'A 3.0 kg block and a 1.0 kg block sit side by side on a frictionless floor. You push the 3.0 kg block with 8.0 N, so it pushes the 1.0 kg block ahead of it.<br>' + contactPic() + '<br>What force does the 3.0 kg block exert on the 1.0 kg block?', answer: 2.0, unit: 'N', hint: 'First the whole system: a = 8.0/4.0. Then the 1.0 kg block alone: the only horizontal force on it is the push from the 3.0 kg block.', explain: 'a = 8.0/4.0 = 2.0 m/s². On the 1.0 kg block: F = 1.0·2.0 = 2.0 N. (By the third law the 1.0 kg block pushes back on the 3.0 kg block with 2.0 N.)', traps: [{ v: 8, msg: 'The 8.0 N push is on the 3.0 kg block. The force passed on to the small block is smaller. Use its own FBD.' }, { v: 6, msg: '6.0 N is the net force on the 3.0 kg block. The question asks about the force on the 1.0 kg block.' }] },
      { type: 'q', id: 'd3q17', qtype: 'mc', prompt: 'A skydiver falls at a constant <b>terminal velocity</b>. Which is true?', choices: ['Air resistance is greater than gravity', 'Air resistance equals gravity in magnitude, so the net force is zero', 'Gravity is greater than air resistance, which is why she keeps falling', 'There is no air resistance at terminal velocity'], answer: 1, explain: 'Constant velocity → ΣF = 0 → drag = mg. She keeps falling because she already has a downward velocity (first law).', why: ['Then she would slow down.', '', 'A net downward force would make her speed up.', 'Drag is what balances gravity.'] },
      { type: 'q', id: 'd3q18', qtype: 'mc', prompt: 'A block slides down a ramp at a <b>constant velocity</b> when the ramp is at angle θ. What is μ<sub>k</sub>?', choices: ['sin θ', 'cos θ', 'tan θ', 'It can’t be found without the mass'], answer: 2, explain: 'a = 0 → mg sin θ = μ<sub>k</sub> mg cos θ → μ<sub>k</sub> = tan θ.', why: ['Divide mg sin θ by the normal force mg cos θ.', 'Divide mg sin θ by the normal force mg cos θ.', '', 'The mass cancels from both sides.'] },
    ] },
    { id: 's6', title: 'AP-style reasoning', time: '5 min', ced: ['2.1.A', '2.5.A'], sp: ['3.B', '3.C'], blocks: [
      { type: 'html', html: '<p>Answer in words first, then use equations to back yourself up. The sample answer appears after you submit.</p>' },
      { type: 'q', id: 'd3q19', qtype: 'fr', tag: 'ap', minWords: 40, prompt: 'An Atwood machine holds masses m<sub>1</sub> and m<sub>2</sub> (m<sub>2</sub> &gt; m<sub>1</sub>) over an ideal pulley.<br>' + atwPic() + '<br>A student adds the <b>same</b> extra mass Δm to <b>both</b> sides. Does the magnitude of the acceleration increase, decrease, or stay the same? Justify your answer using the system of both masses, then support it with an equation for a.',
        sample: 'The acceleration <b>decreases</b>. For the system of both masses, the only unbalanced external force along the string is the difference in weights, (m<sub>2</sub> − m<sub>1</sub>)g. Tension is internal and cancels. Adding Δm to both sides does not change that difference, because (m<sub>2</sub> + Δm − m<sub>1</sub> − Δm)g is the same. But the total mass being accelerated increases from m<sub>1</sub> + m<sub>2</sub> to m<sub>1</sub> + m<sub>2</sub> + 2Δm. The same net force on a larger mass gives a smaller acceleration: a = (m<sub>2</sub> − m<sub>1</sub>)g/(m<sub>1</sub> + m<sub>2</sub> + 2Δm), which is smaller than before because the denominator is larger.',
        rubric: ['Claims the acceleration decreases', 'Net external force on the system (weight difference) is unchanged', 'Total mass (inertia) of the system increases', 'Gives a = (m₂ − m₁)g/(m₁ + m₂ + 2Δm) or equivalent and links it to the claim'] },
    ] },
    { id: 's7', title: 'Exit ticket', time: '4 min', ced: ['2.2.B', '2.5.A', '2.6.C'], blocks: [
      { type: 'html', html: '<p>Three questions to show what you learned today. They are scored separately.</p>' },
      { type: 'q', id: 'd3e1', qtype: 'num', tag: 'exit', prompt: 'A sled slides down a frictionless 40° snowy hill. What is the magnitude of its acceleration?', answer: 6.30, unit: 'm/s²', g10: 6.428, hint: 'a = g sin θ', explain: 'a = 9.8 · sin 40° = 9.8 · 0.643 = 6.30 m/s².', traps: [{ v: 7.51, msg: 'That is g cos θ. Along the slope it is g sin θ.' }] },
      { type: 'q', id: 'd3e2', qtype: 'mc', tag: 'exit', prompt: 'An elevator is moving <b>up</b> and <b>slowing down</b> as it approaches the top floor. The scale under a passenger reads…', choices: ['more than mg', 'exactly mg', 'less than mg', 'zero'], answer: 2, explain: 'Moving up and slowing → a points <b>down</b> → F<sub>N</sub> = m(g − |a|) &lt; mg.', why: ['That happens when a points up (speeding up on the way up).', 'Only if a = 0.', '', 'Only in free fall.'] },
      { type: 'q', id: 'd3e3', qtype: 'fbd', tag: 'exit', prompt: '<b>Build the FBD:</b> a box hangs from a string attached to the ceiling of an elevator that is <b>speeding up while moving upward</b>.', pic: hangPic(), forces: D3F, expect: [{ f: 'Fg', dir: 270 }, { f: 'FT', dir: 90 }], rel: [['FT', '>', 'Fg']], relMsg: 'The box accelerates <b>upward</b>, so the net force points up: make F<sub>T</sub> <b>longer</b> than F<sub>g</sub>.', hint: 'Only two things interact with the box. Which way is the acceleration?', explain: 'F<sub>T</sub> up and F<sub>g</sub> down, with F<sub>T</sub> &gt; F<sub>g</sub> because the acceleration is upward (F<sub>T</sub> = m(g + a)).' },
    ] },
    { id: 'sum', title: 'Summary & submit', type: 'summary', time: '2 min', blocks: [] },
  ] };

Engine.start(LESSON);
</script>

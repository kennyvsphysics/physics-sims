<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Coelacanth Quest</title>
<style>
:root{
  --body:#1F3A6B; --back:#152A4F; --spot:#F4F7FB;
  --surface:#2E86C1; --twilight:#0B2545; --deep:#050B1A;
  --gold:#F2B134; --aqua:#5CE1E6; --coral:#E4572E;
  --panel:rgba(11,37,69,.94);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);overflow:hidden;
  font-family:"Trebuchet MS","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#eaf2fb;
  -webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:var(--deep)}
canvas{position:absolute;left:0;top:0;width:960px;height:540px;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#ui .screen{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
#hud{position:absolute;inset:0;pointer-events:none}
.card{background:var(--panel);border-top:4px solid var(--gold);border-radius:12px;padding:18px 22px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:640px}
.card h2{margin:0 0 8px;font-size:24px;color:var(--gold);letter-spacing:.3px}
.card h3{margin:0 0 6px;font-size:15px;color:var(--aqua);text-transform:uppercase;letter-spacing:1.5px}
.card p{margin:6px 0;font-size:17px;line-height:1.38}
.card ul{margin:6px 0 6px 20px;padding:0;font-size:16px;line-height:1.4}
.btn{pointer-events:auto;display:inline-block;background:var(--gold);color:#10203d;border:none;border-radius:999px;
  padding:10px 20px;margin:6px;font-weight:bold;font-size:17px;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #a87412}
.btn:hover,.btn:focus-visible{filter:brightness(1.08);outline:3px solid var(--aqua);outline-offset:2px}
.btn.secondary{background:#244a7d;color:#eaf2fb;box-shadow:0 3px 0 #0f2442}
.btn.small{padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.title{font-size:58px;font-weight:900;margin:0;color:#fff;text-shadow:0 4px 0 var(--back),0 0 24px rgba(92,225,230,.35);letter-spacing:1px}
.subtitle{font-size:19px;color:var(--aqua);margin:4px 0 18px}
.lvl{display:flex;gap:14px;margin:8px 0 14px}
.lvlcard{width:250px;background:var(--panel);border-radius:12px;border-top:4px solid var(--gold);padding:12px 14px;cursor:pointer;text-align:left}
.lvlcard:hover,.lvlcard:focus-visible{outline:3px solid var(--aqua)}
.lvlcard b{color:var(--gold);font-size:18px}
.lvlcard small{display:block;color:#b8cbe3;font-size:14px;margin-top:4px;line-height:1.3}
.lvlcard .done{color:var(--aqua);font-weight:bold;font-size:14px}
.opt{display:block;width:100%;text-align:left;background:#163259;color:#eaf2fb;border:2px solid #2b5288;border-radius:10px;
  padding:9px 12px;margin:6px 0;font-size:16px;font-family:inherit;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--aqua)}
.opt.sel{border-color:var(--gold);background:#24406b}
.opt.right{border-color:#4cd17a;background:#1d4f39}
.opt.wrong{border-color:var(--coral);background:#5a2a24}
.fb{min-height:24px;font-size:16px;margin-top:6px}
.fb.ok{color:#7ff0a4}.fb.no{color:#ffab91}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--panel);border-left:5px solid var(--aqua);
  padding:9px 16px;border-radius:8px;font-size:15px;max-width:480px;width:max-content;box-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none;transition:opacity .4s}
.footer{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:13px;color:#9fb6d4}
.footer a{color:var(--aqua);cursor:pointer;text-decoration:underline;pointer-events:auto}
.touch{position:absolute;bottom:10px;pointer-events:auto;display:flex;gap:6px;opacity:.85}
.touch button{width:58px;height:58px;border-radius:14px;border:2px solid #3d6aa6;background:rgba(21,42,79,.75);color:#fff;font-size:22px;font-weight:bold;font-family:inherit;touch-action:none}
.touch button.wide{width:auto;padding:0 12px;font-size:15px}
.touch button:active,.touch button.on{background:rgba(92,225,230,.4)}
.dpad{left:10px;display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px}
.acts{right:10px}
.scroll{max-height:420px;overflow-y:auto;pointer-events:auto}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#2b5288;border-radius:4px}
input.name{font-weight:bold;font-size:22px;font-family:inherit;padding:8px 12px;border-radius:8px;border:2px solid var(--gold);background:#0b1c36;color:#fff;width:320px;text-align:center;user-select:text;-webkit-user-select:text}
.cert{background:var(--panel);border:3px solid var(--gold);border-radius:16px;padding:18px 30px;text-align:center;width:640px}
.cert .big{font-size:54px;font-weight:900;color:var(--gold);margin:4px 0}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;background:#163259;border:1px solid #2b5288;border-radius:999px;padding:3px 10px;margin:2px;font-size:14px}
.kbd{display:inline-block;border:1px solid #6d8fbf;border-bottom-width:3px;border-radius:5px;padding:0 6px;font-size:13px;background:#10264a;margin:0 1px}
.order-slot{display:inline-block;min-width:26px;text-align:center;font-weight:bold;color:var(--gold);margin-right:6px}
@media print{body{background:#fff}#stage{transform:none!important}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="hud"></div>
  <div id="ui"></div>
</div></div>
<script>
"use strict";
/* ============ Coelacanth Quest — core ============ */
const W = 960, H = 540;
const C = {body:"#1F3A6B", back:"#152A4F", belly:"#2C5490", spot:"#F4F7FB", surface:"#2E86C1", twilight:"#0B2545",
  deep:"#050B1A", gold:"#F2B134", aqua:"#5CE1E6", coral:"#E4572E"};
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const stage = document.getElementById("stage"), ui = document.getElementById("ui"), hud = document.getElementById("hud");
let scale = 1;
function fit(){
  scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  const ox = (window.innerWidth - W*scale)/2, oy = (window.innerHeight - H*scale)/2;
  stage.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
}
window.addEventListener("resize", fit); fit();

/* ---------- storage (safe on file://) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("cq_"+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem("cq_"+k, JSON.stringify(v)); }catch(e){} }
};
const progress = store.get("progress", {l1:false,l2:false,l3:false,quiz:null});
function saveProgress(){ store.set("progress", progress); }

/* ---------- utils ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function hex2rgb(h){h=h.replace("#","");return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mixColor(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;}
function rng(seed){ let s = seed>>>0 || 1; return ()=>{ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---------- input ---------- */
const keys = new Set();
const keyMap = {ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",ArrowUp:"up",KeyW:"up",ArrowDown:"down",KeyS:"down",
  Space:"action",KeyP:"action",KeyH:"action",ShiftLeft:"burst",ShiftRight:"burst",KeyB:"burst",Enter:"enter",Escape:"esc"};
window.addEventListener("keydown", e=>{
  if (e.target && e.target.tagName==="INPUT") return;
  const k = keyMap[e.code];
  if (e.target && e.target.tagName==="BUTTON" && (k==="action"||k==="enter")) return; // focused buttons handle Space/Enter
  if(!k) { if(scene && scene.onKeyRaw) scene.onKeyRaw(e); return; }
  if (["left","right","up","down","action"].includes(k)) e.preventDefault();
  if(!keys.has(k)){ keys.add(k); if(scene && scene.onKey) scene.onKey(k); }
});
window.addEventListener("keyup", e=>{ const k=keyMap[e.code]; if(k) keys.delete(k); });
window.addEventListener("blur", ()=>keys.clear());
function canvasPoint(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale}; }
cv.addEventListener("pointerdown", e=>{ if(scene && scene.onPointer) scene.onPointer(canvasPoint(e)); });

function touchControls(actions){
  // actions: [{key,label,cls}]
  const t = el(`<div><div class="touch dpad">
    <span></span><button data-k="up" aria-label="Up">&#9650;</button><span></span>
    <button data-k="left" aria-label="Left">&#9664;</button><button data-k="down" aria-label="Down">&#9660;</button><button data-k="right" aria-label="Right">&#9654;</button>
  </div><div class="touch acts">${actions.map(a=>`<button class="wide" data-k="${a.key}">${a.label}</button>`).join("")}</div></div>`);
  t.querySelectorAll("button").forEach(b=>{
    const k=b.dataset.k;
    const down=e=>{e.preventDefault(); if(!keys.has(k)){keys.add(k); if(scene&&scene.onKey)scene.onKey(k);} b.classList.add("on");};
    const up=e=>{e.preventDefault(); keys.delete(k); b.classList.remove("on");};
    b.addEventListener("pointerdown",down); b.addEventListener("pointerup",up); b.addEventListener("pointerleave",up); b.addEventListener("pointercancel",up);
  });
  return t;
}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg, ms=4200){
  let t=document.getElementById("toast");
  if(!t){ t=el(`<div id="toast" class="toast"></div>`); hud.appendChild(t); }
  t.innerHTML=msg; t.style.opacity=1;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.style.opacity=0; }, ms);
}
function clearHUD(){ hud.innerHTML=""; }

/* ---------- drawing: the coelacanth ---------- */
const spotCache = {};
function spotsFor(seed){
  if(spotCache[seed]) return spotCache[seed];
  const r=rng(seed*7919+13), s=[];
  let tries=0;
  while(s.length<22 && tries<400){ tries++;
    const x = -60 + r()*150, y = -34 + r()*68;
    // inside body ellipse-ish
    const ex = (x-15)/88, ey = y/ (34*(1-Math.abs(x-15)/140));
    if (ex*ex+ey*ey>0.85) continue;
    const rad = 2.2 + r()*5.5;
    if (s.some(p=>Math.hypot(p.x-x,p.y-y)<p.r+rad+3)) continue;
    s.push({x,y,r:rad, a:r()*Math.PI, e:0.6+r()*0.5});
  }
  return spotCache[seed]=s;
}
function lobeFin(g, x, y, ang, len, fill, fringe){
  g.save(); g.translate(x,y); g.rotate(ang);
  // fleshy lobe (stalk)
  g.fillStyle=fill; g.beginPath(); g.ellipse(len*0.32,0,len*0.36,len*0.13,0,0,Math.PI*2); g.fill();
  // fin rays fringe
  g.fillStyle=fringe; g.beginPath();
  g.moveTo(len*0.55,-len*0.12); g.quadraticCurveTo(len*1.05,-len*0.2,len*1.08,0); g.quadraticCurveTo(len*1.05,len*0.2,len*0.55,len*0.12); g.closePath(); g.fill();
  g.strokeStyle="rgba(255,255,255,.18)"; g.lineWidth=1;
  for(let i=-2;i<=2;i++){ g.beginPath(); g.moveTo(len*0.6,i*len*0.04); g.lineTo(len*1.02,i*len*0.07); g.stroke(); }
  g.restore();
}
/** draw coelacanth facing right; opts: phase (fin cycle), seed (spot pattern), species ('afr'|'indo'), alpha, headstand(0..1), mouth(0..1), flip */
function drawCoelacanth(g, x, y, sc, o={}){
  const ph=o.phase||0, seed=o.seed||1, hs=o.headstand||0;
  const indo = o.species==="indo";
  const bodyCol = indo? "#5a4632":C.body, backCol=indo?"#3e2f22":C.back, bellyCol=indo?"#7a6046":C.belly;
  const finCol = indo? "#4a3a2a":"#1a335f", farFin = indo? "#2e241a":"#10213f", fringe= indo?"rgba(120,95,70,.85)":"rgba(44,84,144,.85)";
  g.save(); g.translate(x,y); g.scale(o.flip?-sc:sc, sc);
  g.rotate(hs*1.35 + (o.tilt||0));
  if(o.alpha!==undefined) g.globalAlpha=o.alpha;
  const sw = Math.sin(ph), sw2=Math.sin(ph+Math.PI);
  // far-side paired fins (diagonal partner phases): far pectoral moves with near pelvic
  lobeFin(g, 48, 18, 2.1 + 0.45*sw2, 34, farFin, "rgba(16,33,63,.8)");
  lobeFin(g, -6, 30, 2.3 + 0.45*sw, 30, farFin, "rgba(16,33,63,.8)");
  // tail: upper & lower lobes + small middle (epicaudal) lobe
  const tw = Math.sin(ph*0.5)*0.08;
  g.save(); g.translate(-74,0); g.rotate(tw);
  g.fillStyle=finCol;
  g.beginPath(); g.moveTo(0,-9); g.quadraticCurveTo(-22,-30,-44,-40); g.quadraticCurveTo(-36,-14,-22,-3); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(0,9); g.quadraticCurveTo(-22,30,-44,40); g.quadraticCurveTo(-36,14,-22,3); g.closePath(); g.fill();
  g.fillStyle=bodyCol; g.beginPath(); g.moveTo(-6,-4); g.lineTo(-40,-3); g.lineTo(-40,3); g.lineTo(-6,4); g.fill();
  g.fillStyle=finCol; g.beginPath(); g.moveTo(-38,0); g.quadraticCurveTo(-48,-11,-60,0); g.quadraticCurveTo(-48,11,-38,0); g.fill();
  g.restore();
  // dorsal & anal lobed fins
  lobeFin(g, -36, -30, -2.55 + 0.12*sw, 30, finCol, fringe);
  lobeFin(g, -36, 30, 2.55 - 0.12*sw, 28, finCol, fringe);
  // first dorsal (fan, no lobe)
  g.fillStyle=finCol; g.beginPath(); g.moveTo(5,-38); g.lineTo(-2,-64); g.quadraticCurveTo(14,-66,30,-40); g.closePath(); g.fill();
  g.strokeStyle="rgba(255,255,255,.15)"; for(let i=0;i<4;i++){g.beginPath();g.moveTo(10+i*5,-39);g.lineTo(2+i*7,-62);g.stroke();}
  // body
  const grd=g.createLinearGradient(0,-42,0,40); grd.addColorStop(0,backCol); grd.addColorStop(.55,bodyCol); grd.addColorStop(1,bellyCol);
  g.fillStyle=grd; g.beginPath();
  g.moveTo(102,2); g.bezierCurveTo(98,-30,52,-44,2,-41); g.bezierCurveTo(-40,-38,-66,-22,-76,-9);
  g.lineTo(-76,9); g.bezierCurveTo(-66,22,-40,37,2,39); g.bezierCurveTo(52,41,96,28,102,2); g.fill();
  // scales hint
  g.save(); g.clip(); g.strokeStyle="rgba(255,255,255,.05)"; g.lineWidth=1;
  for(let sx=-70;sx<100;sx+=9){ for(let sy=-40;sy<40;sy+=9){ g.beginPath(); g.arc(sx+(sy%18?4:0),sy,5,-1,1); g.stroke(); } }
  // spots
  g.fillStyle=C.spot;
  for(const s of spotsFor(seed)){ g.globalAlpha=(o.alpha??1)*0.9; g.beginPath(); g.ellipse(s.x,s.y,s.r,s.r*s.e,s.a,0,Math.PI*2); g.fill(); }
  g.globalAlpha=o.alpha??1;
  g.restore();
  // gill cover
  g.strokeStyle="rgba(0,0,0,.35)"; g.lineWidth=2; g.beginPath(); g.moveTo(58,-26); g.quadraticCurveTo(46,0,58,26); g.stroke();
  // mouth (intracranial joint: opens wide when eating)
  const m=o.mouth||0;
  g.fillStyle="#0a1428"; g.beginPath(); g.moveTo(102,2); g.lineTo(80,6+m*4); g.lineTo(102,6+m*14); g.closePath(); g.fill();
  g.strokeStyle="rgba(0,0,0,.5)"; g.beginPath(); g.moveTo(102,4); g.lineTo(80,8); g.stroke();
  // eye
  g.fillStyle="#0b0f1a"; g.beginPath(); g.arc(74,-9,8,0,Math.PI*2); g.fill();
  g.fillStyle=C.gold; g.globalAlpha=(o.alpha??1)*0.85; g.beginPath(); g.arc(76,-11,2.6,0,Math.PI*2); g.fill(); g.globalAlpha=o.alpha??1;
  // rostral organ hint (small pores on snout)
  g.fillStyle="rgba(92,225,230,.6)"; [[92,-8],[95,-3],[90,-12]].forEach(p=>{g.beginPath();g.arc(p[0],p[1],1.4,0,Math.PI*2);g.fill();});
  // near-side paired fins on top
  lobeFin(g, 48, 20, 2.0 + 0.45*sw, 36, finCol, fringe);      // near pectoral (with far pelvic)
  lobeFin(g, -4, 33, 2.25 + 0.45*sw2, 32, finCol, fringe);    // near pelvic (with far pectoral)
  g.restore();
}
function drawShark(g,x,y,sc,flip,t){
  g.save(); g.translate(x,y); g.scale(flip?-sc:sc,sc);
  const w=Math.sin(t*4)*0.12;
  g.fillStyle="#56657a";
  g.beginPath(); g.moveTo(110,4); g.quadraticCurveTo(70,-26,0,-20); g.quadraticCurveTo(-60,-14,-90,-2); g.lineTo(-90,4); g.quadraticCurveTo(-40,18,20,18); g.quadraticCurveTo(80,18,110,4); g.fill();
  g.save(); g.translate(-88,1); g.rotate(w); g.beginPath(); g.moveTo(0,0); g.lineTo(-30,-38); g.lineTo(-20,0); g.lineTo(-26,24); g.closePath(); g.fill(); g.restore();
  g.beginPath(); g.moveTo(10,-19); g.lineTo(-12,-50); g.lineTo(-24,-16); g.fill();
  g.beginPath(); g.moveTo(40,14); g.lineTo(14,42); g.lineTo(8,14); g.fill();
  g.fillStyle="#8a97a8"; g.beginPath(); g.moveTo(108,6); g.quadraticCurveTo(60,18,0,16); g.quadraticCurveTo(60,8,108,6); g.fill();
  g.fillStyle="#111"; g.beginPath(); g.arc(80,-4,3,0,Math.PI*2); g.fill();
  g.strokeStyle="rgba(0,0,0,.35)"; for(let i=0;i<4;i++){g.beginPath();g.moveTo(58-i*5,-6);g.lineTo(55-i*5,8);g.stroke();}
  g.restore();
}
function oceanGradient(g, topCol, botCol){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,topCol); gr.addColorStop(1,botCol); g.fillStyle=gr; g.fillRect(0,0,W,H);
}
const bubbles = Array.from({length:40},(_,i)=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.5,v:10+Math.random()*25}));
function drawParticles(g,dt,alpha=0.35){
  g.fillStyle=`rgba(200,230,255,${alpha})`;
  for(const b of bubbles){ b.y-=b.v*dt; if(b.y<-5){b.y=H+5;b.x=Math.random()*W;} g.beginPath(); g.arc(b.x,b.y,b.r,0,Math.PI*2); g.fill(); }
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

/* ---------- scene manager ---------- */
let scene=null, last=performance.now(), T=0;
function setScene(s){ if(scene&&scene.exit) scene.exit(); keys.clear(); ui.innerHTML=""; clearHUD(); scene=s; if(s.enter) s.enter(); }
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; T+=dt;
  try{ if(scene){ if(scene.update) scene.update(dt); if(scene.draw) scene.draw(ctx,dt); } }
  catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
/* ============ Title / Menu / Teacher notes ============ */
function ambientBackground(g,dt,fishX){
  oceanGradient(g, "#123a66", C.deep);
  // light rays
  g.save(); g.globalAlpha=0.07; g.fillStyle="#bfe6ff";
  for(let i=0;i<5;i++){ const x=120+i*190+Math.sin(T*0.3+i)*30; g.beginPath(); g.moveTo(x,0); g.lineTo(x+60,0); g.lineTo(x-80,H); g.lineTo(x-170,H); g.fill(); }
  g.restore();
  drawParticles(g,dt,0.25);
  // rocky slope
  g.fillStyle="#08162b"; g.beginPath(); g.moveTo(0,H); for(let x=0;x<=W;x+=40){ g.lineTo(x, 470+Math.sin(x*0.02)*18+Math.sin(x*0.07)*6);} g.lineTo(W,H); g.fill();
}
const TitleScene = {
  fx:260,
  enter(){
    ui.appendChild(el(`<div class="screen" id="title">
      <h1 class="title">COELACANTH QUEST</h1>
      <div class="subtitle">400 million years. Three missions. One very old fish.</div>
      <button class="btn" id="startBtn">Start</button>
      <div class="row" style="margin-top:6px"><button class="btn secondary small" id="notesBtn">Teacher notes</button></div>
      <div class="footer">Mouse, touch or keyboard &middot; Best in full screen (F11) &middot; Companion to NOVA's <i>Ancient Creature of the Deep</i></div>
    </div>`));
    document.getElementById("startBtn").onclick=()=>setScene(MenuScene);
    document.getElementById("notesBtn").onclick=()=>setScene(NotesScene(TitleScene));
    document.getElementById("startBtn").focus();
  },
  onKey(k){ if(k==="enter"||k==="action") setScene(MenuScene); },
  draw(g,dt){
    ambientBackground(g,dt);

/* multiple choice: {q, opts:[{t,ok}], multi:false, explain, onPass} */
function showCheck({kicker="Quick check",q,opts,multi=false,need=1,explain,onPass}){
  const s=el(`<div class="screen" style="background:rgba(5,11,26,.45)"><div class="card" style="width:600px">
    <h3>${kicker}</h3><h2 style="font-size:21px">${q}</h2>
    <div data-opts>${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="order-slot">${i+1}</span>${o.t}</button>`).join("")}</div>
    <div class="fb" data-fb>${multi?`Select ${need}, then press Check.`:""}</div>
    <div class="row" style="justify-content:flex-end">${multi?`<button class="btn" data-check>Check</button>`:""}<button class="btn" data-next style="display:none">Continue</button></div>
  </div></div>`);
  ui.appendChild(s);
  const fb=s.querySelector("[data-fb]"), nb=s.querySelector("[data-next]"), btns=[...s.querySelectorAll(".opt")];
  let done=false;
  const pass=()=>{ done=true; fb.className="fb ok"; fb.innerHTML="&#10003; Correct! "+(explain||""); nb.style.display="inline-block"; nb.focus(); };
  nb.onclick=()=>{ s.remove(); onPass&&onPass(); };
  btns.forEach(b=>b.onclick=()=>{
    if(done) return;
    const i=+b.dataset.i;
    if(multi){ b.classList.toggle("sel"); return; }
    if(opts[i].ok){ b.classList.add("right"); pass(); }
    else { b.classList.add("wrong"); fb.className="fb no"; fb.innerHTML="Not quite. "+(opts[i].why||"Try another answer."); }
  });
  if(multi){ s.querySelector("[data-check]").onclick=()=>{
    if(done) return;
    const sel=btns.filter(b=>b.classList.contains("sel")).map(b=>+b.dataset.i);
    const right=opts.map((o,i)=>o.ok?i:-1).filter(i=>i>=0);
    if(sel.length===right.length && sel.every(i=>opts[i].ok)){ sel.forEach(i=>btns[i].classList.add("right")); s.querySelector("[data-check]").style.display="none"; pass(); }
    else { btns.forEach(b=>b.classList.remove("wrong")); sel.filter(i=>!opts[i].ok).forEach(i=>btns[i].classList.add("wrong"));
      fb.className="fb no"; fb.innerHTML=`Not yet. ${sel.filter(i=>opts[i].ok).length} of your picks are right. You need exactly ${right.length}.`; }
  }; }
  s.addEventListener("keydown",e=>{ const n=parseInt(e.key); if(n>=1&&n<=btns.length){ btns[n-1].click(); e.stopPropagation(); }});
  btns[0].focus();
  return s;
}
/* ordering check: click items in the right order */
function showOrder({q,items,explain,onPass}){
  // items given in correct order; display shuffled (deterministic)
  const order=[2,0,3,1].slice(0,items.length).length===items.length?[2,0,3,1]:items.map((_,i)=>i).reverse();
  const s=el(`<div class="screen" style="background:rgba(5,11,26,.45)"><div class="card" style="width:600px">
    <h3>Timeline check</h3><h2 style="font-size:21px">${q}</h2>
    <div>${order.map(i=>`<button class="opt" data-i="${i}"><span class="order-slot"></span>${items[i]}</button>`).join("")}</div>
    <div class="fb" data-fb>Click from oldest to newest.</div>
    <div class="row" style="justify-content:flex-end"><button class="btn secondary" data-reset>Reset</button><button class="btn" data-next style="display:none">Continue</button></div>
  </div></div>`);
  ui.appendChild(s);
  const btns=[...s.querySelectorAll(".opt")], fb=s.querySelector("[data-fb]"), nb=s.querySelector("[data-next]");
  let picked=[];
  const reset=()=>{picked=[];btns.forEach(b=>{b.className="opt";b.querySelector(".order-slot").textContent="";});fb.className="fb";fb.textContent="Click from oldest to newest.";};
  s.querySelector("[data-reset]").onclick=reset;
  btns.forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; if(picked.includes(i)) return;
    picked.push(i); b.classList.add("sel"); b.querySelector(".order-slot").textContent=picked.length;
    if(picked.length===items.length){
      if(picked.every((v,k)=>v===k)){ btns.forEach(x=>x.classList.add("right")); fb.className="fb ok"; fb.innerHTML="&#10003; Perfect order! "+(explain||""); nb.style.display="inline-block"; nb.focus(); s.querySelector("[data-reset]").style.display="none"; }
      else { fb.className="fb no"; fb.textContent="Close, but not in order. Press Reset and try again."; btns.forEach(x=>x.classList.add("wrong")); }
    }
  });
  nb.onclick=()=>{ s.remove(); onPass&&onPass(); };
  btns[0].focus();
}

function Level3(){

  let warned=false, fish, prey, sharks, nets, energy, clock, eaten, state, camX, pulses, phase, inv, firstEat, netHits, sensedOnce, started;

    fish={x:CAVE.x+40,y:CAVE.y,vx:0,vy:0,hs:0,mouth:0,face:1};
    const r=rng(77); prey=[];

    xs.forEach(x=>{ const px=x+r()*60; prey.push({x:px,y:floorY(px)-10-r()*14,found:false,eaten:false,kind:r()<0.5?"squid":"fish"}); });

    nets=[{x:1300,top:-40,bot:300},{x:2050,top:-40,bot:330},{x:2700,top:-40,bot:290}];
    energy=100; clock=19.0; eaten=0; state="intro"; camX=0; pulses=[]; phase=0; inv=0; firstEat=true; netHits=0; sensedOnce=false; warned=false;
  }
  reset();
  const NEED=5, DAWN=29.5; // 05:30 next day
  const fmtClock=c=>{ const h=Math.floor(c)%24, m=Math.floor((c%1)*60); return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`; };

    state="intro";
    showCard({kicker:"Level 3 · 19:00, sunset",title:"Tonight, you are the coelacanth",lines:[
      "Leave your cave, <b>drift-hunt</b> along the slope, and eat at least <b>5 prey</b>. Get home before <b>dawn (05:30)</b>.",
      "<span class='kbd'>&larr;&rarr;&uarr;&darr;</span> drift and steer (slow is efficient) · <span class='kbd'>Space</span> headstand to scan the seabed with your <b>rostral organ</b> · <span class='kbd'>Shift</span> burst (costs lots of energy).",
      "Watch out for <b style='color:var(--coral)'>sharks</b> and <b style='color:var(--coral)'>deep-set shark nets</b>. Ride the <b style='color:var(--aqua)'>currents</b> to save energy."],btn:"Leave the cave",onDone:()=>{state="play";}});
  }
  function fail(reason){
    state="over";
    const s=el(`<div class="screen" style="background:rgba(5,11,26,.6)"><div class="card" style="text-align:center"><h3>Try again</h3><h2>${reason[0]}</h2><p>${reason[1]}</p>
      <div class="row"><button class="btn" data-r>Retry night</button><button class="btn secondary" data-m>Menu</button></div></div></div>`);

      `You ate <b>${eaten}</b> prey and got home at <b>${fmtClock(clock)}</b> with <b>${Math.round(energy)}%</b> energy left.`,
      "Real coelacanths drift-hunt for about <b>9 hours</b> a night at roughly <b>3 m per minute</b>. That slow, low-energy lifestyle fits their small gills and slow metabolism.",
      netHits? `You got tangled in a net ${netHits}×. In the real ocean, <b>bycatch</b> in deep-set shark gill nets is the biggest threat.` : "You avoided every net. <b>Bycatch</b> in deep-set shark gill nets is the biggest threat to real coelacanths."]);
  }

function QuizScene(){

    const s=el(`<div class="screen"><div class="card" style="width:660px">
      <h3>Final review · Question ${i+1} of ${QUIZ.length} · Score ${score}</h3>
      <div style="height:6px;background:#163259;border-radius:3px;margin:4px 0 10px"><div style="height:6px;width:${i/QUIZ.length*100}%;background:var(--gold);border-radius:3px"></div></div>

      <div class="fb" data-fb></div>

    </div></div>`);
    ui.appendChild(s);
    const btns=[...s.querySelectorAll(".opt")], fb=s.querySelector("[data-fb]"), nb=s.querySelector("[data-next]");

      s.querySelector("h3").textContent=`Final review · Question ${i+1} of ${QUIZ.length} · Score ${score}`;
      nb.style.display="inline-block"; nb.focus(); });
    nb.onclick=()=>{ i++; if(i<QUIZ.length) render(); else setScene(ScoreScene(score)); };
    btns[0].focus();
  }
  return {
    enter(){ topBar("Final Review Quiz"); render(); },
    onKeyRaw(e){ const n=parseInt(e.key); if(!answered && n>=1&&n<=4){ const b=ui.querySelectorAll(".opt")[n-1]; b&&b.click(); } },
    draw(g,dt){ ambientBackground(g,dt); },
    _test:{ get state(){return {i,score,answered};} }
  };
}

      s.querySelector("#pr").onclick=()=>window.print(); s.querySelector("#rq").onclick=()=>setScene(QuizScene()); s.querySelector("#mn").onclick=()=>setScene(MenuScene);
      if(!nm.value) nm.focus();
    },
    draw(g,dt){ ambientBackground(g,dt); }
  };
}

/* ============ boot ============ */
window.CQ = { setScene, TitleScene, MenuScene, Level1, Level2, Level3, QuizScene, ScoreScene, get scene(){return scene;}, keys, progress };
setScene(TitleScene);
requestAnimationFrame(frame);
</script>

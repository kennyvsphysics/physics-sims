<script>
// ===== NYS Regents Physics forces lessons: physics models + answer checking (pure functions; also run by node tests) =====
// Conventions match the 2025 NYS Physics Reference Tables: g = 9.8 m/s^2 (9.8 N/kg), Fnet = ma, Fg = mg.
// Horizontal: + = right. Vertical: + = up. Angles in degrees counter-clockwise from +x.
const G = 9.8;
const PLANETS = { 9.8: 'Earth (g = 9.8 N/kg, Reference Tables)', 3.7: 'Mars (g ≈ 3.7 N/kg)', 1.6: 'Moon (g ≈ 1.6 N/kg)' };

// ---------- answer checking ----------
function parseNum(s) {
  if (s === null || s === undefined) return NaN;
  s = String(s).trim().replace(/[\u2212\u2013\u2014]/g, '-').replace(/(\d),(\d{3})/g, '$1$2').replace(/^\+/, '');
  const m = s.match(/^([-]?\s*\d*\.?\d+(?:e[-+]?\d+)?)\s*(?:(?:x|\u00d7|\*)\s*10\s*\^\s*([-+]?\d+))?/i);
  if (!m) return NaN;
  let v = parseFloat(m[1].replace(/\s+/g, ''));
  if (m[2] !== undefined) v *= Math.pow(10, +m[2]);
  return v;
}
// tol: {rel} and/or {abs}. Default 1.5 % relative (abs 0.05 when the answer is 0).
function checkNum(input, ans, tol, opt) {
  const v = parseNum(input);
  if (!isFinite(v)) return { ok: false, bad: true, v };
  tol = tol || {};
  const rel = tol.rel !== undefined ? tol.rel : (tol.abs !== undefined ? 0 : 0.015);
  const allowed = Math.max(tol.abs || 0, rel * Math.abs(ans), ans === 0 ? 0.05 : 1e-12);
  const ok = Math.abs(v - ans) <= allowed;
  const sign = !ok && ans !== 0 && Math.abs(v + ans) <= allowed;
  const close = !ok && Math.abs(v - ans) <= Math.max(0.05 * Math.abs(ans), allowed * 3);
  let g10 = false;
  if (!ok && opt && opt.g10 !== undefined) g10 = Math.abs(v - opt.g10) <= Math.max(0.01 * Math.abs(opt.g10), 1e-9);
  return { ok, v, bad: false, sign, close, g10 };
}
function sameSet(a, b) { a = [...a].sort(); b = [...b].sort(); return a.length === b.length && a.every((x, i) => x === b[i]); }

// ---------- free-body diagrams ----------
const normAng = a => ((Math.round(a) % 360) + 360) % 360;
function snapAngle(deg, allowed) {
  let best = allowed[0], bd = 1e9;
  for (const a of allowed) { const d = Math.abs(((deg - a + 540) % 360) - 180); if (d < bd) { bd = d; best = a; } }
  return normAng(best);
}
function checkFBD(placed, spec) {
  placed = placed || {};
  const exp = {}; for (const e of spec.expect) exp[e.f] = normAng(e.dir);
  const missing = [], extra = [], wrongDir = [], relFail = [];
  for (const k in exp) { if (!placed[k]) missing.push(k); else if (normAng(placed[k].dir) !== exp[k]) wrongDir.push(k); }
  for (const k in placed) if (!(k in exp)) extra.push(k);
  if (!missing.length && !extra.length && !wrongDir.length) {
    for (const r of (spec.rel || [])) {
      const A = placed[r[0]].len, B = placed[r[2]].len;
      if (!(r[1] === '>' ? A > B : r[1] === '<' ? A < B : A === B)) relFail.push(r);
    }
  }
  return { ok: !missing.length && !extra.length && !wrongDir.length && !relFail.length, missing, extra, wrongDir, relFail };
}

// ---------- adjustable parameters of each simulator (sliders + number boxes use exactly these ranges) ----------
const PARAMS = {
  lab: { m: { min: 0.5, max: 100, step: 0.5 }, F1: { min: 0, max: 400, step: 1 }, F2: { min: 0, max: 400, step: 1 }, f: { min: 0, max: 200, step: 1 },
    v0: { min: -10, max: 10, step: 0.5 }, g: { choices: [9.8, 3.7, 1.6] }, stopAt: { min: 0.5, max: 20, step: 0.5 } },
  crane: { m: { min: 1, max: 200, step: 1 }, T: { min: 0, max: 3000, step: 1 }, v0: { min: -3, max: 3, step: 0.5 }, g: { choices: [9.8, 3.7, 1.6] }, stopAt: { min: 0.5, max: 20, step: 0.5 } },
  carts: { mode: { choices: ['push', 'collide'] }, mA: { min: 0.5, max: 100, step: 0.5 }, mB: { min: 0.5, max: 100, step: 0.5 }, F: { min: 0, max: 400, step: 5 },
    tp: { min: 0.1, max: 1, step: 0.1 }, vA: { min: 0, max: 5, step: 0.5 }, vB: { min: -5, max: 5, step: 0.5 } },
};
const DEFAULTS = {
  lab: { m: 10, F1: 0, F2: 0, f: 0, v0: 0, g: 9.8, stopAt: 10 },
  crane: { m: 50, T: 490, v0: 0, g: 9.8, stopAt: 10 },
  carts: { mode: 'push', mA: 50, mB: 75, F: 150, tp: 0.5, vA: 2, vB: 0 },
};
function validSetting(sim, key, val) {
  const P = PARAMS[sim] && PARAMS[sim][key]; if (!P) return false;
  if (P.choices) return P.choices.includes(val);
  if (typeof val !== 'number' || val < P.min - 1e-9 || val > P.max + 1e-9) return false;
  const k = (val - P.min) / P.step; return Math.abs(k - Math.round(k)) < 1e-6;
}
const clean = x => Math.abs(x) < 1e-9 ? 0 : x;

// ---------- motion words (horizontal and vertical) ----------
function motionLabel(v, a, axis) {
  const pos = axis === 'y' ? 'up' : 'right', neg = axis === 'y' ? 'down' : 'left';
  if (Math.abs(a) < 1e-9) return Math.abs(v) < 1e-9 ? 'at rest' : 'constant velocity, moving ' + (v > 0 ? pos : neg);
  if (Math.abs(v) < 1e-9) return 'starting from rest, speeding up ' + (a > 0 ? pos : neg);
  return (Math.sign(a) === Math.sign(v) ? 'speeding up' : 'slowing down') + ', moving ' + (v > 0 ? pos : neg);
}

// ---------- Force Lab: a box on a level floor. F1 pushes right, F2 pushes left, friction up to f (newtons, given directly) ----------
// Simplification for Regents level: friction is entered as a force in N. If the box is at rest it holds it in place up to f; while sliding it equals f and opposes the motion.
function labForces(p, v) {
  const g = p.g || G, Fg = p.m * g, FN = Fg, Fapp = (p.F1 || 0) - (p.F2 || 0), f = p.f || 0;
  let Ff, regime;
  if (v === 0) {
    if (Math.abs(Fapp) <= f + 1e-12) { Ff = -Fapp; regime = Fapp === 0 ? 'none' : 'holding'; }
    else { Ff = -Math.sign(Fapp) * f; regime = 'sliding'; }
  } else { Ff = -Math.sign(v) * f; regime = 'sliding'; }
  const Fnet = clean(Fapp + Ff);
  return { Fg, FN, Fapp, Ff: clean(Ff), regime, Fnet, a: clean(Fnet / p.m) };
}
// one step; friction can stop the box but never reverses it
function stepWithStop(forcesFn, p, s, dt) {
  const fr = forcesFn(p, s.v);
  const v2 = s.v + fr.a * dt;
  if (s.v !== 0 && Math.sign(v2) !== Math.sign(s.v) && v2 !== 0 || (s.v !== 0 && v2 === 0)) {
    const tz = -s.v / fr.a;
    if (tz <= dt + 1e-12) { const fz = forcesFn(p, 0), rest = dt - tz, vR = fz.a * rest;   // stopped part-way through the step
      return { t: s.t + dt, x: s.x + s.v * tz + 0.5 * fr.a * tz * tz + 0.5 * fz.a * rest * rest, v: clean(vR), fr: vR === 0 ? fz : forcesFn(p, vR) }; }
  }
  return { t: s.t + dt, x: s.x + s.v * dt + 0.5 * fr.a * dt * dt, v: clean(v2), fr: forcesFn(p, clean(v2)) };
}
const labStep = (p, s, dt) => stepWithStop(labForces, p, s, dt);
function labFBD(p, v) {
  const r = labForces(p, v), out = [{ f: 'Fg', dir: 270, mag: r.Fg }, { f: 'FN', dir: 90, mag: r.FN }];
  if (p.F1 > 0 && p.F2 > 0) { out.push({ f: 'FappR', dir: 0, mag: p.F1 }, { f: 'FappL', dir: 180, mag: p.F2 }); }
  else if (p.F1 > 0) out.push({ f: 'Fapp', dir: 0, mag: p.F1 }); else if (p.F2 > 0) out.push({ f: 'Fapp', dir: 180, mag: p.F2 });
  if (Math.abs(r.Ff) > 1e-9) out.push({ f: 'Ff', dir: r.Ff > 0 ? 0 : 180, mag: Math.abs(r.Ff) });
  return out;
}

// ---------- Crane Lift: a crate on a vertical cable. Tension T up, weight mg down. + = up ----------
const CRANE = { y0: 4, top: 12 };
function craneForces(p, v, y) {
  const g = p.g || G, Fg = p.m * g, T = p.T || 0;
  if (y !== undefined && y <= 1e-9 && v <= 0 && T < Fg) return { Fg, T, FN: Fg - T, Fnet: 0, a: 0, ground: true };
  const Fnet = clean(T - Fg); return { Fg, T, FN: 0, Fnet, a: clean(Fnet / p.m), ground: false };
}
function craneStep(p, s, dt) {
  const fr = craneForces(p, s.v, s.y);
  let v = s.v + fr.a * dt, y = s.y + s.v * dt + 0.5 * fr.a * dt * dt, t = s.t + dt, ended = s.ended;
  if (y <= 0 && !fr.ground) { y = 0; v = 0; ended = 'hit the ground'; }
  if (y >= CRANE.top) { y = CRANE.top; ended = 'reached the top of the crane'; }
  return { t, y, v: clean(v), ended, fr: craneForces(p, clean(v), y) };
}
function craneFBD(p) { const out = [{ f: 'Fg', dir: 270, mag: p.m * (p.g || G) }]; if (p.T > 0) out.push({ f: 'FT', dir: 90, mag: p.T }); return out; }

// ---------- Two Carts / skaters ----------
// push mode: A (left) and B (right) push apart with force F for tp seconds on frictionless ice.
function pushOff(p, t) {

      { type: 'q', id: 'd1q4', qtype: 'fbd', prompt: '<b>Build the FBD:</b> a 10 kg box is pushed to the right with a 30 N force. It slides across a rough floor at a <b>constant velocity</b> of 2.0 m/s. (Friction is 30 N.)', pic: D1BOX({ push: 1, v: '(constant)', note: 'rough floor · constant velocity' }), forces: FBD_PAL, expect: [{ f: 'Fg', dir: 270 }, { f: 'FN', dir: 90 }, { f: 'Fapp', dir: 0 }, { f: 'Ff', dir: 180 }], rel: [['FN', '=', 'Fg'], ['Fapp', '=', 'Ff']], relMsg: 'Constant velocity means the forces are balanced: make F<sub>app</sub> = F<sub>f</sub> and F<sub>N</sub> = F<sub>g</sub> in length.', dirMsg: { Ff: 'Friction opposes the sliding. Which way is the box sliding?' }, hint: 'Four forces: Earth, the floor (two forces: one up, one along the floor) and the person. Constant velocity → balanced.', explain: 'F<sub>N</sub> balances F<sub>g</sub> (98 N), and the 30 N push balances the 30 N of friction. There is <b>no</b> extra forward force: a constant velocity needs zero net force.', sim: SIM('lab', { m: 10, F1: 30, f: 30, v0: 2 }, 0) },
      { type: 'q', id: 'd1q5', qtype: 'fbd', prompt: '<b>Build the FBD:</b> a 0.5 kg hockey puck glides to the right across <b>frictionless</b> ice at 3.0 m/s. Nothing is pushing it anymore.', pic: PIC.box({ rough: false, v: '3.0 m/s', note: 'frictionless ice · gliding' }), forces: FBD_PAL, expect: [{ f: 'Fg', dir: 270 }, { f: 'FN', dir: 90 }], rel: [['FN', '=', 'Fg']], hint: 'Nothing pushes it forward. Which objects touch it?', explain: 'Only F<sub>g</sub> and F<sub>N</sub>. There is no forward force: the puck keeps moving because of its <b>inertia</b>, not because a force pushes it along.', sim: SIM('lab', { m: 0.5, v0: 3 }, 0) },
    ] },
    { id: 's3', title: 'Net force: adding forces', time: '8 min', pe: ['HS-PS2-1'], sep: ['Using mathematics'], blocks: [
      { type: 'html', html: `<p>The <b>net force, F<sub>net</sub></b>, is the <b>vector sum</b> of all the forces on an object. For forces along one line, pick a positive direction (we use <b>right = +</b>, left = −) and add:</p>
        <div class="formula">F<sub>net</sub> = (forces to the right) − (forces to the left)</div>
        <ul><li><b>Balanced forces:</b> F<sub>net</sub> = 0. The object is in <b>equilibrium</b>.</li><li><b>Unbalanced forces:</b> F<sub>net</sub> ≠ 0. The net force has a size and a direction.</li></ul>
        <p>Up and down forces are added the same way (up = +). In the Force Lab the floor is level, so F<sub>N</sub> always balances F<sub>g</sub>, and only the sideways forces decide F<sub>net</sub>.</p>` },
      { type: 'vocab', terms: [['net force, F<sub>net</sub>', 'the sum of all forces on an object, including direction'], ['balanced forces', 'forces that add to zero (F<sub>net</sub> = 0)'], ['unbalanced forces', 'forces with a nonzero sum'], ['equilibrium', 'the state of an object when F<sub>net</sub> = 0']] },
      { type: 'example', title: 'two people push a box', problem: 'Ana pushes a box to the right with 40 N. Ben pushes it to the left with 15 N. The floor is frictionless. What is the net force?', solution: 'F<sub>net</sub> = (+40 N) + (−15 N) = <b>+25 N, i.e. 25 N to the right</b>. Check it in the lab: set F<sub>1</sub> = 40 N and F<sub>2</sub> = 15 N.' },
      LAB,
      { type: 'q', id: 'd1q6', qtype: 'num', prompt: 'Two students push on opposite sides of a 10 kg box on a frictionless floor: 40 N to the right and 25 N to the left. What is the <b>magnitude</b> of the net force on the box?', unit: 'N', answer: 15, traps: [{ v: 65, msg: 'The pushes are in <b>opposite</b> directions, so subtract them.' }], hint: 'Right is +, left is −. Add: (+40) + (−25).', explain: 'F<sub>net</sub> = 40 N − 25 N = 15 N to the right.', sim: SIM('lab', { m: 10, F1: 40, F2: 25 }, 0, { value: s => Math.abs(s.Fnet) }) },
      { type: 'q', id: 'd1q7', qtype: 'num', prompt: 'A 10 kg box is pushed to the right with 60 N. While it slides, friction on it is 20 N. What is the magnitude of the net force?', unit: 'N', answer: 40, traps: [{ v: 80, msg: 'Friction points <b>opposite</b> the sliding, so it subtracts.' }], hint: 'Friction opposes the motion (to the left).', explain: 'F<sub>net</sub> = 60 N − 20 N = 40 N to the right.', sim: SIM('lab', { m: 10, F1: 60, f: 20 }, 0, { value: s => Math.abs(s.Fnet) }) },
      { type: 'q', id: 'd1q8', qtype: 'mc', prompt: 'In a tug-of-war, Team Right pulls a 20 kg crate with 50 N and Team Left pulls with 50 N. The floor is frictionless and the crate starts at rest. What happens?', choices: ['The crate speeds up to the right.', 'The crate stays at rest, because the net force is zero.', 'The crate moves at a constant velocity to the left.', 'The crate speeds up, because there are two forces on it.'], answer: 1, why: { 3: 'Two forces can cancel. What matters is their <b>sum</b>.', 0: 'The pulls are equal and opposite.' }, hint: 'Add the two forces with directions.', explain: '50 N − 50 N = 0. Balanced forces on an object at rest: it stays at rest.', sim: SIM('lab', { m: 20, F1: 50, F2: 50 }, 3, { test: s => s.Fnet === 0 && s.motion === 'at rest' }) },
      { type: 'q', id: 'd1q9', qtype: 'mc', prompt: 'A 4.0 kg cart on a frictionless floor is pushed 12 N to the right and 20 N to the left. What is the net force?', choices: ['32 N to the right', '8 N to the right', '8 N to the left', '32 N to the left'], answer: 2, why: { 1: 'Right size, wrong direction: the bigger push is to the left.', 0: 'Opposite forces subtract.', 3: 'Opposite forces subtract.' }, hint: '(+12 N) + (−20 N) = ?', explain: '(+12) + (−20) = −8 N, so 8 N to the left.', sim: SIM('lab', { m: 4, F1: 12, F2: 20 }, 0, { test: s => near(s.Fnet, -8) }) },
    ] },
    { id: 's4', title: 'Newton’s First Law and inertia', time: '9 min', pe: ['HS-PS2-1'], sep: ['Analyzing and interpreting data'], ccc: ['Cause and effect'], blocks: [
      { type: 'html', html: `<div class="formula"><b>Newton’s First Law:</b> If the net force on an object is zero, the object stays at rest or keeps moving at a constant velocity (same speed, same direction).</div>
        <p>An object’s tendency to keep doing what it is already doing is called <b>inertia</b>. Mass is the measure of inertia: a 20 kg box is harder to start or stop than a 2 kg box.</p>
        <p>So the answer to today’s phenomenon: the puck does <b>not</b> need a force to keep moving. On ice there is almost no friction, so F<sub>net</sub> ≈ 0 and it keeps its velocity. The box on the floor stops because <b>friction</b> is an unbalanced force opposite its motion.</p>` },
      { type: 'mis', html: '“A moving object needs a force to keep it moving.” <b>No:</b> a force is needed to <b>change</b> motion (speed up, slow down, or turn), not to keep it going. Constant velocity means zero net force.' },
      { type: 'vocab', terms: [['inertia', 'an object’s resistance to changes in its motion; measured by its mass'], ['constant velocity', 'same speed in the same direction (acceleration = 0)'], ['at rest', 'velocity = 0 and staying that way']] },
      LAB,
      { type: 'steps', items: ['Use the Q10 button, then press ▶ Run. Watch the v–t graph: is it flat?', 'Use the Q11 button and run it. Compare the v–t graph.', 'For Q13, load each situation (A–D) and look at F<sub>net</sub> and the motion in the readout.'] },
      { type: 'q', id: 'd1q10', qtype: 'mc', prompt: 'A 0.5 kg puck slides at 3.0 m/s on frictionless ice with no push. According to the sim, after 4.0 s the puck is…', choices: ['stopped, because it ran out of force', 'still moving at 3.0 m/s', 'moving slower than 3.0 m/s, but not stopped', 'moving faster than 3.0 m/s'], answer: 1, why: { 0: 'Objects don’t “run out of force”. What force would slow it down here?', 2: 'Slowing down requires a net force opposite the motion. Is there one on frictionless ice?' }, hint: 'Look at the v–t graph after you run the sim.', explain: 'With F<sub>net</sub> = 0, the velocity stays 3.0 m/s: Newton’s First Law. The v–t graph is a flat (horizontal) line.', sim: SIM('lab', { m: 0.5, v0: 3 }, 4, { test: s => near(s.v, 3) && s.motion === 'constant velocity, moving right' }) },
      { type: 'q', id: 'd1q11', qtype: 'mc', prompt: 'A 10 kg box slides to the right at 3.0 m/s on a rough floor (friction 20 N). Nobody pushes it. What happens, and why?', choices: ['It keeps moving at 3.0 m/s, because of its inertia.', 'It slows down and stops, because friction is an unbalanced force opposite its motion.', 'It stops instantly, because no force is pushing it.', 'It speeds up, because friction acts on it.'], answer: 1, why: { 0: 'Inertia would keep it moving only if F<sub>net</sub> were zero. Is it?', 2: 'Run the sim: it takes time to stop. The box’s inertia keeps it moving while friction slows it.' }, hint: 'Find F<sub>net</sub>. Which way does it point compared to the velocity?', explain: 'F<sub>net</sub> = 20 N to the left, opposite the velocity, so the box slows down (it stops after 1.5 s). Friction stops it; it does not push it backward.', sim: SIM('lab', { m: 10, f: 20, v0: 3 }, 3, { test: s => s.v === 0 && s.motion === 'at rest' && near(PHYS.simulate('lab', { m: 10, f: 20, v0: 3 }, 0).Fnet, -20) }) },
      { type: 'q', id: 'd1q12', qtype: 'num', prompt: 'A student pushes a 10 kg box with a 30 N force and the box slides at a <b>constant velocity</b> of 2.0 m/s. What is the size of the friction force on the box?', unit: 'N', answer: 30, hint: 'Constant velocity → F<sub>net</sub> = 0. Then the push and friction must…', explain: 'F<sub>net</sub> = 0, so friction = 30 N, to the left, exactly balancing the push.', sim: SIM('lab', { m: 10, F1: 30, f: 30, v0: 2 }, 2, { value: s => Math.abs(s.Ff) }) },
      { type: 'q', id: 'd1q13', qtype: 'multi', prompt: 'Use the sim to test each situation. <b>Select ALL</b> situations in which the box is in <b>equilibrium</b> (F<sub>net</sub> = 0).', choices: ['A. 8 kg box at rest; nobody pushes.', 'B. 8 kg box pushed with 24 N, friction 24 N, moving at a constant 1.0 m/s.', 'C. 8 kg box pushed with 40 N, friction 24 N, starting from rest.', 'D. 8 kg box sliding at 2.0 m/s with friction 24 N and no push.'], answer: [0, 1], hint: 'Load each one (buttons A–D) and read F<sub>net</sub>.', explain: 'A and B have F<sub>net</sub> = 0 (one at rest, one at constant velocity). C (16 N right, speeding up) and D (24 N left, slowing down) are unbalanced.',
        sim: [SIM('lab', { m: 8 }, 0, { label: 'Load A', test: s => s.Fnet === 0 }), SIM('lab', { m: 8, F1: 24, f: 24, v0: 1 }, 0, { label: 'Load B', test: s => s.Fnet === 0 }), SIM('lab', { m: 8, F1: 40, f: 24 }, 0, { label: 'Load C', test: s => near(s.Fnet, 16) }), SIM('lab', { m: 8, f: 24, v0: 2 }, 0, { label: 'Load D', test: s => near(s.Fnet, -24) })] },
    ] },
    { id: 's5', title: 'CER: can something move with no net force?', time: '6 min', pe: ['HS-PS2-1'], sep: ['Engaging in argument from evidence'], ccc: ['Cause and effect'], blocks: [
      { type: 'html', html: `<p>On the Regents exam you will often be asked to <b>support or refute a claim</b> using data. A strong answer has three parts:</p>
        <ul><li><b>Claim:</b> a sentence that answers the question.</li><li><b>Evidence:</b> specific data (numbers!) from a table, graph, or the sim.</li><li><b>Reasoning:</b> the science idea that connects the evidence to the claim (here, Newton’s First Law).</li></ul>` },
      LAB,
      { type: 'steps', title: '🧭 Collect evidence', items: ['Press the Q14 button (10 kg, push 30 N, friction 30 N, starting at 2.0 m/s). Press ▶ Run.', 'When it stops at t = 3 s, press <b>● Record this trial</b>.', 'Now set the starting velocity to 0 and the push to 50 N. Reset, run, and record again.', 'Optional: press <b>⬇ Download CSV</b> to save your data table.'] },
      { type: 'q', id: 'd1q14', qtype: 'fr', minWords: 30, prompt: 'A student claims: <i>“An object cannot be moving if the net force on it is zero.”</i> <b>Support or refute</b> this claim. Write a claim, give evidence with numbers from the sim, and explain your reasoning.', sample: '<b>Claim:</b> The claim is false; an object can move with zero net force. <b>Evidence:</b> In the sim the 10 kg box pushed with 30 N against 30 N of friction had F<sub>net</sub> = 0 N, and its velocity stayed 2.0 m/s for the whole 3 s (a flat v–t graph). When the push was 50 N, F<sub>net</sub> was 20 N and the box sped up instead. <b>Reasoning:</b> Newton’s First Law says that with zero net force an object keeps a constant velocity. A net force is needed to <b>change</b> motion, not to keep it going.', rubric: ['A clear claim (refute)', 'Evidence: F<sub>net</sub> = 0 N with numbers for the forces', 'Evidence: velocity stayed constant (2.0 m/s) / flat v–t graph', 'Reasoning names Newton’s First Law or inertia'], sim: SIM('lab', { m: 10, F1: 30, f: 30, v0: 2 }, 3, { test: s => s.Fnet === 0 && near(s.v, 2) }) },

      { type: 'q', id: 'd1e1', tag: 'exit', qtype: 'num', prompt: 'A 5.0 kg box on a frictionless floor is pushed 35 N to the right and 12 N to the left. What is the magnitude of the net force?', unit: 'N', answer: 23, traps: [{ v: 47, msg: 'Opposite forces subtract.' }], hint: 'Right +, left −.', explain: '35 N − 12 N = 23 N to the right.', sim: SIM('lab', { m: 5, F1: 35, F2: 12 }, 0, { value: s => Math.abs(s.Fnet) }) },
      { type: 'q', id: 'd1e2', tag: 'exit', qtype: 'mc', regents: 1, prompt: 'An 8.0 kg cart moves to the right at a constant 1.5 m/s while a student pushes it with 25 N. Which statement is correct?', choices: ['The net force is 25 N to the right.', 'The friction force must be less than 25 N.', 'The net force is zero, so friction is 25 N to the left.', 'There must be a “force of motion” equal to 25 N.'], answer: 2, why: { 0: 'If F<sub>net</sub> were 25 N, the cart would be speeding up.', 1: 'If friction were smaller than the push, the cart would speed up.', 3: 'There is no “force of motion”.' }, hint: 'Constant velocity tells you F<sub>net</sub>.', explain: 'Constant velocity → F<sub>net</sub> = 0 → friction balances the push: 25 N to the left.', sim: SIM('lab', { m: 8, F1: 25, f: 25, v0: 1.5 }, 2, { test: s => s.Fnet === 0 && near(s.v, 1.5) && near(s.Ff, -25) }) },
      { type: 'q', id: 'd1e3', tag: 'exit', qtype: 'fbd', prompt: '<b>Build the FBD:</b> a student pushes a heavy 8.0 kg box to the right with 15 N, but the box <b>does not move</b> (the floor can supply up to 40 N of friction).', pic: D1BOX({ push: 1, note: 'pushed but not moving' }), forces: FBD_PAL, expect: [{ f: 'Fg', dir: 270 }, { f: 'FN', dir: 90 }, { f: 'Fapp', dir: 0 }, { f: 'Ff', dir: 180 }], rel: [['FN', '=', 'Fg'], ['Fapp', '=', 'Ff']], relMsg: 'The box stays at rest, so F<sub>net</sub> = 0. Make the push and friction the same length (and F<sub>N</sub> = F<sub>g</sub>).', hint: 'Friction holds it still: friction pushes against the push, just as hard as needed.', explain: 'Friction is 15 N to the left (only as big as needed to keep it still, up to 40 N). F<sub>N</sub> = F<sub>g</sub> = 78.4 N.', sim: SIM('lab', { m: 8, F1: 15, f: 40 }, 2, { test: s => s.v === 0 && near(s.Ff, -15) }) },
      { type: 'exitcard' },

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsolved: The 1982 Tylenol Murders | A Virtual Museum</title>
<style>
:root{
  --bg:#121318;--bg2:#1a1c23;--panel:#22252e;--panel2:#2a2e39;--line:#363a48;
  --ink:#ece8df;--mute:#aaa69b;--brass:#c9a54a;--brass2:#e6c872;
  --red:#c0574a;--green:#5fb878;--paper:#efe6d2;--paperInk:#2b2620;--wc:#c9a54a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#2a2633 0%,var(--bg) 55%) fixed}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:normal;letter-spacing:.2px}
h1{font-size:34px;margin:0 0 6px}
h2{font-size:26px;margin:0 0 6px}
h3{font-size:19px;margin:0 0 6px}
p{margin:6px 0}
a{color:var(--brass2)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--brass2);outline-offset:2px}
.sr{position:absolute;left:-9999px}
/* header */
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 14px;background:rgba(12,13,17,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(4px)}
#top .brand{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink);cursor:pointer;padding:4px 6px;border-radius:8px;margin-right:auto}
#top .brand b{font-family:Georgia,serif;font-weight:normal;font-size:19px;letter-spacing:.5px}
#top .brand small{color:var(--mute);font-size:12px;display:block;line-height:1}
.nav{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer}
.nav:hover{border-color:var(--brass)}
.nav.on{background:var(--brass);color:#1b1608;border-color:var(--brass)}
.nav .pill{display:inline-block;background:#00000040;border-radius:999px;padding:0 7px;margin-left:4px;font-weight:700}
main{max-width:1260px;margin:0 auto;padding:14px 18px 50px}
/* buttons */
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:var(--brass);color:#1b1608;border:0;border-radius:9px;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 2px 0 #7c6424}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--brass)}
.btn.small{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mute)}
.small{font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kicker{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--wc);font-weight:700}
/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;transition:.35s;background:#1d1f27;border:1px solid var(--brass);color:var(--ink);padding:11px 18px;border-radius:12px;z-index:50;box-shadow:0 10px 30px #0008;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* welcome */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:center;margin-top:10px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:44px;line-height:1.05}
.hero .tag{color:var(--brass2);font-size:15px;letter-spacing:3px;text-transform:uppercase}
.advisory{border-left:4px solid var(--brass);background:#1b1c22;padding:10px 14px;border-radius:8px;font-size:14px}
input.text,textarea{background:#14161b;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;width:100%}
input.text:focus,textarea:focus{border-color:var(--brass);outline:none}
textarea{min-height:92px;resize:vertical;font-size:15px}
/* lobby */
.lobby-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.floor{display:grid;grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;grid-template-rows:auto auto;gap:0;border:6px solid #3a3530;border-radius:14px;background:#191a1f;box-shadow:inset 0 0 0 2px #00000060,0 14px 40px #0007;overflow:hidden}
.room{position:relative;min-height:168px;padding:12px 12px 10px;border:3px solid #3a3530;background:linear-gradient(180deg,#22242c,#1b1c22);color:var(--ink);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:background .2s}
.room:hover,.room:focus-visible{background:linear-gradient(180deg,#2c2f39,#20222a)}
.room .num{font-family:Georgia,serif;font-size:13px;color:var(--rc);letter-spacing:2px}
.room .ttl{font-family:Georgia,serif;font-size:19px;line-height:1.15}
.room .sub{font-size:13px;color:var(--mute)}
.room .ico{width:46px;height:46px;margin-top:auto}
.room .door{position:absolute;bottom:-3px;left:50%;width:44px;height:6px;margin-left:-22px;background:#191a1f}
.room .st{position:absolute;right:9px;top:9px;width:42px;height:42px}
.room .time{position:absolute;right:10px;bottom:9px;font-size:12px;color:var(--mute)}
.rotunda{grid-column:3;grid-row:1 / span 2;border:3px solid #3a3530;background:radial-gradient(circle at 50% 40%,#2d2a22,#1b1b20 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:8px}
.rotunda h3{color:var(--brass2)}
@media (max-width:900px){.floor{grid-template-columns:1fr 1fr}.rotunda{grid-column:1 / span 2;grid-row:auto}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:10px}
/* wing */
.wing-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--wc);padding-bottom:8px;margin-bottom:12px;flex-wrap:wrap}
.wing-head h1{font-size:32px}
.wing-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
@media (max-width:1000px){.wing-grid{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:64px}
@media (max-width:1000px){.side{position:static}}
.plaques{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:12px}
.plaque{background:var(--bg2);border-left:4px solid var(--wc);padding:9px 12px;border-radius:8px;font-size:15px}
.plaque b{color:var(--wc);display:block;font-family:Georgia,serif;font-weight:normal;font-size:17px;margin-bottom:2px}
.ix{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--wc);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.ix-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ix-title h3{margin:0}
.hands{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;background:var(--wc);color:#14130f;padding:3px 9px;border-radius:999px;font-weight:800}
.progress{font-size:13px;color:var(--mute)}
.done-banner{background:#1d3326;border:1px solid var(--green);color:#c9f0d4;border-radius:9px;padding:8px 12px;margin-top:10px;font-size:14px}
.spark{background:linear-gradient(160deg,#2f2a1c,#22252e 60%);border:1px solid var(--brass);border-radius:12px;padding:12px 14px}
.spark h3{color:var(--brass2);display:flex;align-items:center;gap:7px;font-size:18px}
.spark ol{margin:6px 0 8px 18px;padding:0;font-size:14.5px}
.spark li{margin-bottom:5px}
.terms{display:flex;flex-wrap:wrap;gap:5px}
.term{font-size:12.5px;background:#14161b;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:#e9dcb5;cursor:pointer}
.term:hover{border-color:var(--brass)}
.note-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.note-box h3{font-size:17px;display:flex;justify-content:space-between;align-items:center}
.star{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px}
.star.on{color:#1b1608;background:var(--brass2);border-color:var(--brass2);font-weight:700}
.saved{font-size:12px;color:var(--green);min-height:16px}
.wing-nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
/* generic choice */
.opt{display:block;width:100%;text-align:left;background:#191b21;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;font-size:15px;cursor:pointer}
.opt:hover{border-color:var(--wc)}
.opt.right{border-color:var(--green);background:#1b2e22}
.opt.wrong{border-color:var(--red);background:#331d1b}
.opt.pick{border-color:var(--brass);background:#2d2818}
.fb{font-size:14.5px;margin-top:6px;min-height:20px}
.fb.ok{color:#9be3b0}.fb.no{color:#f2a99f}
/* victims */
.memorial{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;background:#0e0f13;border-radius:10px;padding:14px;border:1px solid #2b2d35}
.candle{background:linear-gradient(180deg,#1b1c22,#15161b);border:1px solid #33353f;border-radius:10px;color:var(--ink);padding:10px 10px 12px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:200px}
.candle:hover{border-color:var(--wc)}
.candle.lit{border-color:#6b5a2c;background:radial-gradient(circle at 50% 18%,#3a3020 0,#1b1c22 55%)}
.candle .nm{font-family:Georgia,serif;font-size:17px;line-height:1.15}
.candle .meta{font-size:12.5px;color:var(--mute)}
.candle .mem{font-size:13px;line-height:1.35;color:#e9e2d0;margin-top:4px}
.flame{transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1)}40%{transform:scale(.92,1.06)}70%{transform:scale(1.05,.95)}}
@media (prefers-reduced-motion:reduce){.flame,.spin,.flow{animation:none!important}}
/* timeline */
.tl-mode{display:flex;gap:6px;margin-bottom:10px}
.track{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding:22px 6px 4px;overflow-x:auto;gap:2px}
.track:before{content:"";position:absolute;left:10px;right:10px;top:31px;height:3px;background:linear-gradient(90deg,var(--wc),#7a8aa8)}
.tdot{position:relative;z-index:1;background:none;border:0;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:58px;padding:0 2px}
.tdot i{display:block;width:20px;height:20px;border-radius:50%;background:#1a1c23;border:3px solid var(--wc)}
.tdot.on i{background:var(--wc);box-shadow:0 0 0 5px #5b8fd640}
.tdot.seen i{background:#38496b}
.tdot.on.seen i{background:var(--wc)}
.tdot span{font-size:11.5px;color:var(--mute);text-align:center;line-height:1.15;max-width:76px}
.tcard{background:var(--bg2);border-radius:10px;padding:12px 14px;margin-top:8px;border-left:4px solid var(--wc);min-height:84px}
.tcard .when{font-size:13px;color:var(--wc);font-weight:700;letter-spacing:.5px}
.order{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:8px}
.ocard{background:#191b21;border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:10px;text-align:left;cursor:pointer;font-size:14.5px;display:flex;gap:8px;align-items:flex-start}
.ocard .k{flex:none;width:26px;height:26px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.ocard.placed{border-color:var(--green);background:#1b2e22}
.ocard.placed .k{background:var(--green);border:0;color:#0d1d12}
.ocard.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* suspects */
.unsolved{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:Georgia,serif;font-size:22px;letter-spacing:4px;padding:2px 14px;transform:rotate(-4deg);border-radius:6px}
.files{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:-2px}
.ftab{background:#cdbf9f;color:#2b2620;border:0;border-radius:8px 8px 0 0;padding:7px 12px;font-weight:700;font-size:13.5px;cursor:pointer;opacity:.75}
.ftab.on{opacity:1;background:var(--paper)}
.ftab.seen:not(.on){opacity:.95}
.ftab .ck{color:#2d6b3c}
.folder{background:var(--paper);color:var(--paperInk);border-radius:0 10px 10px 10px;padding:14px 16px;min-height:200px;font-size:15px;position:relative;font-family:"Courier New",Courier,monospace}
.folder h3{font-family:Georgia,serif;color:#5b1d16;font-size:21px}
.folder .status{position:absolute;right:14px;top:12px;border:2px solid #8b2a1e;color:#8b2a1e;padding:1px 8px;font-weight:800;letter-spacing:1px;transform:rotate(3deg);font-size:13px;font-family:Arial,sans-serif;background:#efe6d2}
.folder dt{font-weight:800;margin-top:8px;font-family:Arial,sans-serif;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:#6b5b45}
.folder dd{margin:2px 0 0 0}
.evgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.ev{background:#191b21;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ev .tag{font-size:11.5px;letter-spacing:1.5px;color:var(--wc);font-weight:800;text-transform:uppercase}
.ev p{font-size:14.5px}
.ev .opt{font-size:13.5px;padding:7px 10px;margin:4px 0}
/* cyanide */
.bio-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
@media (max-width:860px){.bio-wrap{grid-template-columns:1fr}}
.bio-svg{width:100%;height:auto;background:#0d1a1c;border-radius:10px;border:1px solid #234044;display:block}
.hot{cursor:pointer}
.hot:hover>*:first-child,.hot:focus>*:first-child{stroke:#fff;stroke-width:3}
.hot:focus{outline:none}
.info{background:var(--bg2);border-radius:10px;padding:10px 12px;border-left:4px solid var(--wc);min-height:120px;font-size:14.5px}
.meter{height:18px;background:#14161b;border-radius:999px;border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#3fb6a8,#8fe0c9);transition:width 1.4s ease}
.meter.low i{background:linear-gradient(90deg,#c0574a,#e08a3c)}
.spin{animation:spin 2s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.flip{background:#191b21;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px;min-height:96px;cursor:pointer;text-align:left;font-size:14px}
.flip.on{border-color:var(--wc);background:#13282a}
.flip b{display:block;color:var(--wc);margin-bottom:3px}
/* safety */
.pkg-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
@media (max-width:860px){.pkg-wrap{grid-template-columns:1fr}}
.pkg-svg{width:100%;height:auto;background:#1a1d16;border-radius:10px;border:1px solid #39402e;display:block}
.hs circle{fill:var(--wc);stroke:#111;stroke-width:2}
.hs text{fill:#111;font:bold 15px Arial;pointer-events:none}
.hs.found circle{fill:#5fb878}
.hs{cursor:pointer}
.hs:focus{outline:none}.hs:focus circle,.hs:hover circle{stroke:#fff;stroke-width:3}
.rules{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rule{background:#191b21;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:13px;flex:1 1 150px}
.rule b{color:var(--wc);display:block}
.insp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.insp .card{background:#191b21;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.insp svg{width:100%;height:120px}
/* recall */
.decision{background:var(--bg2);border-radius:10px;padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--wc)}
.decision .q{font-weight:600}
.real{background:#2d2214;border:1px solid #6b4a22;border-radius:9px;padding:9px 12px;margin-top:6px;font-size:14.5px}
.real b{color:#f0b56c}
.chart{width:100%;max-width:420px;height:auto}
.credo{font-family:Georgia,serif;font-style:italic;color:#f0d9b0}
/* news */
.versus{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media (max-width:860px){.versus{grid-template-columns:1fr}}
.era{border-radius:12px;padding:10px;border:1px solid var(--line)}
.era.old{background:#231f17}
.era.new{background:#151a26}
.era h3{margin-bottom:6px}
.phone{width:260px;max-width:100%;margin:0 auto;background:#0b0c10;border:3px solid #444a5a;border-radius:28px;padding:16px 10px;min-height:320px}
.post{background:#1d2230;border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:13px;font-family:Arial,sans-serif}
.post .who{font-weight:700;font-size:12px;color:#9fb4dd}
.post.alert{background:#4a1d1d;border:1px solid #c0574a}
.post .opt{font-size:12.5px;padding:5px 8px;margin:4px 0}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.chip{background:#191b21;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.chip .row{margin-top:6px;gap:6px}
.chip.ok{border-color:var(--green)}
.chip.bad{border-color:var(--red)}
/* legacy */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){.match{grid-template-columns:1fr}}
.mbtn{display:block;width:100%;text-align:left;background:#191b21;border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 11px;margin-bottom:7px;cursor:pointer;font-size:14.5px}
.mbtn.sel{border-color:var(--brass)}
.mbtn.done{border-color:var(--green);background:#1b2e22;cursor:default}
.mbtn .pair{font-size:12px;color:#9be3b0;font-weight:700}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.case{background:var(--bg2);border-top:3px solid var(--wc);border-radius:9px;padding:9px 11px;font-size:14px}
.case b{display:block;font-family:Georgia,serif;font-weight:normal;font-size:16px;color:#cfe0e8}
/* passport */
.passport{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:#1f2a3a;border:2px solid #3d4f6b;border-radius:16px;padding:18px}
@media (max-width:800px){.passport{grid-template-columns:repeat(2,1fr)}}
.pslot{background:#f1ead8;color:#2b2620;border-radius:10px;padding:10px;text-align:center;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;cursor:pointer;font:inherit}
.pslot svg{width:110px;height:110px}
.pslot small{font-size:12px;color:#6b5b45}
/* notebook */
.nb{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.nb .note-box textarea{min-height:80px}
/* finale */
.sugg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.scard{background:var(--bg2);border-radius:12px;padding:12px;border-top:4px solid var(--wc)}
.scard .why{font-size:12.5px;color:var(--mute)}
.focus-opt{display:flex;gap:8px;align-items:flex-start;background:#14161b;border:2px solid var(--line);border-radius:9px;padding:8px 10px;margin:6px 0;cursor:pointer;font-size:14.5px;width:100%;text-align:left;color:var(--ink)}
.focus-opt.on{border-color:var(--brass);background:#2d2818}
.focus-opt .dot{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--brass);margin-top:2px}
.focus-opt.on .dot{background:var(--brass)}
/* quiz */
.quiz{max-width:760px;margin:0 auto}
.qbar{display:flex;gap:4px;margin:8px 0 14px}
.qbar i{flex:1;height:7px;border-radius:4px;background:#2c2f39}
.qbar i.r{background:var(--green)}.qbar i.w{background:var(--red)}.qbar i.c{background:var(--brass)}
/* certificate */
.cert{max-width:900px;margin:10px auto;background:var(--paper);color:var(--paperInk);border-radius:6px;padding:30px 44px;position:relative;box-shadow:0 14px 40px #0009;border:12px double #9a7b2f;font-family:Georgia,"Times New Roman",serif;text-align:center}
.cert h1{font-size:34px;color:#4a3410;margin:4px 0}
.cert .nm{font-size:40px;border-bottom:2px solid #9a7b2f;display:inline-block;padding:0 30px 4px;margin:8px 0;color:#1d1a15}
.cert .lbl{font-family:Arial,sans-serif;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:#7a6440}
.cert .focus{font-size:20px;font-style:italic;margin:4px 0 10px}
.cert ul{list-style:none;padding:0;margin:6px 0;display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;text-align:left;font-family:Arial,sans-serif;font-size:13.5px}
.cert .seal{position:absolute;right:26px;bottom:20px;width:110px;height:110px}
.cert .foot{padding-right:120px;display:flex;justify-content:space-between;font-family:Arial,sans-serif;font-size:12.5px;margin-top:16px;color:#5b4a30;text-align:left;gap:12px}
/* teacher */
.tn table{border-collapse:collapse;width:100%;font-size:14.5px}
.tn td,.tn th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tn th{color:var(--brass2);font-weight:600}
.tn h3{color:var(--brass2);margin-top:14px}
.tn ul{margin:4px 0 8px 20px;padding:0}
.tn li{margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
/* print */
#printArea{display:none}
@media print{
  @page{margin:12mm}
  body{background:#fff!important;color:#000}
  #top,main,#toast{display:none!important}
  #printArea{display:block!important;color:#000}
  #printArea .cert{box-shadow:none;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea .pnb h2{font-family:Georgia,serif;margin:14px 0 4px;font-size:18px}
  #printArea .pnb pre{white-space:pre-wrap;font-family:Arial,sans-serif;font-size:12.5px;border:1px solid #999;padding:6px 8px;border-radius:4px;min-height:40px}
}
</style>

<script>

function defState(){return {name:'',stamps:{},visited:{},stars:{},notes:{},prog:{},quiz:null,focus:'',started:false};}

let S=load();
let saveTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,250);}
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function P(id){if(!S.prog[id])S.prog[id]={};return S.prog[id];}

 ripple:c=>`<svg viewBox="0 0 48 48" class="ico" aria-hidden="true"><circle cx="24" cy="24" r="4" fill="${c}"/><circle cx="24" cy="24" r="10" fill="none" stroke="${c}" stroke-width="2"/><circle cx="24" cy="24" r="16" fill="none" stroke="${c}" stroke-width="1.6" opacity=".7"/><circle cx="24" cy="24" r="21" fill="none" stroke="${c}" stroke-width="1.2" opacity=".4"/></svg>`,
 bulb:`<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-4 12.7V18h8v-3.3A7 7 0 0 0 12 2z" fill="#e6c872"/><rect x="8.5" y="19" width="7" height="2" rx="1" fill="#e6c872"/></svg>`
};
function stampSVG(w,on,date){
  const c=on?w.wc:'#b9ad94';
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><g transform="rotate(${on?(-8+w.n*3):0} 60 60)" opacity="${on?1:.55}">
  <circle cx="60" cy="60" r="54" fill="none" stroke="${c}" stroke-width="${on?5:2}" ${on?'':'stroke-dasharray="6 5"'}/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="${c}" stroke-width="1.5"/>
  <g transform="translate(36 30) scale(1)">${ICON[w.icon](c).replace('class="ico"','width="48" height="48"')}</g>

  ${on?`<text x="60" y="106" text-anchor="middle" font-family="Arial" font-size="8" fill="${c}">${esc(date||'')}</text>`:''}

/* ================= Wings ================= */
const WINGS=[
 {id:'victims',n:1,title:'In Memoriam',sub:'The Seven Victims',wc:'#d9b55a',min:5,icon:'candle',
  sparks:['Who were the seven people, and how have their families kept their memory alive for 40+ years?','Why did the randomness of the victims make this crime so frightening to the whole country?','How can journalists (and you!) write about real victims respectfully?'],
  terms:['Tylenol murders victims Chicago Tribune 2022','Janus family Tylenol 1982','Tylenol murders families case records'],
  focuses:['Remembering the Seven: who the victims were and the families they left','Victims\' families and the fight to unseal the case records']},
 {id:'timeline',n:2,title:'72 Hours & 44 Years',sub:'Timeline / Order of Events',wc:'#6b9be0',min:6,icon:'clock',
  sparks:['Which decision in the first 24 hours saved the most lives? Defend your pick.','How did a nurse, firefighters, a doctor and a medical examiner\'s team each add one piece of the puzzle?','What has happened in the 44 years since, and why is there still no ending?'],
  terms:['Tylenol murders timeline 1982','Helen Jensen nurse Tylenol','Cappitelli Keyworth firefighters Tylenol','Tylenol murders 40 years later'],
  focuses:['72 hours that changed America: the order of events','The first responders who cracked the medical mystery']},
 {id:'suspects',n:3,title:'Case Files',sub:'Suspects & Investigation',wc:'#d0675a',min:7,icon:'folder',
  sparks:['What evidence pointed toward each suspect, and what evidence was missing?','What is the difference between a suspect, a person of interest, and someone convicted of a crime?','Could modern DNA testing still solve this case? What makes it so hard?'],
  terms:['James Lewis Tylenol extortion letter','Roger Arnold Tylenol suspect','Tylenol murders DNA testing','Unknown Wanderer Tylenol 2026'],
  focuses:['Unsolved: weighing the evidence against each suspect','Cold-case forensics: what DNA could (and can\'t) reveal']},
 {id:'cyanide',n:4,title:'Inside the Cell',sub:'Cyanide Biology',wc:'#3fb6a8',min:7,icon:'mito',
  sparks:['How does cyanide stop cellular respiration at Complex IV (cytochrome c oxidase)?','Why are the brain and heart hit first?','How do cyanide antidotes work, and why does speed matter?'],
  terms:['cyanide cytochrome c oxidase','electron transport chain Complex IV','cyanide poisoning CDC NIOSH','cyanide antidote sodium thiosulfate'],
  focuses:['How cyanide shuts down cellular respiration','Why cyanide was so hard to detect in 1982']},
 {id:'safety',n:5,title:'Sealed for Safety',sub:'Product Safety Advances',wc:'#8fbf5a',min:5,icon:'bottle',
  sparks:['What did medicine packages look like before 1982, and why was that a problem?','How do foil seals and shrink bands show tampering?','Why did the FDA switch from "tamper-resistant" to "tamper-evident"?'],
  terms:['21 CFR 211.132 tamper-evident','Federal Anti-Tampering Act 1983','Tylenol triple seal 1982','why caplets replaced capsules'],
  focuses:['From cotton ball to foil seal: the birth of tamper-evident packaging','The laws that made tampering a federal crime']},
 {id:'recall',n:6,title:'The Recall Room',sub:'Recall & Public Relations',wc:'#e08a3c',min:6,icon:'chart',
  sparks:['Why is J&J\'s response taught as a model of crisis PR, and what are the fair critiques?','How did the company\'s Credo shape its choices?','Compare the 1982 recall with a recent product recall. What changed?'],

  focuses:['The recall that rewrote crisis PR','Hero or smart business? Judging J&J\'s choices']},
 {id:'news',n:7,title:'Then vs. Now',sub:'News & Public Alerts',wc:'#a78bdb',min:5,icon:'radio',
  sparks:['How did warnings reach people in 1982 with no internet or cell phones?','Would social media make a 2026 version safer or scarier?','How can you tell if a safety alert is real?'],

 {id:'legacy',n:8,title:'Ripples',sub:'Copycats & Legacy',wc:'#7fb3c8',min:4,icon:'ripple',
  sparks:['Why do copycat crimes happen after heavily publicized cases?','How did each copycat case change products or laws?','What is the legacy of this case for shoppers today?'],
  terms:['Stella Nickell Excedrin 1986','Diane Elsroth Tylenol 1986','Sudafed tampering 1991','Halloween candy poisoning myth'],

<script>
"use strict";
/* ================= Wing content ================= */
const WR={};
const pl=(arr)=>`<div class="plaques">${arr.map(([b,t])=>`<div class="plaque"><b>${b}</b>${t}</div>`).join('')}</div>`;
function ixBox(title,prog,inner,done){
  return `<div class="ix-title"><h3>${title}</h3><span class="row"><span class="hands">Hands-on</span><span class="progress">${prog}</span></span></div>${inner}${done?`<div class="done-banner">✓ Exhibit complete. Your passport is stamped! Jot a note on the right, then head to the next wing.</div>`:''}`;
}

/* ---------- 1 VICTIMS ---------- */
const VICTIMS=[
 {nm:'Mary Kellerman',age:'12',town:'Elk Grove Village',mem:'A seventh grader and only child. She made pottery, cooked with her mom, took guitar lessons and gymnastics, rode her pony, and played Atari with her dad.'},
 {nm:'Adam Janus',age:'27',town:'Arlington Heights',mem:'Came to the U.S. from Poland at age 8. A postal supervisor and father of two young children who liked tinkering with clocks.'},
 {nm:'Stanley Janus',age:'25',town:'Lisle',mem:'Adam\'s youngest brother. He ran an auto parts store and had married Terri in June 1982.'},
 {nm:'Theresa "Terri" Janus',age:'20*',town:'Lisle',mem:'A business student, newly married to Stanley in June 1982.'},
 {nm:'Mary "Lynn" Reiner',age:'27',town:'Winfield',mem:'A mother of four. Her youngest child had been born just days earlier.'},
 {nm:'Mary McFarland',age:'31',town:'Elmhurst',mem:'Worked at the Illinois Bell phone store in Lombard. The mother of two young sons.'},
 {nm:'Paula Prince',age:'35',town:'Chicago',mem:'A United Airlines flight attendant who lived in Chicago\'s Old Town neighborhood.'}
];
function candleSVG(lit){
  return `<svg width="56" height="78" viewBox="0 0 56 78" aria-hidden="true">
   ${lit?'<circle cx="28" cy="20" r="18" fill="#f3c969" opacity=".16"/>':''}
   <ellipse cx="28" cy="74" rx="18" ry="3" fill="#00000080"/>
   <rect x="19" y="32" width="18" height="41" rx="3" fill="${lit?'#f4ecd8':'#9d978a'}"/>
   <rect x="27.2" y="26" width="1.6" height="7" fill="#333"/>
   ${lit?'<g class="flame"><path d="M28 6c6 8 7 13 0 20-7-7-6-12 0-20z" fill="#f3c969"/><path d="M28 13c3 4 3 7 0 11-3-4-3-7 0-11z" fill="#fff4d0"/></g>':''}
  </svg>`;
}
WR.victims={
 intro:pl([['Seven lives','Between Sept 29 and Oct 1, 1982, seven people in the Chicago area died after taking Tylenol capsules that someone had laced with cyanide.'],['Ordinary reasons','A cold. A headache. A long workday. They took a trusted medicine for everyday aches.'],['One family, three losses','Adam Janus died first. His brother Stanley and sister-in-law Terri took capsules from the same bottle while grieving at his home.'],['Remember them as people','This wall shares who they were, not how they died. Light a candle to read each remembrance.']]),
 ix(){const p=P('victims');p.lit=p.lit||[];const n=p.lit.length;
  return ixBox('The Memorial Wall',`${n}/7 candles lit`,
   `<p class="muted small">Click or press Enter on each candle to light it.</p>
   <div class="memorial">${VICTIMS.map((v,i)=>{const on=p.lit.includes(i);return `<button class="candle ${on?'lit':''}" data-act="candle" data-arg="${i}" aria-pressed="${on}" aria-label="${esc(v.nm)}, ${v.age.replace('*','')}, ${esc(v.town)}${on?'. '+esc(v.mem):'. Light a candle'}">
     ${candleSVG(on)}<span class="nm">${esc(v.nm)}</span><span class="meta">${v.age}, ${esc(v.town)}</span>${on?`<span class="mem">${esc(v.mem)}</span>`:'<span class="meta">Light a candle</span>'}</button>`;}).join('')}</div>
   <p class="muted small" style="margin-top:8px">*Age 20 per the Chicago Tribune's 2022 memorial (born June 1962). Some 1982 reports listed her as 19. Details come from the Chicago Tribune's 2022 memorial and UPI reporting.</p>`,n>=7);},
 done(){return (P('victims').lit||[]).length>=7;}
};

/* ---------- 2 TIMELINE ---------- */
const TL_H=[
 {s:'Sept 28',w:'Tue Sept 28 · 4 p.m.',t:'A 50-count bottle of Extra-Strength Tylenol is bought at a Jewel store in Elk Grove Village.'},
 {s:'6:15 am',w:'Wed Sept 29 · 6:15 a.m.',t:'Mary Kellerman, 12, home with a cold, takes one capsule. She dies that morning.'},
 {s:'11 am',w:'Sept 29 · about 11 a.m.',t:'Adam Janus buys Tylenol in Arlington Heights. He dies at 3:15 p.m. Doctors first suspect a heart attack.'},
 {s:'3:45 pm',w:'Sept 29 · about 3:45 p.m.',t:'In Winfield, new mom Mary "Lynn" Reiner takes capsules for a headache.'},
 {s:'5:15 pm',w:'Sept 29 · about 5:15 p.m.',t:'Grieving at Adam\'s house, Stanley and Terri Janus take capsules from the same bottle.'},
 {s:'6:45 pm',w:'Sept 29 · about 6:45 p.m.',t:'Mary McFarland takes Tylenol on a break at work in Lombard.'},
 {s:'8 pm',w:'Sept 29 · about 8 p.m.',t:'Village nurse Helen Jensen finds the Janus bottle: 44 capsules left out of 50. Her verdict: "There\'s something in the Tylenol."'},
 {s:'9:16 pm',w:'Sept 29 · 9:16 p.m.',t:'A store camera photographs flight attendant Paula Prince buying Tylenol at a Walgreens on Wells Street.'},
 {s:'Night',w:'Sept 29 · late night',t:'Firefighters link the Janus and Kellerman cases: both took Tylenol. A medical examiner\'s investigator smells almonds in both bottles. Same lot number: MC2880.'},
 {s:'1:30 am',w:'Thu Sept 30 · 1:30 a.m.',t:'A lab finds huge amounts of cyanide in Stanley and Terri Janus\'s blood.'},
 {s:'Morning',w:'Sept 30 · 3:07 to 5:30 a.m. and after',t:'City News Bureau bulletins go out; radio spreads the warning. The medical examiner confirms cyanide at a news conference. Police drive the streets with bullhorns.'},
 {s:'Oct 1',w:'Fri Oct 1',t:'Terri Janus dies. Paula Prince is found in her apartment. The toll: seven.'},
 {s:'Oct 5',w:'Tue Oct 5, 1982',t:'Johnson & Johnson recalls Tylenol capsules nationwide, about 31 million bottles.'}
];
const TL_Y=[
 {s:'1982',w:'Nov 1982',t:'FDA requires tamper-resistant packaging (Nov 5). J&J unveils the triple-sealed bottle (Nov 11).'},
 {s:'1983',w:'Oct 1983',t:'James Lewis is convicted of extortion for the $1 million letter. Congress passes the Federal Anti-Tampering Act.'},
 {s:'1986',w:'Feb 1986',t:'A copycat cyanide death in New York. J&J stops selling over-the-counter capsules.'},
 {s:'2009',w:'Feb 2009',t:'After tips around the 25th anniversary, the FBI reviews the case and searches Lewis\'s Massachusetts home.'},
 {s:'2010',w:'2010',t:'DNA from Lewis, and from suspect Roger Arnold\'s exhumed body, reportedly does not match DNA on the bottles.'},
 {s:'2011',w:'May 2011',t:'The FBI asks for "Unabomber" Ted Kaczynski\'s DNA. No link is ever announced.'},
 {s:'2022',w:'2022 · 40th anniversary',t:'A Chicago Tribune investigation reports investigators urged prosecutors to charge Lewis. No charges are filed.'},
 {s:'2023',w:'July 2023',t:'James Lewis dies at 76 of natural causes. He was never charged with the murders.'},
 {s:'2025',w:'May 2025',t:'Netflix releases the documentary series "Cold Case: The Tylenol Murders."'},
 {s:'2026',w:'Sept 2026',t:'Idaho detectives share a possible lead (the "Unknown Wanderer"), but do not name him a suspect. The case remains open.'}
];
const ORDER=[
 {k:'a',t:'Mary Kellerman takes one capsule for a cold'},
 {k:'b',t:'Adam Janus dies at the hospital; doctors suspect a heart attack'},
 {k:'c',t:'Nurse Helen Jensen finds the Janus family\'s Tylenol bottle'},
 {k:'d',t:'A lab finds cyanide in Stanley and Terri Janus\'s blood'},
 {k:'e',t:'A news bulletin about the deaths hits Chicago radio'},
 {k:'f',t:'J&J recalls Tylenol capsules nationwide'}
];
const ORDER_SHOW=['c','f','a','e','b','d'];
let tlWrong=null;
WR.timeline={
 intro:pl([['One day','All seven victims took poisoned capsules on the same day: Wednesday, Sept 29, 1982.'],['Puzzle solvers','A village nurse, off-duty firefighters, an ICU doctor, and the medical examiner\'s team connected the deaths overnight.'],['Warnings worked','Testing found three more tainted bottles, but no one else was poisoned after the warnings went out.'],['No ending','44 years later, no one has been charged. Switch to the "44 years" view to see why.']]),
 ix(){const p=P('timeline');p.mode=p.mode||'h';p.sel=p.sel||{h:0,y:0};p.seen=p.seen||{h:[0],y:[0]};p.ord=p.ord||[];
  const L=p.mode==='h'?TL_H:TL_Y,i=p.sel[p.mode],e=L[i];
  const n=p.ord.length;
  const track=`<div class="track" role="list">${L.map((x,j)=>`<button role="listitem" class="tdot ${j===i?'on':''} ${p.seen[p.mode].includes(j)?'seen':''}" data-act="tl" data-arg="${j}" aria-label="${esc(x.w)}"><i></i><span>${esc(x.s)}</span></button>`).join('')}</div>`;
  const card=`<div class="tcard" aria-live="polite"><div class="when">${esc(e.w)}</div><div>${esc(e.t)}</div></div>
   <div class="row" style="justify-content:space-between;margin-top:6px"><button class="btn ghost small" data-act="tlstep" data-arg="-1" ${i===0?'disabled':''}>← Earlier</button><span class="muted small">${i+1} of ${L.length} · use the dots or these buttons</span><button class="btn ghost small" data-act="tlstep" data-arg="1" ${i===L.length-1?'disabled':''}>Later →</button></div>`;

const CAUSE=[{k:1,t:'Seven deaths from capsules tampered with on store shelves (1982)'},{k:2,t:'No specific federal law against product tampering'},{k:3,t:'A copycat cyanide death in New York (1986)'},{k:4,t:'Fear spreads in October 1982'}];

   <div><div class="kicker">Effect</div>${EFFECT.map(e=>{const d=p.m.includes(e.k);return `<button class="mbtn ${d?'done':''}" data-act="effect" data-arg="${e.k}" ${d?'aria-disabled="true"':''}>${d?'<span class="pair">✓ MATCHED</span><br>':''}${esc(e.t)}</button>`;}).join('')}</div></div>

   <div class="cases">${cases.map(([a,b])=>`<div class="case"><b>${a}</b>${esc(b)}</div>`).join('')}</div>`,p.m.length===4);},

function scoreWings(){
 return WINGS.map(w=>{let s=0,why=[];if(S.stars[w.id]){s+=3;why.push('you starred it');}if(S.stamps[w.id]){s+=1;why.push('you finished the exhibit');}if((S.notes[w.id]||'').trim().length>40){s+=1;why.push('you took detailed notes');}return {w,s,why};}).sort((a,b)=>b.s-a.s||a.w.n-b.w.n);
}
function pgFinale(){

const QUIZ=[
 {q:'How many people died in the 1982 Chicago-area Tylenol poisonings?',o:['3','7','12','31'],a:1,ex:'Seven people died between Sept 29 and Oct 1, 1982.'},
 {q:'Who first connected the deaths to Tylenol?',o:['An FBI profiler, months later','Local firefighters, a village nurse, and doctors, within hours','The killer\'s confession','A newspaper reader'],a:1,ex:'Off-duty firefighters, nurse Helen Jensen, an ICU doctor and the medical examiner\'s team linked them overnight.'},
 {q:'Tainted capsules came from batches made at two different factories. What did that suggest?',o:['Both factories had a careless worker','The bottles were tampered with after reaching stores','The capsules expired','The bottles were counterfeit'],a:1,ex:'Two plants made a factory source unlikely; tampering happened in stores.'},
 {q:'Cyanide blocks which part of cellular respiration?',o:['Glycolysis in the cytoplasm','Complex IV (cytochrome c oxidase)','Hemoglobin in red blood cells','The cell nucleus'],a:1,ex:'Cyanide binds Complex IV, the last enzyme of the electron transport chain.'},
 {q:'Why are cells starved of energy even with oxygen in the blood?',o:['The lungs stop working first','Cells can\'t use the oxygen to make ATP','Oxygen turns into cyanide','The heart pumps too fast'],a:1,ex:'Oxygen is delivered but can\'t accept electrons, so ATP production crashes.'},
 {q:'What was James Lewis convicted of?',o:['The seven murders','Extortion: a $1 million letter to J&J','Product tampering','Nothing at all'],a:1,ex:'He was convicted of extortion in 1983 and never charged with the murders.'},
 {q:'What is the official status of the case today?',o:['Solved in 2010 with DNA','Solved by a 2023 confession','Unsolved: no one has been charged','Closed for good'],a:2,ex:'The case remains open and unsolved.'},
 {q:'About how many bottles did J&J recall nationwide?',o:['31,000','About 31 million','About 3 billion','None, only Chicago stores'],a:1,ex:'About 31 million bottles, worth about $100 million (some 1982 reports said 22 million).'},
 {q:'FDA rules after 1982 require packaging that...',o:['Is impossible to open','Gives visible evidence if someone tampered with it','Is made of glass','Has a child lock only'],a:1,ex:'Packages must give "visible evidence" of tampering; since 1998 they are called tamper-evident.'},
 {q:'After a 1986 copycat death, what did J&J do?',o:['Stopped selling OTC capsules and switched to caplets','Stopped making Tylenol','Moved its factories overseas','Nothing'],a:0,ex:'J&J ended over-the-counter capsules; solid caplets replaced them.'}

function pgQuiz(){

  return `<div class="quiz"><h1>Quiz complete</h1><div class="panel" style="text-align:center"><div style="font-size:48px;font-family:Georgia;color:var(--brass2)">${sc} / ${QUIZ.length}</div><p>${sc>=8?'Excellent. You really explored the museum.':sc>=5?'Good work. Revisit a wing or two to fill the gaps.':'Revisit the wings, then try again.'}</p>

 const q=QUIZ[qz.i],ans=qz.ans[qz.i],done=ans!=null;

  <div class="qbar">${QUIZ.map((x,i)=>`<i class="${qz.ans[i]==null?(i===qz.i?'c':''):(qz.ans[i]===x.a?'r':'w')}"></i>`).join('')}</div>

  <div class="fb ${done?(ans===q.a?'ok':'no'):''}" aria-live="polite">${done?(ans===q.a?'✓ Correct. ':'✗ Not quite. ')+esc(q.ex):'<span class="muted">Tip: press A–D to answer.</span>'}</div>
  ${done?`<div class="row" style="margin-top:10px"><button class="btn" data-act="qnext" id="qnext">${qz.i===QUIZ.length-1?'See my score':'Next question →'}</button></div>`:''}</div>`;
}

function code(){const s=(S.name||'')+'|'+(S.focus||'')+'|'+Object.keys(S.stamps).sort().join(',');let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ('TM-'+((h>>>0).toString(36).toUpperCase())).slice(0,10);}

 let r=h||(S.started?'lobby':'welcome');
 const [pg,arg]=r.split('/');route=pg;
 const m=$('#main');
 let html;
 switch(pg){
  case 'welcome':html=pgWelcome();break;
  case 'wing':html=pgWing(arg);if(W(arg)&&!S.visited[arg]){S.visited[arg]=today();save();}break;
  case 'passport':html=pgPassport();break;
  case 'notebook':html=pgNotebook();break;
  case 'finale':html=pgFinale();break;
  case 'quiz':html=pgQuiz();break;
  case 'cert':html=pgCert();break;
  case 'teacher':html=pgTeacher();break;
  default:html=pgLobby();route='lobby';
 }
 m.innerHTML=html;
 document.querySelectorAll('#top .nav').forEach(b=>b.classList.toggle('on',b.dataset.go===route));
 $('#stampCount').textContent=stampCount()+'/8';
 window.scrollTo(0,0);
 m.focus({preventScroll:true});
}
function go(r){if(location.hash==='#'+r)render();else location.hash=r;}
window.addEventListener('hashchange',render);

function refreshWing(id,focusSel){
 const box=$('#ix-'+id);if(!box)return;
 const y=window.scrollY;
 box.innerHTML=WR[id].ix();
 if(focusSel){const el=box.querySelector(focusSel);if(el)el.focus({preventScroll:true});}
 window.scrollTo(0,y);
 checkStamp(id);
}
function checkStamp(id){
 if(!S.stamps[id]&&WR[id].done()){S.stamps[id]=today();save();const w=W(id);
  toast(`🛂 Passport stamped: <b>${w.title}</b> (${stampCount()}/8)`);
  $('#stampCount').textContent=stampCount()+'/8';
  const ss=$('#stampStatus');if(ss){ss.textContent='✓ Stamped '+S.stamps[id];ss.nextElementSibling.innerHTML=stampSVG(w,true,'');}
  const box=$('#ix-'+id);if(box)box.innerHTML=WR[id].ix();
 } else save();
}
const sel=(act,arg)=>`[data-act="${act}"][data-arg="${CSS.escape(String(arg))}"]`;

/* ================= Actions ================= */
const ACT={
 start(){const v=($('#nameIn')||{}).value||'';S.name=v.trim();S.started=true;save();go('lobby');},
 candle(a){const p=P('victims');const i=+a;if(!p.lit.includes(i))p.lit.push(i);else return;refreshWing('victims',sel('candle',a));},
 tl(a){const p=P('timeline');p.sel[p.mode]=+a;if(!p.seen[p.mode].includes(+a))p.seen[p.mode].push(+a);refreshWing('timeline',sel('tl',a));},
 tlstep(a){const p=P('timeline');const L=p.mode==='h'?TL_H:TL_Y;const n=Math.max(0,Math.min(L.length-1,p.sel[p.mode]+(+a)));p.sel[p.mode]=n;if(!p.seen[p.mode].includes(n))p.seen[p.mode].push(n);refreshWing('timeline',sel('tlstep',a));},
 tlmode(a){P('timeline').mode=a;refreshWing('timeline',sel('tlmode',a));},
 ord(a){const p=P('timeline');if(p.ord.includes(a))return;if(ORDER[p.ord.length].k===a){p.ord.push(a);tlWrong=null;}else tlWrong=a;refreshWing('timeline',sel('ord',a));tlWrong=null;},
 file(a){const p=P('suspects');p.cur=a;if(!p.open.includes(a))p.open.push(a);refreshWing('suspects',sel('file',a));},
 ev(a){const [i,j]=a.split(':').map(Number);P('suspects').ev[i]=j;refreshWing('suspects',sel('ev',a));},
 zoom(a){const p=P('cyanide');p.zoom=a==='1';if(!p.zoom){p.cn=false;}p.cur=null;refreshWing('cyanide',p.zoom?'[data-act="cn"]':'[data-act="zoom"]');},
 cn(){const p=P('cyanide');p.cn=!p.cn;if(p.cn){p.cnTried=true;p.cur='c4';if(!p.parts.includes('c4'))p.parts.push('c4');}refreshWing('cyanide','[data-act="cn"]');},
 part(a){const p=P('cyanide');p.cur=a;if(!p.parts.includes(a))p.parts.push(a);refreshWing('cyanide',sel('part',a));},
 cyq(a){P('cyanide').q=+a;refreshWing('cyanide',sel('cyq',a));},
 flip(a){const p=P('cyanide');if(!p.flip.includes(+a))p.flip.push(+a);refreshWing('cyanide',sel('flip',a));},
 pview(a){const p=P('safety');p.view=a;p.cur=null;refreshWing('safety',sel('pview',a));},
 feat(a){const p=P('safety');p.cur=a;const L=a[0]==='a'?p.found:p.bf;if(!L.includes(a))L.push(a);refreshWing('safety',sel('feat',a));},
 insp(a){const [i,j]=a.split(':').map(Number);P('safety').insp[i]=j;refreshWing('safety',sel('insp',a));},
 dec(a){const [i,j]=a.split(':').map(Number);const p=P('recall');if(p.d[i]!=null)return;p.d[i]=j;refreshWing('recall',sel('dec',a));},
 old(a){const p=P('news');p.cur=a;if(!p.old.includes(a))p.old.push(a);refreshWing('news',sel('old',a));},
 sort(a){const [k,v]=a.split(':');P('news').sort[k]=v;refreshWing('news',sel('sort',a));},
 trust(a){const [i,j]=a.split(':').map(Number);P('news').trust[i]=j;refreshWing('news',sel('trust',a));},
 cause(a){const p=P('legacy');if(p.m.includes(+a))return;p.sel=+a;lgWrong=false;refreshWing('legacy',sel('cause',a));},
 effect(a){const p=P('legacy');const k=+a;if(p.m.includes(k))return;if(!p.sel){toast('Pick a cause on the left first.');return;}
  if(p.sel===k){p.m.push(k);p.sel=null;lgWrong=false;}else lgWrong=true;refreshWing('legacy',sel('effect',a));lgWrong=false;},
 star(a){S.stars[a]=!S.stars[a];if(!S.stars[a])delete S.stars[a];save();
  document.querySelectorAll(sel('star',a)).forEach(b=>{const on=!!S.stars[a];b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.textContent=route==='wing'?(on?'★ Starred for my project':'☆ Star this topic for my project'):(on?'★ Starred':'☆ Star');});
  toast(S.stars[a]?'★ Starred: '+W(a).title:'Star removed');},
 term(a){const [id,t]=a.split('|');const ta=$('#n-'+id);const add='Search: '+t;S.notes[id]=((S.notes[id]||'').trim()?(S.notes[id]||'').replace(/\s+$/,'')+'\n':'')+add;if(ta){ta.value=S.notes[id];}save();
  try{navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{});}catch(e){}toast('Added to your notes: <b>'+esc(t)+'</b>');},
 focus(a){S.focus=a;save();document.querySelectorAll('.focus-opt').forEach(b=>{const on=b.dataset.arg===a;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});const f=$('#focusShow');if(f)f.textContent=a;toast('Focus chosen ✓');},
 customfocus(){const v=($('#customFocus').value||'').trim();if(!v){toast('Type your focus first.');return;}ACT.focus(v);},
 qa(a){if(qz.ans[qz.i]!=null)return;qz.ans[qz.i]=+a;render();const n=$('#qnext');if(n)n.focus();},
 qnext(){qz.i++;if(qz.i>=QUIZ.length){S.quiz={score:qz.ans.filter((x,i)=>x===QUIZ[i].a).length,of:QUIZ.length,date:today()};save();}render();},
 retake(){qz={i:0,ans:[]};render();},
 certname(){const v=($('#certName').value||'').trim();if(v){S.name=v;save();render();}},
 printcert(){$('#printArea').innerHTML=certHTML('certPrint');window.print();},
 printnb(){$('#printArea').innerHTML=`<div class="pnb"><h1 style="font-family:Georgia">Field Notebook: ${esc(S.name||'')}</h1><p>Unsolved: The 1982 Chicago Tylenol Murders · ${today()}</p><p><b>Chosen focus:</b> ${esc(S.focus||'(not chosen)')}</p><h2>General notes</h2><pre>${esc(S.notes.general||'')}</pre>${WINGS.map(w=>`<h2>${w.n}. ${w.title}${S.stars[w.id]?' ★':''}${S.stamps[w.id]?' (stamped)':''}</h2><pre>${esc(S.notes[w.id]||'')}</pre>`).join('')}</div>`;window.print();},
 download(){const blob=new Blob([notebookText()],{type:'text/plain'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='tylenol-museum-notebook-'+((S.name||'student').replace(/[^a-z0-9]+/gi,'-').toLowerCase())+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Notebook downloaded ⬇');},
 reset(){if(confirm('Erase ALL your notes, stamps, stars and quiz results in this browser?')){S=defState();qz={i:0,ans:[]};save();location.hash='welcome';render();}}
};
function notebookText(){
 const L=[];L.push('FIELD NOTEBOOK: Unsolved: The 1982 Chicago Tylenol Murders (virtual museum)');L.push('Name: '+(S.name||''));L.push('Date: '+today());
 L.push('Chosen focus: '+(S.focus||'(not chosen)'));L.push('Stamps: '+stampCount()+'/8'+(S.quiz?'   Quiz: '+S.quiz.score+'/'+S.quiz.of:''));
 L.push('Starred topics: '+(WINGS.filter(w=>S.stars[w.id]).map(w=>w.title).join(', ')||'(none)'));L.push('');
 L.push('== GENERAL NOTES ==');L.push((S.notes.general||'').trim()||'(none)');L.push('');
 WINGS.forEach(w=>{L.push(`== ${w.n}. ${w.title.toUpperCase()} (${w.sub})${S.stars[w.id]?' [STARRED]':''}${S.stamps[w.id]?' [stamped]':''} ==`);L.push((S.notes[w.id]||'').trim()||'(no notes)');L.push('Research Spark questions:');w.sparks.forEach((q,i)=>L.push('  '+(i+1)+'. '+q));L.push('Search terms: '+w.terms.join('; '));L.push('');});
 return L.join('\r\n');
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return;}
 const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){e.preventDefault();if(a.getAttribute('aria-disabled')==='true'&&a.dataset.act!=='candle')return;ACT[a.dataset.act](a.dataset.arg,a);}
});
document.addEventListener('input',e=>{
 const k=e.target.dataset&&e.target.dataset.note;if(!k)return;S.notes[k]=e.target.value;saveSoon();
 const s=document.getElementById('sv-'+k);if(s){s.textContent='Saving...';clearTimeout(s._t);s._t=setTimeout(()=>{s.textContent='✓ Saved';},400);}
});
document.addEventListener('keydown',e=>{
 const t=e.target,typing=t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT');
 if(typing){if(e.key==='Enter'&&t.id==='nameIn'){ACT.start();}if(e.key==='Enter'&&t.id==='customFocus'){ACT.customfocus();}return;}
 if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.tagName!=='BUTTON'){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==='Escape'&&route!=='lobby'&&route!=='welcome'){go('lobby');return;}
 if(/^[1-8]$/.test(e.key)&&(route==='lobby'||route==='wing'||route==='passport')){go('wing/'+WINGS[+e.key-1].id);return;}
 if(route==='quiz'&&qz.i<QUIZ.length){const m='abcd'.indexOf(e.key.toLowerCase());if(m>=0&&qz.ans[qz.i]==null){ACT.qa(String(m));}}
});
window.addEventListener('beforeprint',()=>{if(!$('#printArea').innerHTML)$('#printArea').innerHTML=certHTML('certPrint');});
window.addEventListener('afterprint',()=>{$('#printArea').innerHTML='';});
window.addEventListener('beforeunload',save);

/* test hook */
window.TM={state:()=>S,wings:WINGS.map(w=>w.id),stampCount,notebookText,go,quiz:QUIZ};
render();
</script>
</body>
